<title>Cảnh hài Chồi Ơi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
/* Bố cục: một sân khấu 200:140 như .sbox của app; hàng nút màn bên dưới; ghi chú từng cảnh dưới cùng */
:root{
  --bg:#F6F1FA; --card:#FFFFFF; --ink:#361D46; --muted:#6E5A7C; --line:#E2D6EC;
  --yellow:#FCB515; --green:#58B592; --green-ink:#2A8060; --chip:#F0E8F7;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1D1424;--card:#2A1F33;--ink:#F3EAF9;--muted:#BBA8C9;--line:#45364F;--chip:#372A41;--green-ink:#7FD3B0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D1424;--card:#2A1F33;--ink:#F3EAF9;--muted:#BBA8C9;--line:#45364F;--chip:#372A41;--green-ink:#7FD3B0;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{margin:0;font-size:clamp(22px,4vw,30px);font-weight:900;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-weight:600;font-size:14px}
.stage-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px}
.stage{position:relative;aspect-ratio:200/140;width:100%;max-width:100%;border-radius:16px;overflow:hidden;container-type:size;background:#BFE6F7;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage>.nen{position:absolute;inset:0}.stage>.nen>svg{width:100%;height:100%;display:block}
.vat{position:absolute;translate:-50% 0;line-height:0}.vat svg{width:100%;height:auto;display:block;overflow:visible}
.stk{filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(3px 4px 0 rgba(58,27,73,.9))}
.stage .ch-q{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
.stage .ch-muon .ch-q{filter:none}
.bao{position:absolute;inset:auto 0 0 0;padding:6px 12px;font:800 clamp(11px,3.2cqh,15px)/1.3 var(--f-ui);color:#fff;background:rgba(54,29,70,.72);text-align:center}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.man{appearance:none;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:900 15px/1 var(--f-ui);border-radius:14px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.man small{font-weight:700;font-size:12px;color:var(--muted)}
.man[aria-pressed="true"]{background:var(--yellow);color:#361D46;border-color:#361D46}.man[aria-pressed="true"] small{color:#5A3E00}
.man:focus-visible,.toggle input:focus-visible+span{outline:3px solid var(--green);outline-offset:2px}
.toggles{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-left:auto}
.toggle{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;cursor:pointer}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle span{display:inline-flex;align-items:center;gap:8px}
.toggle span::before{content:'';width:34px;height:20px;border-radius:999px;background:var(--line);box-shadow:inset 0 0 0 2px var(--ink);transition:background .15s}
.toggle input:checked+span::before{background:var(--green)}
.status{font-weight:800;color:var(--green-ink);font-variant-numeric:tabular-nums;min-height:1.5em}
.note{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.note section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.note h2{margin:0 0 6px;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note p{margin:0;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips b{background:var(--chip);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px}
@media (max-width:640px){.note{grid-template-columns:1fr}.toggles{margin-left:0}.man{padding:8px 10px;font-size:14px}}
</style>

<div class="wrap">
  <header>
    <h1>Cảnh hài Unit 1 · bản mẫu</h1>
    <p>Bé chỉ xem, không chạm. Chưa có tiếng: chỗ có tiếng hiện chữ nhỏ.</p>
  </header>
  <div class="stage-card"><div class="stage" id="stage"></div></div>
  <div class="controls" id="nut"></div>
  <div class="controls">
    <div class="status" id="status">Bấm một màn để xem.</div>
    <div class="toggles">
      <label class="toggle" for="cham"><input type="checkbox" id="cham"><span>Chậm (x0,5)</span></label>
      <label class="toggle" for="giam"><input type="checkbox" id="giam"><span>Thử “giảm chuyển động”</span></label>
    </div>
  </div>
  <div class="note">
    <section><h2>Cảnh này</h2><p id="ta"></p></section>
    <section><h2>Tiếng cần gắn (app)</h2><div class="chips" id="tieng"></div></section>
  </div>
</div>

<script>/*@JS*/</script>
<script>
const NEN=/*@NEN*/{};
const APP=/*@APP*/{};
const H=CanhHai.HINH;
const MAN=[
 {ten:'Công viên',nen:'cong-vien-tron',ta:'Xong trò bong bóng có mặt: Polly mổ vỡ hai quả còn sót, quả to cuối cùng vỡ ngay trên mỏ. Bọt dính đầy, Polly đứng hình, lắc đầu rồi bay đi.',tieng:['[bụp] ×2','[BỤP!]','[phì phì]']},
 {ten:'Vườn đêm',nen:'vuon-nha-na-dem-tron',ta:'Con dơi ngủ treo ngược trên cành. Polly đậu cạnh, thử treo ngược, chóng mặt, lật lại, ngáp "Tired! Tired!" rồi rúc đầu vào cánh ngủ kiểu vẹt.',tieng:['[vụt] ×2','“Tired! Tired!” (có bản ghi)','[khò… khò…]']},
 {ten:'Nhà Na',nen:'phong-na-tron',ta:'Xong trò bắt đồ chơi rơi: mèo con nhảy từ kệ vào rổ, rổ lắc lục cục, mèo thò đầu ra đội con vịt cao su làm mũ.',tieng:['[meo!]','[bịch]','[lục cục]','[chít!]']},
 {ten:'Cửa hàng',nen:'sieu-thi-tron',ta:'Xong trò xe đẩy: Polly tha nải chuối to, vỗ cánh phành phạch, bay lên từng nấc, thả "bịch" vào xe, đậu lên tay đẩy thở hổn hển rồi bay đi.',tieng:['[phành phạch]','[bịch!]','[hộc hộc]']},
 {ten:'Công trường',nen:'cong-truong-xay-tron',ta:'Mở màn, mái tam giác còn dưới đất: Polly chui vào, mái đi lạch bạch, lòi hai chân vẹt. Cả đội "Oh!". Mái nhấc một bên, Polly thò ra "Triangle! Triangle!", bay đi; mái hạ về chỗ cũ.',tieng:['[lạch bạch] ×2','“Oh!” (cần thu)','“Triangle! Triangle!” (có bản ghi)','[cộp]']},
 {ten:'Một ngày',nen:'bep-tron',ta:'Bữa sáng: Na ăn chuối xong, Polly nhặt vỏ chuối đội làm mũ "Ba-na-na!", rồi bay tới thùng rác, thả vỏ vào, đóng nắp, bay đi.',tieng:['“Ba-na-na!” (có bản ghi)','[cạch] ×2']},
];
const stage=document.getElementById('stage'), nut=document.getElementById('nut'), st=document.getElementById('status');
let ac=null, cur=-1, run=0;
const vat=(svg,x,b,w,z=3,cls='')=>{const d=document.createElement('div');d.className='vat '+cls;d.style.cssText=`left:${x}%;bottom:${b}%;width:${w}%;z-index:${z}`;d.innerHTML=svg;stage.append(d);return d};
const kid=(k,x,b,w)=>{const d=vat(`<div class="ch-kit">${H[k+'-dung']}</div>`,x,b,w,3,'stk');d.dataset.kit=k;return d};
// dựng lại sân khấu của từng màn (như trang của app lúc cảnh hài bắt đầu)
function dung(i){
  stage.innerHTML=`<div class="nen">${NEN[MAN[i].nen]}</div>`;
  const o={};
  if(i===1){ const asp=200/140;
    vat(APP.tree,30,6,24,4,'stk');
    const c={x:58,b:58,w:40}; o.canh=vat(H['canh-cay'],c.x,c.b,c.w,3,'stk');
    const ub=c.b+(1-23/40)*c.w*(40/200)*asp, ux=c.x-c.w/2+.58*c.w, bw=6, bh=bw*(146/100)*asp;
    o.doi=vat(H['doi-ngu-treo-nguoc'],ux,ub-(1-5/146)*bh,bw,4,'stk') }
  if(i===2){ vat(APP.shelf,85,52,20,3); o.meo=vat(APP.cat,79.5,54.3,8,4,'stk'); o.ro=vat(APP.basket,50,2,21,4,'stk') }
  if(i===3){ o.xe=vat(APP.cart,22,3,25,4,'stk') }
  if(i===4){ vat(APP.house,88,12,22,2,'stk'); o.mai=vat(APP.roof,62,3,38,3,'stk'); o.ban=[kid('lam',8,3,11),kid('na',18,3,11),kid('ben',28,3,11)] }
  if(i===5){ o.na=kid('na',58,2,15); o.thung=vat(H['thung-rac'],87,4,9,3,'stk') }
  return o
}
async function chay(i){
  if(ac) ac.abort(); ac=new AbortController(); const me=++run;
  cur=i; [...nut.children].forEach((b,k)=>b.setAttribute('aria-pressed',k===i));
  document.getElementById('ta').textContent=MAN[i].ta;
  document.getElementById('tieng').innerHTML=MAN[i].tieng.map(t=>`<b>${t}</b>`).join('');
  const o=dung(i), cham=document.getElementById('cham').checked, giam=document.getElementById('giam').checked;
  st.textContent=`Màn ${i+1} đang chạy…`; await new Promise(r=>setTimeout(r,350)); if(me!==run) return;
  const t0=performance.now();
  const r=await CanhHai['man'+(i+1)](stage,{...o,speed:cham?2:1,signal:ac.signal,giamChuyenDong:giam});
  if(me!==run) return;
  const s=((performance.now()-t0)/1000).toFixed(1).replace('.',',');
  if(r.boQua){ const b=document.createElement('div');b.className='bao';b.textContent='Máy bật giảm chuyển động: cảnh hài được bỏ qua, app đi tiếp ngay.';stage.append(b); st.textContent=`Màn ${i+1}: bỏ qua (0 giây).` }
  else st.textContent=`Màn ${i+1} xong: ${s} giây${cham?' (chậm x0,5)':''}. Bấm lại để xem lại.`
}
MAN.forEach((m,i)=>{const b=document.createElement('button');b.className='man';b.type='button';b.id='man'+(i+1);b.setAttribute('aria-pressed','false');b.innerHTML=`Màn ${i+1}<small>${m.ten}</small>`;b.onclick=()=>chay(i);nut.append(b)});
// trạng thái ban đầu: sân khấu Màn 1 đã dựng sẵn
dung(0); document.getElementById('ta').textContent='Chọn một màn: cảnh chạy ngay trên đúng nơi đó. Bấm lại để chạy lại.';
</script>
