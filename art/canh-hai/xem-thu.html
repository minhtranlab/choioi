<title>Cảnh hài Chồi Ơi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
/* Bố cục: một sân khấu 200:140 như .sbox của app; hàng nút màn bên dưới; ghi chú từng cảnh dưới cùng */
:root{
  --bg:#F6F1FA; --card:#FFFFFF; --ink:#361D46; --muted:#6E5A7C; --line:#E2D6EC;
  --yellow:#FCB515; --green:#58B592; --green-ink:#2A8060; --chip:#F0E8F7;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1D1424;--card:#2A1F33;--ink:#F3EAF9;--muted:#BBA8C9;--line:#45364F;--chip:#372A41;--green-ink:#7FD3B0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D1424;--card:#2A1F33;--ink:#F3EAF9;--muted:#BBA8C9;--line:#45364F;--chip:#372A41;--green-ink:#7FD3B0;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{margin:0;font-size:clamp(22px,4vw,30px);font-weight:900;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-weight:600;font-size:14px}
.stage-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px}
.stage{position:relative;aspect-ratio:200/140;width:100%;max-width:100%;border-radius:16px;overflow:hidden;container-type:size;background:#BFE6F7;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage>.nen{position:absolute;inset:0}.stage>.nen>svg{width:100%;height:100%;display:block}
.vat{position:absolute;translate:-50% 0;line-height:0}.vat svg{width:100%;height:auto;display:block;overflow:visible}
.stk{filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(3px 4px 0 rgba(58,27,73,.9))}
.stage .ch-q{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
.stage .ch-muon .ch-q{filter:none}
.bao{position:absolute;inset:auto 0 0 0;padding:6px 12px;font:800 clamp(11px,3.2cqh,15px)/1.3 var(--f-ui);color:#fff;background:rgba(54,29,70,.72);text-align:center}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.man{appearance:none;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:900 15px/1 var(--f-ui);border-radius:14px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.man small{font-weight:700;font-size:12px;color:var(--muted)}
.man[aria-pressed="true"]{background:var(--yellow);color:#361D46;border-color:#361D46}.man[aria-pressed="true"] small{color:#5A3E00}
.man:focus-visible,.toggle input:focus-visible+span{outline:3px solid var(--green);outline-offset:2px}
.toggles{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-left:auto}
.toggle{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;cursor:pointer}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle span{display:inline-flex;align-items:center;gap:8px}
.toggle span::before{content:'';width:34px;height:20px;border-radius:999px;background:var(--line);box-shadow:inset 0 0 0 2px var(--ink);transition:background .15s}
.toggle input:checked+span::before{background:var(--green)}
.status{font-weight:800;color:var(--green-ink);font-variant-numeric:tabular-nums;min-height:1.5em}
.note{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.note section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.note h2{margin:0 0 6px;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note p{margin:0;max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips b{background:var(--chip);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px}
@media (max-width:640px){.note{grid-template-columns:1fr}.toggles{margin-left:0}.man{padding:8px 10px;font-size:14px}}
</style>

<div class="wrap">
  <header>
    <h1>Cảnh hài Unit 1 · bản mẫu</h1>
    <p>Bé chỉ xem, không chạm. Chữ nhỏ chỉ có ở trang này, thay cho tiếng; trong app là tiếng thật, không hiện chữ.</p>
  </header>
  <div class="stage-card"><div class="stage" id="stage"></div></div>
  <div class="controls" id="nut"></div>
  <div class="controls">
    <div class="status" id="status">Bấm một màn để xem.</div>
    <div class="toggles">
      <label class="toggle" for="cham"><input type="checkbox" id="cham"><span>Chậm (x0,5)</span></label>
      <label class="toggle" for="giam"><input type="checkbox" id="giam"><span>Thử “giảm chuyển động”</span></label>
    </div>
  </div>
  <div class="note">
    <section><h2>Cảnh này</h2><p id="ta"></p></section>
    <section><h2>Tiếng cần gắn (app)</h2><div class="chips" id="tieng"></div></section>
  </div>
</div>

<script>/* Cảnh hài Unit 1 (27/10) · phần chung cho 6 cảnh (man-1.js … man-6.js).
   Không dùng thư viện ngoài: chỉ Web Animations API (el.animate) và một ít CSS.
   Cách gọi một cảnh: const r = await CanhHai.man1(box, {…});  box là khung cảnh (trong app là .sbox, tỉ lệ 200/140).
   Mọi vị trí tính bằng % của box, giống kidAt(): x = tâm theo chiều ngang, b = đáy tính từ dưới lên, w = bề rộng.
   Tuỳ chọn chung cho mọi cảnh:
     speed   hệ số thời gian (1 = bình thường, 2 = chậm gấp đôi; trong app truyền SPEED)
     signal  AbortSignal: huỷ giữa chừng (bấm lại) → dọn sạch, Promise vẫn resolve
     am(key, chu, ai)  gọi ở mỗi chỗ có tiếng động / câu nói (app phát tiếng ở đây; ai = ai nói, vd. 'Lam'); xem bảng trong README
     chu     true: hiện chữ nhỏ "[bụp]", "Triangle! Triangle!" (mặc định: true khi không có am)
     giamChuyenDong  true/false: ép bật/tắt; mặc định theo máy (prefers-reduced-motion) → bật thì bỏ qua cảnh
   Promise trả về { xong:true, xoa() } (xoa() gỡ mọi thứ cảnh còn để lại), hoặc { boQua:true } khi máy bật giảm chuyển động. */
(function () {
  'use strict';
  const CH = window.CanhHai = window.CanhHai || {};
  CH.HINH = CH.HINH || {};
  const HUY = CH.HUY = { huy: true };

  CH.giamChuyenDong = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  CH.css = (id, text) => { if (document.getElementById(id)) return; const s = document.createElement('style'); s.id = id; s.textContent = text; document.head.append(s) };

  CH.css('ch-chung', `
.ch-sp{position:absolute;translate:-50% 0;pointer-events:none;z-index:6;line-height:0}
.ch-sp>.ch-in{position:relative;transform-origin:50% 100%}
.ch-q{position:relative}.ch-q.lat{transform:scaleX(-1)}
.ch-sp svg{display:block;width:100%;height:auto;overflow:visible}
.ch-pose>i{display:none}.ch-pose>i.on{display:block}
.ch-lop{position:absolute;inset:0}.ch-lop>svg{position:absolute;left:0;top:0}
.ch-bay .ch-pose>i.on{display:none}
.ch-bay .ch-pose>i.f1,.ch-bay .ch-pose>i.f2{display:block}
.ch-bay .ch-pose>i.f2{position:absolute;left:0;top:0;width:100%}
.ch-bay .ch-pose>i.f1{animation:chVoA var(--ch-vo,.3s) steps(1) infinite}
.ch-bay .ch-pose>i.f2{animation:chVoB var(--ch-vo,.3s) steps(1) infinite}
@keyframes chVoA{0%{visibility:visible}50%{visibility:hidden}}
@keyframes chVoB{0%{visibility:hidden}50%{visibility:visible}}
.ch-bay .ch-lop.theo-bay{transform:translateY(-3.846%)}
.ch-chu{position:absolute;z-index:30;translate:-50% 0;background:#fff;color:#361D46;font:900 clamp(10px,4cqh,18px)/1.15 Nunito,system-ui,sans-serif;padding:.22em .6em;border-radius:999px;border:2px solid #361D46;white-space:nowrap;pointer-events:none;box-shadow:0 2px 0 rgba(54,29,70,.25)}
.ch-chu.loi{background:#FFF3C4}
.ch-hat{position:absolute;pointer-events:none;z-index:9;border-radius:50%}
`);

  /** một lần chạy cảnh: hẹn giờ, chuyển động, hình tạm, dọn dẹp */
  function ctx(box, o) {
    const C = { box, o, sp: Math.max(.05, +o.speed || 1), anims: [], timers: [], rejs: [], els: [], back: [], dead: false };
    C.chu = o.chu != null ? !!o.chu : !o.am;
    const sig = o.signal;
    const stop = () => { if (C.dead) return; C.dead = true; C.timers.forEach(clearTimeout); C.rejs.forEach(r => r(HUY)); C.anims.forEach(a => { try { a.cancel() } catch (e) {} }) };
    if (sig) { if (sig.aborted) stop(); else sig.addEventListener('abort', stop, { once: true }) }
    C.stop = stop;
    C.ms = t => t * C.sp;
    C.cho = t => new Promise((res, rej) => { if (C.dead) return rej(HUY); C.rejs.push(rej); C.timers.push(setTimeout(res, C.ms(t))) });
    /** chạy một chuyển động trên el; chờ xong. giu: giữ trạng thái cuối */
    C.an = (el, kf, t, { ez = 'ease-in-out', giu = false, lap = 1, tre = 0, dir } = {}) => {
      if (C.dead) return Promise.reject(HUY);
      const a = el.animate(kf, { duration: C.ms(t), easing: ez, fill: giu ? 'forwards' : 'none', iterations: lap, delay: C.ms(tre), direction: dir });
      C.anims.push(a); return a.finished.catch(() => { throw HUY })
    };
    C.chay = (el, kf, t, opt) => { C.an(el, kf, t, opt).catch(() => {}) };   // chạy mà không chờ
    /** khung box (px) */
    C.R = () => box.getBoundingClientRect();
    /** vị trí một phần tử trong box, theo %: x tâm, b đáy, w rộng, h cao */
    C.rect = el => { const r = C.R(), q = el.getBoundingClientRect(); return { x: (q.left + q.width / 2 - r.left) / r.width * 100, b: (r.bottom - q.bottom) / r.height * 100, w: q.width / r.width * 100, h: q.height / r.height * 100 } };
    /** một hình (svg hoặc tên trong CanhHai.HINH) đặt vào box; W×H là khung svg */
    C.hinh = (art, { x = 50, b = 0, w = 10, z = 6, lat = false, cls = '' } = {}) => {
      const svg = CH.HINH[art] || art;
      const s = document.createElement('div'); s.className = 'ch-sp ' + cls;
      s.innerHTML = `<div class="ch-in"><div class="ch-q${lat ? ' lat' : ''}">${svg}</div></div>`;
      const vb = (svg.match(/viewBox="([^"]+)"/) || [, '0 0 100 100'])[1].split(/[\s,]+/).map(Number);
      s.W = vb[2]; s.H = vb[3]; s.w = w; s.lat = lat;
      C.dat(s, x, b); s.style.width = w + '%'; s.style.zIndex = z;
      box.append(s); C.els.push(s); return s
    };
    C.dat = (s, x, b) => { s.x = x; s.b = b; s.style.left = x + '%'; s.style.bottom = b + '%' };
    /** cao của hình s theo % box */
    C.cao = s => s.w * (s.H / s.W) * (C.R().width / C.R().height);
    /** đặt sao cho điểm (ax, ay) trong khung svg của s nằm ở (tx, tb) của box; trả {x, b} */
    C.neo = (s, ax, ay, tx, tb) => { const axx = s.lat ? s.W - ax : ax; return { x: tx - (axx / s.W - .5) * s.w, b: tb - (1 - ay / s.H) * C.cao(s) } };
    /** điểm (ax, ay) của khung svg s đang ở đâu trong box (%) */
    C.diem = (s, ax, ay) => { const axx = s.lat ? s.W - ax : ax; return { x: s.x + (axx / s.W - .5) * s.w, b: s.b + (1 - ay / s.H) * C.cao(s) } };
    /** di chuyển theo một hay nhiều điểm {x, b}; chờ xong */
    C.di = async (s, pts, t, ez = 'ease-in-out') => {
      pts = Array.isArray(pts) ? pts : [pts];
      const kf = [{ left: s.x + '%', bottom: s.b + '%' }, ...pts.map(p => ({ left: (p.x ?? s.x) + '%', bottom: (p.b ?? s.b) + '%', ...(p.o != null ? { offset: p.o } : {}) }))];
      const end = pts[pts.length - 1];
      await C.an(s, kf, t, { ez, giu: true });
      C.dat(s, end.x ?? s.x, end.b ?? s.b); C.anims.filter(a => a.effect && a.effect.target === s).forEach(a => { if (a.playState === 'finished') a.cancel() })
    };
    /** chuyển động trong (xoay, nhún, lắc) của hình s; không dời chỗ */
    C.lam = (s, kf, t, opt) => C.an(s.firstElementChild, kf, t, opt);
    /** lật mặt hình s (quay trái / phải) */
    C.quay = (s, lat) => { s.lat = lat; s.querySelector('.ch-q').classList.toggle('lat', lat) };
    /** tiếng động / câu nói: báo cho app (o.am), và hiện chữ nhỏ nếu cần. at: hình hoặc {x, b} */
    C.am = (key, chu, at, { loi = false, t = 1300, ai } = {}) => {
      try { o.am && o.am(key, chu, ai) } catch (e) {}
      if (!C.chu || C.dead) return;
      let x = 50, b = 70;
      if (at && at.nodeType) { const r = C.rect(at); x = r.x; b = r.b + r.h + 2 } else if (at) { x = at.x; b = at.b }
      const c = document.createElement('div'); c.className = 'ch-chu' + (loi ? ' loi' : ''); c.textContent = chu;
      c.style.left = Math.max(10, Math.min(90, x)) + '%'; c.style.bottom = Math.min(90, b) + '%';
      box.append(c); C.els.push(c);
      const cw = c.getBoundingClientRect().width / C.R().width * 100;   // chữ không tràn ra ngoài khung
      c.style.left = Math.max(cw / 2 + 1, Math.min(99 - cw / 2, x)) + '%';
      c.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1.08)', offset: .15 }, { opacity: 1, transform: 'scale(1)', offset: .3 }, { opacity: 1, offset: .8 }, { opacity: 0 }], { duration: C.ms(t) }).finished.then(() => c.remove(), () => c.remove())
    };
    /** mượn một phần tử có sẵn trong cảnh (rổ, mái nhà, mèo…): một bản sao đặt đúng chỗ để cảnh tự chuyển động; bản gốc ẩn tạm */
    C.muon = (el, { z = 6 } = {}) => {
      const r = C.rect(el), cl = el.cloneNode(true);
      cl.removeAttribute('id'); cl.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
      cl.style.cssText += ';position:relative;left:auto;right:auto;top:auto;bottom:auto;inset:auto;translate:none;transform:none;rotate:none;scale:none;width:100%;height:auto;margin:0;animation:none;transition:none;visibility:visible;opacity:1';
      const s = document.createElement('div'); s.className = 'ch-sp ch-muon';
      const inn = document.createElement('div'); inn.className = 'ch-in'; const q = document.createElement('div'); q.className = 'ch-q'; q.append(cl); inn.append(q); s.append(inn);
      s.W = 100; s.H = 100 * r.h / r.w * (C.R().height / C.R().width); s.w = r.w; s.lat = false;
      C.dat(s, r.x, r.b); s.style.width = r.w + '%'; s.style.zIndex = z;
      box.append(s); C.els.push(s);
      const was = el.style.visibility; el.style.visibility = 'hidden'; C.back.push(() => { el.style.visibility = was });
      s.goc = el; s.tra = () => { el.style.visibility = was; s.remove() };
      return s
    };
    /** Polly: một hình có mọi tư thế cần (tu = 'dung', 'noi', 'bay' (vỗ cánh), 'treo-nguoc', 'ngu', 'tha', 'tho-1'…) */
    C.polly = ({ x = 50, b = 50, w = 11, z = 7, lat = true, tu = 'bay', voMs = 300 } = {}) => {
      const P = n => CH.HINH['polly-' + n] || '';
      const poses = ['dung', 'noi', 'treo-nguoc', 'ngu', 'tho-1', 'tho-2'];
      const s = C.hinh(`<div class="ch-pose">${poses.map(p => `<i data-p="${p}">${P(p)}</i>`).join('')}<i class="f1">${P('bay-1')}</i><i class="f2">${P('bay-2')}</i></div>`, { x, b, w, z, lat, cls: 'ch-polly' });
      s.W = 200; s.H = 260;
      s.tu = n => {
        s._tu = n; const pose = s.querySelector('.ch-pose');
        s.classList.toggle('ch-bay', n === 'bay' || n === 'tha');
        if (n === 'tha') { pose.querySelector('.f1').innerHTML = P('tha-1'); pose.querySelector('.f2').innerHTML = P('tha-2') }
        else if (n === 'bay') { pose.querySelector('.f1').innerHTML = P('bay-1'); pose.querySelector('.f2').innerHTML = P('bay-2') }
        pose.querySelectorAll('i[data-p]').forEach(i => i.classList.toggle('on', i.dataset.p === n))
      };
      s.vo = msV => s.style.setProperty('--ch-vo', C.ms(msV) + 'ms');
      /** một lớp phủ cùng khung Polly (bọt trên mỏ, vỏ chuối đội đầu…); theoBay: dời lên theo thân khi bay */
      s.lop = (html, { theoBay = true, cls = '' } = {}) => { const l = document.createElement('div'); l.className = 'ch-lop ' + (theoBay ? 'theo-bay ' : '') + cls; l.innerHTML = html; s.querySelector('.ch-q').append(l); return l };
      s.vo(voMs); s.tu(tu);
      return s
    };
    /** mỏ Polly (đầu mỏ, khung 200×260): đứng (162, 118); bay cao hơn 10 */
    C.mo = p => C.diem(p, 162, p._tu === 'bay' || p._tu === 'tha' ? 108 : 118);
    /** vài hạt nhỏ bắn ra từ (x, b) (bọt, bụi): màu, số hạt, cỡ (% box) */
    C.hat = (x, b, { n = 7, mau = '#fff', vien = '#361D46', co = 1.6, xa = 7, t = 600 } = {}) => {
      const r = C.R();
      for (let i = 0; i < n; i++) {
        const d = document.createElement('i'); d.className = 'ch-hat';
        const sz = co * (0.6 + Math.random() * .8) * r.width / 100;
        d.style.cssText = `left:${x}%;bottom:${b}%;width:${sz}px;height:${sz}px;background:${mau};border:${vien ? `1.5px solid ${vien}` : 'none'};translate:-50% 50%`;
        box.append(d); C.els.push(d);
        const a = (i / n) * Math.PI * 2 + Math.random() * .6, dx = Math.cos(a) * xa * r.width / 100, dy = -Math.sin(a) * xa * r.width / 100;
        d.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${dx}px,${dy}px) scale(.4)`, opacity: 0 }], { duration: C.ms(t), easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' }).finished.then(() => d.remove(), () => d.remove())
      }
    };
    /** dọn: gỡ mọi hình tạm, trả lại phần tử đã mượn */
    C.xoa = () => { C.stop(); C.els.forEach(e => e.remove()); C.els = []; C.back.reverse().forEach(f => f()); C.back = [] };
    return C
  }

  /** chạy một cảnh: bỏ qua khi giảm chuyển động; dọn sạch khi bị huỷ */
  CH.chay = async (box, o = {}, fn) => {
    const giam = o.giamChuyenDong != null ? !!o.giamChuyenDong : CH.giamChuyenDong();
    if (!box || giam) return { boQua: true, xoa() {} };
    const C = ctx(box, o);
    try { await fn(C) }
    catch (e) { if (e !== HUY) { C.xoa(); throw e } C.xoa(); return { huy: true, xoa() {} } }
    const xoa = () => C.xoa();
    if (o.donCuoi) xoa();
    return { xong: true, xoa }
  };
})();

/* Màn 1 · Công viên · "Bong bóng vỡ trên mỏ" (khoảng 6,5 giây)
   Xong trò bong bóng có mặt: Polly bay ra mổ vỡ vài quả còn sót; quả cuối (to nhất) vỡ "bụp" ngay trên mỏ,
   bọt trắng dính đầy, Polly đứng hình, lắc đầu cho văng bọt, rồi bay đi.
   CanhHai.man1(box, { bongBong:[{x,b,w}…] (3 quả, quả cuối là quả to), bongBongSVG, vaoTu:{x,b}, raTai:{x,b}, …chung })
   Tiếng (am): 'bup' ×2 "[bụp]", 'bup-to' "[BỤP!]", 'lac' "[phì phì]".
   Kết thúc: không để lại gì (bong bóng vỡ hết, Polly bay khỏi khung). */
(function () {
  'use strict';
  const CH = window.CanhHai;
  const BONG = '<svg viewBox="0 0 40 40" overflow="visible"><circle cx="20" cy="20" r="18" fill="#DDF3FF" fill-opacity=".6" stroke="#3A1B49" stroke-width="2"/><path d="M9 15 q3 -7 11 -8" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round"/><circle cx="28" cy="28" r="2.6" fill="#fff" opacity=".85"/></svg>';

  CH.man1 = (box, o = {}) => CH.chay(box, o, async C => {
    const ds = o.bongBong || [{ x: 72, b: 46, w: 8 }, { x: 50, b: 56, w: 7 }, { x: 30, b: 42, w: 13 }];
    const bs = ds.map(q => {
      const s = C.hinh(o.bongBongSVG || BONG, { x: q.x, b: q.b, w: q.w, z: 5 });
      C.chay(s, [{ opacity: 0 }, { opacity: 1 }], 300);
      C.chay(s.firstElementChild, [{ transform: 'translateY(0)' }, { transform: 'translateY(-8%)' }], 900, { lap: Infinity, dir: 'alternate' });
      return s
    });
    const tam = s => ({ x: s.x, b: s.b + C.cao(s) / 2 });
    const vao = o.vaoTu || { x: 114, b: 70 };
    const p = C.polly({ x: vao.x, b: vao.b, lat: true, tu: 'bay' });

    // Polly bay tới, đầu mỏ chạm mép phải quả bóng
    const toi = async (s, t, sat = .42) => { const c = tam(s), d = C.neo(p, 162, 108, c.x + s.w * sat, c.b); await C.di(p, d, t) };
    const vo = s => {
      const c = tam(s); s.firstElementChild.getAnimations().forEach(a => a.cancel());
      C.chay(s, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.4)', opacity: 0 }], 160, { giu: true, ez: 'ease-out' });
      C.hat(c.x, c.b, { n: 8, mau: '#DDF3FF', co: 1.2 + s.w / 10, xa: s.w * .9, t: 450 });
      setTimeout(() => s.remove(), C.ms(200))
    };
    const mo = () => C.lam(p, [{ transform: 'none' }, { transform: 'translateX(-14%) rotate(-14deg)', offset: .5 }, { transform: 'none' }], 280);

    await C.cho(250);
    for (let i = 0; i < bs.length - 1; i++) {
      await toi(bs[i], i ? 700 : 950);
      const m = mo(); await C.cho(140); vo(bs[i]); C.am('bup', '[bụp]', tam(bs[i])); await m; await C.cho(120)
    }
    // quả cuối: to, vỡ ngay trên mỏ
    const big = bs[bs.length - 1];
    await toi(big, 800, .2);
    await C.cho(180);
    const m = mo(); await C.cho(140);
    vo(big); C.am('bup-to', '[BỤP!]', { x: big.x, b: tam(big).b + C.cao(big) * .7 }, { t: 1500 });
    const bot = p.lop(`<div style="position:absolute;inset:0;transform:scale(1.25);transform-origin:76% 45%">${CH.HINH['bot-mo-polly']}</div>`);
    C.chay(bot, [{ opacity: 0, transform: 'scale(.4)', transformOrigin: '80% 45%' }, { opacity: 1, transform: 'scale(1.1)', transformOrigin: '80% 45%', offset: .6 }, { opacity: 1, transform: 'scale(1)', transformOrigin: '80% 45%' }], 260);
    await m;
    // đứng hình: thôi vỗ cánh, tụt xuống một chút
    p.tu('dung'); await C.di(p, { b: p.b - 3 }, 380, 'ease-in'); await C.cho(260);
    p.tu('bay');
    // lắc đầu, bọt văng ra
    C.am('lac', '[phì phì]', p, { t: 1100 });
    const sh = C.lam(p, [{ transform: 'rotate(0)' }, { transform: 'rotate(14deg)' }, { transform: 'rotate(-14deg)' }, { transform: 'rotate(12deg)' }, { transform: 'rotate(-10deg)' }, { transform: 'rotate(0)' }], 850);
    await C.cho(200); let mm = C.mo(p); C.hat(mm.x, mm.b, { n: 6, co: 1.4, xa: 6 });
    await C.cho(380); mm = C.mo(p); C.hat(mm.x, mm.b, { n: 6, co: 1.2, xa: 6 });
    await sh;
    // bay đi (bọt vẫn còn dính trên mỏ)
    const ra = o.raTai || { x: -16, b: 96 };
    await C.di(p, ra, 1100, 'ease-in');
    p.remove()
  });
})();

/* Màn 2 · Vườn đêm · "Polly tập ngủ như dơi" (khoảng 8,5 giây)
   Xong trò đèn pin: Polly bay tới đậu trên cành cạnh con dơi đang ngủ treo ngược, thử treo ngược như dơi,
   chóng mặt (sao quay quanh đầu), lật lại đứng thẳng, ngáp "Tired! Tired!", rồi rúc đầu vào cánh ngủ kiểu vẹt.
   CanhHai.man2(box, { canh: {x,b,w} | phần tử cành (khung kit 200×40), doi: phần tử dơi (nếu cảnh đã có),
                       doiTai: 0..1 (chỗ dơi treo dọc cành, mặc định .58), dauTai: 0..1 (chỗ Polly đậu, .84), doiW, vaoTu, …chung })
   Không có cành / dơi thì cảnh tự vẽ (art/kit/do-vat/canh-cay, con-vat/doi-ngu-treo-nguoc).
   Tiếng (am): 'vut' "[vụt]" ×2, 'tired' "Tired! Tired!" (Polly; câu "Tired!" đã có bản ghi), 'ngu' "[khò… khò…]".
   Kết thúc: cành, dơi và Polly đang ngủ VẪN Ở LẠI (trang sau thay cả khung thì tự mất; muốn gỡ ngay: r.xoa()). */
(function () {
  'use strict';
  const CH = window.CanhHai;
  CH.css('ch-man2', `
.ch-sao{position:absolute;z-index:9;pointer-events:none;translate:-50% 50%;width:9%;aspect-ratio:1}
.ch-sao>i{position:absolute;inset:0;animation:chSaoQuay var(--t,900ms) linear infinite}
.ch-sao>i::before{content:'';position:absolute;left:42%;top:-8%;width:22%;aspect-ratio:1;background:#FFD21F;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
@keyframes chSaoQuay{to{transform:rotate(360deg)}}
.ch-z{position:absolute;z-index:9;pointer-events:none;font:900 clamp(10px,5cqh,22px)/1 Nunito,system-ui,sans-serif;color:#C9B4F0;-webkit-text-stroke:1px #3A1B49}
`);

  CH.man2 = (box, o = {}) => CH.chay(box, o, async C => {
    // cành: tự vẽ hoặc đo phần tử có sẵn (coi như khung kit 200×40: mặt trên y 14, mặt dưới y 24)
    let cs;
    if (o.canh && o.canh.nodeType) { const r = C.rect(o.canh); cs = { x: r.x, b: r.b, w: r.w, W: 200, H: 40, lat: false } }
    else { const q = o.canh || { x: 60, b: 58, w: 40 }; cs = C.hinh('canh-cay', { x: q.x, b: q.b, w: q.w, z: 5 }) }
    const treo = C.diem(cs, 200 * (o.doiTai ?? .58), 23);
    if (!o.doi) { const d = C.hinh('doi-ngu-treo-nguoc', { w: o.doiW || 6, z: 5 }); const n = C.neo(d, 50, 5, treo.x, treo.b); C.dat(d, n.x, n.b);
      d.firstElementChild.style.transformOrigin = '50% 3%'; C.chay(d.firstElementChild, [{ transform: 'rotate(-3deg)' }, { transform: 'rotate(3deg)' }], 1400, { lap: Infinity, dir: 'alternate' }) }

    const vao = o.vaoTu || { x: 114, b: 82 };
    const p = C.polly({ x: vao.x, b: vao.b, lat: true, tu: 'bay' });
    const tren = C.diem(cs, 200 * (o.dauTai ?? .84), 14), duoi = C.diem(cs, 200 * (o.dauTai ?? .84), 23);
    const inn = p.firstElementChild;

    // 1. bay tới, đậu trên cành cạnh dơi
    const dau = C.neo(p, 97, 241, tren.x, tren.b);
    await C.di(p, [{ x: (vao.x + dau.x) / 2, b: dau.b + 14 }, { x: dau.x, b: dau.b + 3 }], 1200);
    p.tu('dung'); C.dat(p, dau.x, dau.b);
    await C.lam(p, [{ transform: 'scaleY(1)' }, { transform: 'scaleY(.9)' }, { transform: 'scaleY(1)' }], 220);
    // 2. nhìn con dơi, nghiêng đầu
    inn.style.transformOrigin = '50% 100%';
    await C.lam(p, [{ transform: 'rotate(0)' }, { transform: 'rotate(-12deg)', offset: .3 }, { transform: 'rotate(-12deg)', offset: .7 }, { transform: 'rotate(0)' }], 900);
    // 3. lật xuống treo ngược như dơi
    C.am('vut', '[vụt]', p);
    await C.lam(p, [{ transform: 'scaleY(1)' }, { transform: 'scaleY(.05)' }], 150, { giu: true, ez: 'ease-in' });
    p.tu('treo-nguoc'); const ng = C.neo(p, 97, 20, duoi.x, duoi.b); C.dat(p, ng.x, ng.b);
    inn.getAnimations().forEach(a => a.cancel()); inn.style.transformOrigin = '50% 4%';
    await C.lam(p, [{ transform: 'scaleY(.05)' }, { transform: 'scaleY(1.06)' }, { transform: 'scaleY(1)' }], 260, { ez: 'ease-out' });
    // đung đưa, chóng mặt: sao quay quanh đầu (đầu đang ở dưới)
    const sao = document.createElement('div'); sao.className = 'ch-sao'; sao.innerHTML = '<i></i><i style="animation-delay:-300ms"></i><i style="animation-delay:-600ms"></i>';
    sao.style.setProperty('--t', C.ms(900) + 'ms'); box.append(sao); C.els.push(sao);
    const datSao = () => { const h = C.diem(p, 104, p._tu === 'treo-nguoc' ? 170 : 92); sao.style.left = h.x + '%'; sao.style.bottom = h.b + '%' };
    datSao(); C.chay(sao, [{ opacity: 0 }, { opacity: 1 }], 300);
    await C.lam(p, [{ transform: 'rotate(0)' }, { transform: 'rotate(12deg)' }, { transform: 'rotate(-12deg)' }, { transform: 'rotate(9deg)' }, { transform: 'rotate(-6deg)' }, { transform: 'rotate(0)' }], 1500);
    // 4. lật lại đứng thẳng, loạng choạng
    C.am('vut', '[vụt]', p);
    await C.lam(p, [{ transform: 'scaleY(1)' }, { transform: 'scaleY(.05)' }], 150, { giu: true, ez: 'ease-in' });
    p.tu('dung'); C.dat(p, dau.x, dau.b); datSao();
    inn.getAnimations().forEach(a => a.cancel()); inn.style.transformOrigin = '50% 96%';
    await C.lam(p, [{ transform: 'scaleY(.05)' }, { transform: 'scaleY(1)' }], 200, { ez: 'ease-out' });
    await C.lam(p, [{ transform: 'rotate(0)' }, { transform: 'rotate(-13deg)' }, { transform: 'rotate(11deg)' }, { transform: 'rotate(-7deg)' }, { transform: 'rotate(4deg)' }, { transform: 'rotate(0)' }], 1000);
    C.an(sao, [{ opacity: 1 }, { opacity: 0 }], 400, { giu: true }).catch(() => {});
    // 5. ngáp "Tired! Tired!"
    p.tu('noi'); C.am('tired', 'Tired! Tired!', p, { loi: true, t: 1400 });
    await C.lam(p, [{ transform: 'scale(1)' }, { transform: 'scale(1.05,.96)', offset: .5 }, { transform: 'scale(1)' }], 900);
    // 6. rúc đầu vào cánh ngủ (vẹt ngủ đứng, không treo ngược)
    p.tu('ngu');
    await C.lam(p, [{ transform: 'scaleY(1)' }, { transform: 'scaleY(.93)' }, { transform: 'scaleY(.97)' }], 500, { giu: true });
    C.am('ngu', '[khò… khò…]', p, { t: 1600 });
    const head = C.diem(p, 120, 70);
    for (let i = 0; i < 3; i++) {
      const z = document.createElement('b'); z.className = 'ch-z'; z.textContent = 'z'; z.style.left = head.x + '%'; z.style.bottom = head.b + '%';
      box.append(z); C.els.push(z);
      C.chay(z, [{ opacity: 0, transform: 'translate(0,0) scale(.6)' }, { opacity: 1, offset: .25 }, { opacity: 0, transform: 'translate(120%,-180%) scale(1.2)' }], 1300, { tre: i * 420, giu: true })
    }
    await C.cho(1900)
  });
})();

/* Màn 3 · Nhà Na · "Mèo con đội trống" (khoảng 6,5 giây)
   Xong trò bắt đồ chơi rơi: mèo con trên kệ nhìn cái rổ, lấy đà, nhảy vèo vào rổ, rổ lắc lục cục, trong rổ kêu "tùng",
   rồi mèo nhảy HẲN ra khỏi rổ, đáp xuống sàn cạnh rổ, đầu đội cái trống úp ngược (như cái xô), đứng nghiêng đầu cho bé nhìn rõ.
   CanhHai.man3(box, { meo: phần tử mèo (bắt buộc), ro: phần tử rổ (bắt buộc),
                       mu: svg làm mũ (mặc định cái trống của app ART.drum, bỏ dùi, úp ngược),
                       raDat: {x, b} chỗ mèo đáp (mặc định ngay cạnh rổ, phía giữa phòng), toRa: mèo to lên khi ra trước (1,35),
                       vanhRo: 0..1 (miệng rổ cách đỉnh rổ bao nhiêu phần chiều cao, mặc định .4 = ART.basket),
                       dauMeo: 0..1 (đỉnh đầu mèo, tính từ trên, mặc định .18 = CAT_SVG), …chung })
   Tiếng (am): 'meo' "[meo!]" ×2, 'bich' "[bịch]" ×2, 'luc-cuc' "[lục cục]", 'tung' "[tùng!]" (trống).
   Kết thúc: mèo đội trống ĐỨNG LẠI trên sàn cạnh rổ (bản sao mèo; mèo gốc đang ẩn; rổ đã trả lại). r.xoa() trả lại như cũ. */
(function () {
  'use strict';
  const CH = window.CanhHai;
  const INK = '#361D46', OL = `stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
  // cái trống của app (ART.drum) bỏ dùi, úp ngược: mặt trống ở dưới (đội lên đầu), thân đỏ ở trên
  const TRONG = `<svg viewBox="14 24 72 62" overflow="visible"><g transform="translate(0 110) scale(1 -1)"><path d="M18 40 V74 C18 82 82 82 82 74 V40" fill="#E8607E" ${OL}/><ellipse cx="50" cy="40" rx="32" ry="10" fill="#FFF3D6" ${OL}/><path d="M18 52 L34 76 L50 52 L66 76 L82 52" fill="none" stroke="#FCB515" stroke-width="3"/></g></svg>`;

  CH.man3 = (box, o = {}) => CH.chay(box, o, async C => {
    if (!o.meo || !o.ro) throw new Error('man3: cần o.meo và o.ro');
    const vanh = o.vanhRo ?? .4, dau = o.dauMeo ?? .18;
    const roSau = C.muon(o.ro, { z: 5 });                        // rổ (phía sau)
    const roTruoc = C.muon(o.ro, { z: 8 });                      // thân rổ phía trước: che phần mèo nằm trong rổ
    roTruoc.querySelector('.ch-q').style.clipPath = `inset(${vanh * 100}% 0 0 0)`;
    const m = C.muon(o.meo, { z: 6 });
    const mi = m.firstElementChild; mi.style.transformOrigin = '50% 100%';
    const hR = C.cao(roSau), hM = C.cao(m), mieng = roSau.b + hR * (1 - vanh);
    const veTrai = roSau.x < m.x;                                  // mèo nhảy sang trái?

    // 1. nhìn cái rổ, lấy đà
    await C.lam(m, [{ transform: 'rotate(0)' }, { transform: `rotate(${veTrai ? -14 : 14}deg)` }, { transform: 'rotate(0)' }], 600);
    await C.lam(m, [{ transform: 'scaleY(1)' }, { transform: 'scale(1.08,.8)' }], 260, { giu: true });
    // 2. nhảy vèo vào rổ
    C.am('meo', '[meo!]', m);
    const tren = { x: roSau.x, b: mieng + 4 }, dinh = { x: (m.x + roSau.x) / 2, b: Math.max(m.b, mieng) + 18 };
    mi.getAnimations().forEach(a => a.cancel());
    C.chay(mi, [{ transform: 'scale(.9,1.12) rotate(0)' }, { transform: `scale(1) rotate(${veTrai ? -20 : 20}deg)`, offset: .5 }, { transform: 'scale(1) rotate(0)' }], 760);
    await C.di(m, [{ x: dinh.x, b: dinh.b, o: .45 }, tren], 760, 'cubic-bezier(.3,.1,.5,1)');
    await C.di(m, { b: Math.max(roSau.b + 1, mieng - hM * .95) }, 220, 'ease-in');
    C.am('bich', '[bịch]', roSau);
    const nhun = [{ transform: 'scale(1,1)' }, { transform: 'scale(1.1,.86)' }, { transform: 'scale(.97,1.04)' }, { transform: 'scale(1)' }];
    C.chay(roSau.firstElementChild, nhun, 380); await C.lam(roTruoc, nhun, 380);
    // 3. rổ lắc lục cục, trong rổ kêu "tùng" (mèo vừa đội cái trống)
    C.am('luc-cuc', '[lục cục]', roSau);
    const lac = [{ transform: 'rotate(0)' }, { transform: 'rotate(-6deg)' }, { transform: 'rotate(5deg)' }, { transform: 'rotate(-4deg)' }, { transform: 'rotate(0)' }];
    for (const r of [roSau, roTruoc]) r.firstElementChild.style.transformOrigin = '50% 100%';
    C.chay(roSau.firstElementChild, lac, 800); await C.lam(roTruoc, lac, 800);
    C.am('tung', '[tùng!]', { x: roSau.x, b: mieng + 8 });
    C.chay(roSau.firstElementChild, nhun, 300); await C.lam(roTruoc, nhun, 300);
    await C.cho(150);
    // 4. nhảy hẳn ra khỏi rổ, đầu đội cái trống úp ngược
    const mu = document.createElement('div');
    mu.style.cssText = `position:absolute;left:10%;bottom:${(1 - dau) * 100 - 12}%;width:80%;transform:rotate(-6deg);transform-origin:50% 100%`;
    mu.innerHTML = o.mu || TRONG; m.querySelector('.ch-q').append(mu);
    m.style.zIndex = 9;                                            // ra trước thân rổ
    const sangPhai = o.raDat ? o.raDat.x > roSau.x : roSau.x <= 50;
    const dat = o.raDat || { x: roSau.x + (sangPhai ? 1 : -1) * (roSau.w / 2 + m.w * .9), b: roSau.b };
    C.am('meo', '[meo!]', { x: roSau.x, b: mieng + hM + 6 });
    m.style.transformOrigin = '50% 100%';                         // ra phía trước, to hơn một chút cho bé nhìn rõ
    C.chay(m, [{ scale: '1' }, { scale: String(o.toRa ?? 1.35) }], 780, { giu: true });
    C.chay(mi, [{ transform: 'rotate(0)' }, { transform: `rotate(${sangPhai ? 14 : -14}deg)`, offset: .5 }, { transform: 'rotate(0)' }], 780);
    await C.di(m, [{ x: roSau.x, b: mieng + hM * .2, o: .2 }, { x: (roSau.x + dat.x) / 2, b: mieng + hM * .9, o: .55 }, dat], 780, 'cubic-bezier(.3,.1,.5,1)');
    m.style.scale = String(o.toRa ?? 1.35);
    C.am('bich', '[bịch]', { x: dat.x, b: dat.b + hM * 1.6 });
    await C.lam(m, [{ transform: 'scale(1)' }, { transform: 'scale(1.12,.84)' }, { transform: 'scale(.96,1.06)' }, { transform: 'scale(1)' }], 320);
    roTruoc.tra(); roSau.tra();                                    // rổ xong việc: trả lại rổ gốc (đúng thứ tự ngược lúc mượn)
    // 5. đứng cho bé nhìn rõ: nghiêng đầu, cái trống lắc lư
    C.chay(mu, [{ transform: 'rotate(-6deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(-6deg)' }], 700, { lap: 2 });
    await C.lam(m, [{ transform: 'rotate(0)' }, { transform: 'rotate(-10deg)', offset: .25 }, { transform: 'rotate(-10deg)', offset: .45 }, { transform: 'rotate(9deg)', offset: .7 }, { transform: 'rotate(0)' }], 1300);
    await C.cho(500)
  });
})();

/* Màn 4 · Cửa hàng · "Polly tha nải chuối" (khoảng 9 giây)
   Xong trò xe đẩy: Polly cố tha cả một nải chuối to tới xe; nặng quá, vỗ cánh phành phạch, bay lên từng nấc
   (lên một chút lại tụt), tới trên xe thì thả "bịch" vào xe, đậu lên tay đẩy, nói "Big bananas! Big bananas!",
   rồi thở hổn hển, xong bay đi.
   CanhHai.man4(box, { xe: phần tử xe đẩy (bắt buộc),
                       xeTrong: {x, mieng, day, tayX, tayY} các tỉ lệ 0..1 trong khung xe (mặc định theo SHOPCART_SVG 120×90:
                                 lòng xe x .58, miệng y .25, đáy lòng y .64, tay đẩy (.1, .12)),
                       vaoTu, raTai, naiW (bề rộng nải chuối, % box; mặc định 1,35 × Polly), …chung })
   Tiếng (am): 'vo-canh' "[phành phạch]", 'bich' "[bịch!]", 'big-bananas' "Big bananas! Big bananas!" (Polly; CHƯA CÓ BẢN GHI),
   'tho' "[hộc hộc]".
   Kết thúc: nải chuối NẰM LẠI trong xe (bản sao xe + hình nải chuối); Polly đã bay đi. r.xoa() trả lại như cũ. */
(function () {
  'use strict';
  const CH = window.CanhHai;

  CH.man4 = (box, o = {}) => CH.chay(box, o, async C => {
    if (!o.xe) throw new Error('man4: cần o.xe');
    const T = Object.assign({ x: .58, mieng: .25, day: .64, tayX: .1, tayY: .12 }, o.xeTrong || {});
    const xe = C.muon(o.xe, { z: 6 }); xe.firstElementChild.style.transformOrigin = '50% 100%';
    const hX = C.cao(xe), trai = xe.x - xe.w / 2;
    const longX = trai + T.x * xe.w, mieng = xe.b + (1 - T.mieng) * hX, day = xe.b + (1 - T.day) * hX;
    const tay = { x: trai + T.tayX * xe.w, b: xe.b + (1 - T.tayY) * hX };

    const W = 11, vao = o.vaoTu || { x: 116, b: 14 };
    const p = C.polly({ x: vao.x, b: vao.b, w: W, lat: true, tu: 'tha', voMs: 130 });
    // nải chuối treo dưới chân Polly (cuống ở chỗ chân quặp (100, 244) của khung Polly)
    const naiTi = (o.naiW || W * 1.35) / W;
    const nai = p.lop(`<div style="position:absolute;left:${50 - naiTi * 50}%;top:91.5%;width:${naiTi * 100}%">${CH.HINH['nai-chuoi-to']}</div>`, { theoBay: false });
    const hP = C.cao(p), hN = naiTi * W * (102 / 126) * (C.R().width / C.R().height);
    const duoiNai = () => p.b - (hN - (hP * .085));                 // đáy nải chuối (% box)
    const bTheo = dn => dn + (hN - hP * .085);                      // Polly ở đâu để đáy nải ở dn

    // 1. lết vào sát mặt đất, nặng trĩu, chập chờn
    C.am('vo-canh', '[phành phạch]', { x: 80, b: 40 });
    const xToi = longX + 20, b0 = bTheo(4);
    await C.di(p, [{ x: (vao.x + xToi) / 2, b: b0 + 3, o: .3 }, { x: (vao.x + xToi) / 2 - 6, b: b0, o: .55 }, { x: xToi + 4, b: b0 + 3, o: .8 }, { x: xToi, b: b0 }], 1500);
    // 2. bay lên từng nấc: lên một chút, tụt lại một ít
    const bDich = bTheo(mieng + 3), nac = 3, buoc = (bDich - b0) / nac;
    for (let i = 1; i <= nac; i++) {
      C.lam(p, [{ transform: 'rotate(0)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(-4deg)' }, { transform: 'rotate(0)' }], 400).catch(() => {});
      await C.di(p, { b: b0 + buoc * i + 3 }, 380, 'ease-out');
      await C.di(p, { b: b0 + buoc * i - (i < nac ? 1.5 : 0) }, 220, 'ease-in')
    }
    if (C.dead) return;
    // 3. kéo sang, tới ngay trên lòng xe
    await C.di(p, { x: longX }, 650);
    await C.cho(150);
    // 4. thả "bịch"
    const r = C.rect(nai.firstElementChild);
    nai.remove();
    const n = C.hinh('nai-chuoi-to', { x: r.x, b: r.b, w: r.w, z: 7 });
    p.tu('bay'); p.vo(300);
    C.di(p, { b: p.b + 9 }, 380, 'ease-out').catch(() => {});
    await C.di(n, { b: day }, 300, 'ease-in');
    C.am('bich', '[bịch!]', xe);
    C.chay(n.firstElementChild, [{ transform: 'scale(1)' }, { transform: 'scale(1.08,.88) rotate(-4deg)' }, { transform: 'scale(1) rotate(-6deg)' }], 300, { giu: true });
    await C.lam(xe, [{ transform: 'scale(1)' }, { transform: 'scale(1.05,.9)' }, { transform: 'scale(.98,1.03)' }, { transform: 'scale(1)' }], 380);
    // 5. đậu lên tay đẩy, nói "Big bananas! Big bananas!", rồi thở hổn hển
    C.quay(p, false);
    const dau = C.neo(p, 97, 241, tay.x, tay.b);
    await C.di(p, [{ x: (p.x + dau.x) / 2, b: Math.max(p.b, dau.b) + 6 }, { x: dau.x, b: dau.b + 2 }], 600);
    p.tu('noi'); C.dat(p, dau.x, dau.b);
    p.firstElementChild.style.transformOrigin = '50% 100%';
    C.am('big-bananas', 'Big bananas! Big bananas!', p, { loi: true, t: 1700 });
    await C.lam(p, [{ transform: 'rotate(0)' }, { transform: 'rotate(10deg)' }, { transform: 'rotate(0)' }, { transform: 'rotate(10deg)' }, { transform: 'rotate(0)' }], 1500);
    C.am('tho', '[hộc hộc]', p, { t: 1300 });
    for (let i = 0; i < 4; i++) {
      p.tu(i % 2 ? 'tho-2' : 'tho-1');
      await C.lam(p, [{ transform: 'scale(1)' }, { transform: i % 2 ? 'scale(.97,1.02)' : 'scale(1.04,.95)' }], 260, { giu: true })
    }
    p.firstElementChild.getAnimations().forEach(a => a.cancel());
    // 6. bay đi
    p.tu('bay');
    const ra = o.raTai || { x: -16, b: 92 };
    C.quay(p, ra.x < p.x);
    await C.di(p, ra, 900, 'ease-in');
    p.remove()
  });
})();

/* Màn 5 · Công trường · "Mái nhà biết đi" (khoảng 7 giây)
   Đầu trang, mái nhà tam giác nằm sẵn dưới đất; Polly đã trốn sẵn bên dưới (bé không thấy Polly chui vào).
   Cái mái tự nhấc lên, lòi ra hai chân vẹt, đi lạch bạch qua rồi đi lại. Cả đội mặt rất ngạc nhiên, mỗi bạn "Oh!".
   Mái nhấc lên một bên, lộ ra Polly: "Triangle! Triangle!", Polly bay đi, mái hạ xuống "cộp" đúng chỗ cũ.
   Sau đó app cho cần cẩu nhấc mái lên, trò cũ chạy tiếp.
   CanhHai.man5(box, { mai: phần tử mái nhà (bắt buộc, đang nằm dưới đất), ban: [phần tử Lam, Na, Ben…],
                       doiMat(el, 'surprised' | null): đổi mặt một bạn (app: setKidFace); mặc định đổi hình kit <ten>-ngac-nhien
                       nếu phần tử có data-kit="lam|na|ben", diXa (% box mái đi, mặc định 8), raTai, …chung })
   Tiếng (am): 'lach-bach' "[lạch bạch]" ×2, 'oh' "Oh!" mỗi bạn một lần (am nhận thêm tên bạn: 'Lam', 'Na', 'Ben';
   CHƯA CÓ BẢN GHI), 'triangle' "Triangle! Triangle!" (Polly; đã có bản ghi "Triangle!"), 'cop' "[cộp]".
   Kết thúc: mái về đúng chỗ cũ (bản gốc hiện lại), mặt các bạn trở lại như trước, Polly đã bay đi. Không để lại gì. */
(function () {
  'use strict';
  const CH = window.CanhHai;
  const TEN = { lam: 'Lam', na: 'Na', ben: 'Ben', choi: 'Chồi' };

  CH.man5 = (box, o = {}) => CH.chay(box, o, async C => {
    if (!o.mai) throw new Error('man5: cần o.mai');
    const m = C.muon(o.mai, { z: 8 }), mi = m.firstElementChild;
    const dat0 = { x: m.x, b: m.b }, hM = C.cao(m);
    const ban = o.ban || [];
    const tenOf = el => el.dataset.who || TEN[el.dataset.kit] || '';
    const doiMat = o.doiMat || ((el, f) => {
      const k = el.dataset.kit, sv = el.querySelector('.ch-kit') || el; if (!k) return;
      if (f) { if (sv._was == null) { sv._was = sv.innerHTML; C.back.push(() => { if (sv._was != null) { sv.innerHTML = sv._was; sv._was = null } }) } sv.innerHTML = CH.HINH[k + '-ngac-nhien'] }
      else if (sv._was != null) { sv.innerHTML = sv._was; sv._was = null }
    });
    // Polly trốn sẵn dưới mái: có mặt nhưng ẩn, đứng giữa mái
    const p = C.polly({ x: m.x, b: m.b, lat: false, tu: 'dung', z: 6 });
    p.style.visibility = 'hidden';

    await C.cho(400);
    // 1. cái mái nhúc nhích, rồi tự nhấc lên, lòi hai chân vẹt
    await C.lam(m, [{ transform: 'rotate(0)' }, { transform: 'rotate(-2deg)' }, { transform: 'rotate(2deg)' }, { transform: 'rotate(0)' }], 300);
    await C.cho(200);
    const nhac = Math.max(3, hM * .22);
    await C.di(m, { b: dat0.b + nhac }, 220, 'ease-out');
    const chan = C.hinh('polly-chan-1', { w: p.w * 2.4, z: 7 });
    const datChan = () => { const n = C.neo(chan, 98, 252, m.x, dat0.b); C.dat(chan, n.x, n.b) };
    datChan();
    C.chay(chan, [{ opacity: 0 }, { opacity: 1 }], 120);
    let k = 0; const buoc = setInterval(() => { k++; chan.querySelector('.ch-q').innerHTML = CH.HINH[k % 2 ? 'polly-chan-2' : 'polly-chan-1'] }, C.ms(170));
    C.timers.push(buoc); C.back.push(() => clearInterval(buoc));
    // 2. đi lạch bạch sang một bên rồi đi lại
    const xa = o.diXa ?? 8;
    const di = async (dx) => {
      C.am('lach-bach', '[lạch bạch]', { x: m.x, b: dat0.b + hM + 6 });
      const lac = C.lam(m, [{ transform: 'rotate(0) translateY(0)' }, { transform: 'rotate(-4deg) translateY(-6%)' }, { transform: 'rotate(0) translateY(0)' }, { transform: 'rotate(4deg) translateY(-6%)' }, { transform: 'rotate(0) translateY(0)' }], 560, { lap: 2 });
      const tg = m.x + dx, x0 = m.x, t0 = performance.now(), dur = C.ms(1120);
      const theo = () => { if (C.dead) return; const f = Math.min(1, (performance.now() - t0) / dur); C.dat(m, x0 + (tg - x0) * f, m.b); datChan(); if (f < 1) requestAnimationFrame(theo) };
      requestAnimationFrame(theo); await lac; C.dat(m, tg, m.b); datChan()
    };
    const ve = ban.length && C.rect(ban[0]).x < m.x ? -1 : 1;     // đi về phía các bạn trước
    const diDau = di(ve * xa);
    // 3. cả đội mặt rất ngạc nhiên, mỗi bạn "Oh!"
    await C.cho(450);
    for (const el of ban) {
      doiMat(el, 'surprised');
      C.chay(el, [{ transform: 'translateY(0)' }, { transform: 'translateY(-8%)' }, { transform: 'translateY(0)' }], 340);
      C.am('oh', 'Oh!', el, { loi: true, ai: tenOf(el), t: 1100 });
      await C.cho(260)
    }
    await diDau;
    await di(-ve * xa);
    clearInterval(buoc);
    // 4. mái nhấc lên một bên, lộ ra Polly: "Triangle! Triangle!"
    mi.style.transformOrigin = '2% 100%';
    const mo = C.lam(m, [{ transform: 'rotate(0)' }, { transform: 'rotate(-20deg)' }], 320, { giu: true, ez: 'ease-out' });
    C.chay(chan, [{ opacity: 1 }, { opacity: 0 }], 150, { giu: true });
    C.dat(p, C.neo(p, 97, 250, m.x + m.w * .3, dat0.b).x, dat0.b);
    p.tu('noi'); p.style.visibility = '';
    C.chay(p, [{ opacity: 0 }, { opacity: 1 }], 150);
    await mo;
    const ngoai = C.neo(p, 97, 250, m.x + m.w / 2 + 3, dat0.b);
    await C.di(p, ngoai, 260, 'cubic-bezier(.3,1.5,.5,1)');
    chan.remove();
    C.am('triangle', 'Triangle! Triangle!', p, { loi: true, t: 1600 });
    p.firstElementChild.style.transformOrigin = '50% 100%';
    await C.lam(p, [{ transform: 'rotate(0)' }, { transform: 'rotate(8deg)' }, { transform: 'rotate(0)' }, { transform: 'rotate(8deg)' }, { transform: 'rotate(0)' }], 1100);
    // 5. Polly bay đi, mái hạ xuống "cộp"
    p.tu('bay'); const ra = o.raTai || { x: 116, b: 92 };
    C.di(p, ra, 900, 'ease-in').then(() => p.remove(), () => {});
    await C.cho(250);
    mi.getAnimations().forEach(a => a.cancel());
    await C.lam(m, [{ transform: 'rotate(-20deg)' }, { transform: 'rotate(0)' }], 200, { ez: 'ease-in' });
    await C.di(m, { b: dat0.b }, 120, 'ease-in');
    C.am('cop', '[cộp]', m);
    C.hat(m.x - m.w * .45, dat0.b + 1, { n: 4, mau: '#D9C7A8', vien: '', co: 1.6, xa: 4 });
    C.hat(m.x + m.w * .45, dat0.b + 1, { n: 4, mau: '#D9C7A8', vien: '', co: 1.6, xa: 4 });
    await C.lam(m, [{ transform: 'scale(1)' }, { transform: 'scale(1.03,.92)' }, { transform: 'scale(1)' }], 220);
    await C.cho(600);
    ban.forEach(el => doiMat(el, null));
    m.tra();
    await C.cho(300)
  });
})();

/* Màn 6 · Một ngày · "Mũ vỏ chuối" (khoảng 7 giây)
   Bữa sáng ba-na-na: Na ăn chuối xong, Polly bay xuống nhặt vỏ chuối, đội lên đầu làm mũ: "Ba-na-na!" (nhún ba cái
   theo ba tiếng), rồi bay tới thùng rác trong bếp, nắp mở "cạch", thả vỏ vào, nắp đóng "cạch", bay đi.
   CanhHai.man6(box, { vo: {x, b, w} chỗ vỏ chuối nằm (mặc định trên quầy, chỗ đĩa chuối của app: x 30, b 46, w 7),
                       thung: phần tử thùng rác có <g class="nap"> (art/kit/do-vat/thung-rac) | {x, b, w} để cảnh tự vẽ,
                       na: phần tử Na (nhún theo), vaoTu, raTai, …chung })
   Tiếng (am): 'banana' "Ba-na-na!" (Polly; câu đã có bản ghi), 'cach' "[cạch]" ×2.
   Kết thúc: vỏ chuối đã vào thùng, Polly bay đi; thùng rác (nếu cảnh tự vẽ) VẪN Ở LẠI. r.xoa() gỡ. */
(function () {
  'use strict';
  const CH = window.CanhHai;

  CH.man6 = (box, o = {}) => CH.chay(box, o, async C => {
    const vq = o.vo || { x: 30, b: 46, w: 7 };
    const v = C.hinh('vo-chuoi', { x: vq.x, b: vq.b, w: vq.w, z: 6 });
    C.chay(v, [{ opacity: 0 }, { opacity: 1 }], 250);
    let t;
    if (o.thung && o.thung.nodeType) t = C.muon(o.thung, { z: 6 });
    else { const q = o.thung || { x: 88, b: 3, w: 9 }; t = C.hinh('thung-rac', { x: q.x, b: q.b, w: q.w, z: 6 }) }
    const nap = t.querySelector('g.nap'); if (nap) { nap.style.transformBox = 'view-box'; nap.style.transformOrigin = '6px 22px' }
    const hT = C.cao(t);

    // 1. Polly bay xuống, đáp cạnh vỏ chuối
    const vao = o.vaoTu || { x: 112, b: 88 };
    const p = C.polly({ x: vao.x, b: vao.b, lat: true, tu: 'bay' });
    const dat = C.neo(p, 97, 250, v.x + v.w * .5 + 5, v.b);
    await C.di(p, [{ x: (vao.x + dat.x) / 2, b: dat.b + 20 }, { x: dat.x, b: dat.b + 3 }], 1000);
    p.tu('dung'); C.dat(p, dat.x, dat.b);
    p.firstElementChild.style.transformOrigin = '50% 100%';
    await C.lam(p, [{ transform: 'rotate(0)' }, { transform: 'rotate(-16deg)', offset: .4 }, { transform: 'rotate(-16deg)', offset: .7 }, { transform: 'rotate(0)' }], 650);
    // 2. hất vỏ chuối lên, rơi đúng lên đầu thành cái mũ
    const dau = C.diem(p, 104, 34);
    const hv = C.cao(v);
    await C.di(v, [{ x: (v.x + dau.x) / 2, b: dau.b + hv * 1.4, o: .55 }, { x: dau.x, b: dau.b - hv * .25 }], 520, 'ease-out');
    v.remove();
    const mu = p.lop(`<div style="position:absolute;left:28%;top:-5%;width:48%;transform:rotate(-8deg)">${CH.HINH['vo-chuoi']}</div>`);
    C.chay(mu, [{ transform: 'translateY(-4%)' }, { transform: 'translateY(1%)' }, { transform: 'translateY(0)' }], 220);
    await C.cho(200);
    // 3. "Ba-na-na!" nhún ba cái
    p.tu('noi'); C.am('banana', 'Ba-na-na!', p, { loi: true, t: 1500 });
    if (o.na) C.chay(o.na, [{ transform: 'translateY(0)' }, { transform: 'translateY(-6%)' }, { transform: 'translateY(0)' }], 300, { lap: 3, tre: 60 });
    for (let i = 0; i < 3; i++) await C.lam(p, [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-12%) scale(.96,1.05)' }, { transform: 'translateY(0) scale(1.05,.94)', offset: .85 }, { transform: 'translateY(0) scale(1)' }], 320);
    await C.cho(150);
    // 4. bay tới thùng rác, nắp mở, thả vỏ vào, nắp đóng
    p.tu('bay'); C.quay(p, t.x < p.x);
    const tren = { x: t.x, b: t.b + hT + 4 };
    await C.di(p, [{ x: (p.x + tren.x) / 2, b: Math.max(p.b, tren.b) + 12 }, tren], 950);
    if (nap) await C.an(nap, [{ transform: 'rotate(0)' }, { transform: 'rotate(-80deg)' }], 220, { giu: true, ez: 'ease-out' });
    C.am('cach', '[cạch]', t);
    await C.cho(150);
    const r = C.rect(mu.firstElementChild); mu.remove();
    const roi = C.hinh('vo-chuoi', { x: r.x, b: r.b, w: r.w, z: 5 });
    C.chay(roi.firstElementChild, [{ transform: 'rotate(-8deg)' }, { transform: 'rotate(20deg)' }], 320, { giu: true });
    C.di(p, { b: p.b + 5 }, 300, 'ease-out').catch(() => {});
    await C.di(roi, { x: t.x, b: t.b + hT * .25 }, 320, 'ease-in');
    roi.remove();
    await C.cho(120);
    if (nap) await C.an(nap, [{ transform: 'rotate(-80deg)' }, { transform: 'rotate(0)' }], 170, { giu: true, ez: 'ease-in' });
    C.am('cach', '[cạch]', t);
    C.lam(t, [{ transform: 'scale(1)' }, { transform: 'scale(1.04,.95)' }, { transform: 'scale(1)' }], 200).catch(() => {});
    // 5. bay đi
    const ra = o.raTai || { x: 116, b: 96 };
    C.quay(p, ra.x < p.x);
    await C.di(p, ra, 900, 'ease-in');
    p.remove();
    if (t.tra) t.tra()
  });
})();
</script>

 {ten:'Vườn đêm',nen:'vuon-nha-na-dem-tron',ta:'Con dơi ngủ treo ngược trên cành mọc ra từ thân cây. Polly đậu cạnh, thử treo ngược, chóng mặt, lật lại, ngáp "Tired! Tired!" rồi rúc đầu vào cánh ngủ kiểu vẹt.',tieng:['[vụt] ×2','“Tired! Tired!” (có bản ghi)','[khò… khò…]']},
 {ten:'Nhà Na',nen:'phong-na-tron',ta:'Xong trò bắt đồ chơi rơi: mèo con nhảy từ kệ vào rổ, rổ lắc lục cục, kêu "tùng", rồi mèo nhảy hẳn ra, đầu đội cái trống úp ngược như cái xô, đứng nghiêng đầu.',tieng:['[meo!] ×2','[bịch] ×2','[lục cục]','[tùng!] (tiếng trống)']},
 {ten:'Cửa hàng',nen:'sieu-thi-tron',ta:'Xong trò xe đẩy: Polly tha nải chuối to, vỗ cánh phành phạch, bay lên từng nấc, thả "bịch" vào xe, đậu lên tay đẩy nói "Big bananas! Big bananas!", thở hổn hển rồi bay đi.',tieng:['[phành phạch]','[bịch!]','“Big bananas! Big bananas!” (cần thu)','[hộc hộc]']},
 {ten:'Công trường',nen:'cong-truong-xay-tron',ta:'Mở màn, mái tam giác nằm dưới đất (Polly trốn sẵn bên dưới). Mái tự đi lạch bạch, lòi hai chân vẹt; Lam, Na, Ben mặt rất ngạc nhiên, mỗi bạn "Oh!". Mái nhấc một bên, lộ Polly "Triangle! Triangle!", bay đi; mái hạ về chỗ cũ. Sau đó trong app cần cẩu mới nhấc mái lên.',tieng:['[lạch bạch] ×2','“Oh!” Lam, Na, Ben (cần thu)','“Triangle! Triangle!” (có bản ghi)','[cộp]']},
 {ten:'Một ngày',nen:'bep-tron',ta:'Bữa sáng: Na ăn chuối xong, Polly nhặt vỏ chuối đội làm mũ "Ba-na-na!", rồi bay tới thùng rác, thả vỏ vào, đóng nắp, bay đi.',tieng:['“Ba-na-na!” (có bản ghi)','[cạch] ×2']},
];
const stage=document.getElementById('stage'), nut=document.getElementById('nut'), st=document.getElementById('status');
let ac=null, cur=-1, run=0;
const vat=(svg,x,b,w,z=3,cls='')=>{const d=document.createElement('div');d.className='vat '+cls;d.style.cssText=`left:${x}%;bottom:${b}%;width:${w}%;z-index:${z}`;d.innerHTML=svg;stage.append(d);return d};
const kid=(k,x,b,w)=>{const d=vat(`<div class="ch-kit">${H[k+'-dung']}</div>`,x,b,w,3,'stk');d.dataset.kit=k;return d};
// dựng lại sân khấu của từng màn (như trang của app lúc cảnh hài bắt đầu)
function dung(i){
  stage.innerHTML=`<div class="nen">${NEN[MAN[i].nen]}</div>`;
  const o={};
  if(i===1){ const asp=200/140;
    vat(APP.tree,30,6,24,4,'stk');
    const c={x:50,b:28,w:40}; o.canh=vat(H['canh-cay'],c.x,c.b,c.w,3,'stk');   // gốc cành nằm sau thân cây: cành mọc ra từ thân
    const ub=c.b+(1-23/40)*c.w*(40/200)*asp, ux=c.x-c.w/2+.58*c.w, bw=6, bh=bw*(146/100)*asp;
    o.doi=vat(H['doi-ngu-treo-nguoc'],ux,ub-(1-5/146)*bh,bw,4,'stk') }
  if(i===2){ vat(APP.shelf,85,52,20,3); o.meo=vat(APP.cat,79.5,54.3,8,4,'stk'); o.ro=vat(APP.basket,50,2,21,4,'stk') }
  if(i===3){ o.xe=vat(APP.cart,22,3,25,4,'stk') }
  if(i===4){ vat(APP.house,88,12,22,2,'stk'); o.mai=vat(APP.roof,62,3,38,3,'stk'); o.ban=[kid('lam',8,3,11),kid('na',18,3,11),kid('ben',28,3,11)] }
  if(i===5){ o.na=kid('na',58,2,15); o.thung=vat(H['thung-rac'],87,4,9,3,'stk') }
  return o
}
async function chay(i){
  if(ac) ac.abort(); ac=new AbortController(); const me=++run;
  cur=i; [...nut.children].forEach((b,k)=>b.setAttribute('aria-pressed',k===i));
  document.getElementById('ta').textContent=MAN[i].ta;
  document.getElementById('tieng').innerHTML=MAN[i].tieng.map(t=>`<b>${t}</b>`).join('');
  const o=dung(i), cham=document.getElementById('cham').checked, giam=document.getElementById('giam').checked;
  st.textContent=`Màn ${i+1} đang chạy…`; await new Promise(r=>setTimeout(r,350)); if(me!==run) return;
  const t0=performance.now();
  const r=await CanhHai['man'+(i+1)](stage,{...o,speed:cham?2:1,signal:ac.signal,giamChuyenDong:giam});
  if(me!==run) return;
  const s=((performance.now()-t0)/1000).toFixed(1).replace('.',',');
  if(r.boQua){ const b=document.createElement('div');b.className='bao';b.textContent='Máy bật giảm chuyển động: cảnh hài được bỏ qua, app đi tiếp ngay.';stage.append(b); st.textContent=`Màn ${i+1}: bỏ qua (0 giây).` }
  else st.textContent=`Màn ${i+1} xong: ${s} giây${cham?' (chậm x0,5)':''}. Bấm lại để xem lại.`
}
MAN.forEach((m,i)=>{const b=document.createElement('button');b.className='man';b.type='button';b.id='man'+(i+1);b.setAttribute('aria-pressed','false');b.innerHTML=`Màn ${i+1}<small>${m.ten}</small>`;b.onclick=()=>chay(i);nut.append(b)});
// trạng thái ban đầu: sân khấu Màn 1 đã dựng sẵn
dung(0); document.getElementById('ta').textContent='Chọn một màn: cảnh chạy ngay trên đúng nơi đó. Bấm lại để chạy lại.';
</script>
