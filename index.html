addFormat('findFeeling','help',async(sk,rounds,opt={})=>{
  const pool=sk.p.set==='all'?HELP:HELP.filter(h=>sk.p.set.includes(h.f)); const deck=opt.list?opt.list.slice():shuffle(pool.length?pool:HELP);
  await say('Let’s help our friends!','Mình cùng giúp các bạn nhé!');
  const round=async(H,demo)=>{
    const c=card(); const SC=feelScene(H.f,H.name,H.scene); SC.el.classList.add('withq'); SC.el.dataset.noreplay='1'; c.append(SC.el); const fr=SC.kid();
    await SC.play({hide:true}); await say(H.en,H.vi);
    const others=shuffle(FEELS.filter(f=>f!==H.f&&(sk.p.set==='all'||sk.p.set.includes(f)))).slice(0,2); const set=shuffle([H.f,...others]);
    const [row,opts]=optRow(set.map(f=>kidHead(H.name,f)),'small kidhead'); c.append(row); await reveal(opts);
    const ask=()=>say(`How does ${H.name} feel?`,`Bạn ${H.name} cảm thấy thế nào?`);
    let ok=true;
    if(demo){ await ask(); await Hand.moveTo(center(opts[set.indexOf(H.f)])); await Hand.tap(); opts[set.indexOf(H.f)].classList.add('right'); SFX.chime(); Hand.hide() }
    else ok=await stepPick(sk,opts,set.indexOf(H.f),{ask,record:false,labels:set.map(f=>[`that one looks ${f}`,`bạn đó trông ${VI_FEEL[f]}`])});
    SC.reveal(); await say(`${H.name} feels ${H.f}.`,`${H.name} đang ${VI_FEEL[H.f]}.`); row.remove();
    await say(H.hen,H.hvi,{q:true});
    if(H.act==='hold'){ const fxs=helpFx(SC,H); if(demo){ await Hand.moveTo(center(fr)); const hp=holdOn(fr,1400); fr.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true})); await hp; Hand.hide() } else await holdOn(fr,1600); await fxs.done() }
    else { const claps=async()=>{ for(let i=1;i<=3;i++){ clapHit(); fr.classList.remove('beat'); void fr.offsetWidth; fr.classList.add('beat'); await sleep(350) } };
      if(demo){ await Hand.moveTo(center(fr)); for(let i=0;i<3;i++){ await Hand.tap(); clapHit(); await sleep(250) } Hand.hide() } else { const row=el(`<div class="claprow"></div>`); SC.el.append(row); await tapN(fr,3,k=>{ clapHit(); fr.classList.remove('beat'); void fr.offsetWidth; fr.classList.add('beat'); row.append(el(`<i class="clapi stk">${CLAP_SVG}<b>${k}</b></i>`)) }) } }
    SC.reveal(['happy','excited','proud','surprised'].includes(H.f)?H.f:'happy'); fr.classList.add('glad'); confetti();
    if(H.scene==='bed') await say(`Good night, ${H.name}! When we feel tired, we go to sleep.`,`Chúc ${H.name} ngủ ngon! Khi mệt, mình đi ngủ nhé.`); else
    await say(['happy','excited','proud','surprised'].includes(H.f)?`${H.name} is so happy you’re here!`:`${H.name} feels better now. Thank you!`,['happy','excited','proud','surprised'].includes(H.f)?`${H.name} vui lắm vì có con!`:`${H.name} thấy dễ chịu hơn rồi. Cảm ơn con!`);
    return ok };
  if(opt.single){ turn('kid'); const ok=await round(deck[0],false); rec(sk,ok,0,'feel:'+deck[0].f); if(ok) await praise(); else await reteachPending(); turn(null); return }
  await demoOr('help',()=>round(deck[0],true));
  for(let r=0;r<rounds;r++){ const H=deck[(r+1)%deck.length]; const ok=await round(H,false); rec(sk,ok,0,'feel:'+H.f); if(ok) await praise(); else await reteachPending(); await sleep(300) }
  turn(null);
});

/* ---- music: listen, then find the face that matches the music ---- */
const TUNES={
  happy:{bpm:150,wave:'triangle',notes:[72,76,79,84,79,76,72,79,84],len:.5,vol:.1},
  excited:{bpm:190,wave:'square',notes:[72,74,76,77,79,81,83,84,84,84],len:.4,vol:.05},
  sad:{bpm:58,wave:'sine',notes:[69,67,65,64,62,60],len:1.6,vol:.12},
  tired:{bpm:52,wave:'sine',notes:[67,64,60,64,60,55],len:1.8,vol:.09},
  angry:{bpm:120,wave:'sawtooth',notes:[43,43,44,43,43,44,46,43],len:.6,vol:.07,drum:true},
  scared:{bpm:200,wave:'triangle',notes:[76,77,76,77,76,77,76,77,76,77,76,77],len:.5,vol:.05,rumble:true},
};
const MUSIC_ADJ={happy:['happy','vui'],sad:['sad','buồn'],angry:['angry','giận dữ'],scared:['scary','đáng sợ'],tired:['sleepy','buồn ngủ'],excited:['exciting','sôi động'],surprised:['surprising','bất ngờ']};
function playTune(f){ const a=ac(); if(!a) return 0; const T=TUNES[f], beat=60/T.bpm; let t=a.currentTime+.05; Music.level(.05);
  T.notes.forEach((m,i)=>{ const fr=440*Math.pow(2,(m-69)/12); tone(fr,beat*T.len*1.6,T.wave,T.vol,t-a.currentTime); if(T.drum&&i%2===0){ tone(90,.2,'sine',.35,t-a.currentTime,40); noise(.06,.2,t-a.currentTime,400) } t+=beat });
  if(T.rumble) noise(beat*T.notes.length,.06,0,180);
  const dur=(t-a.currentTime)*1000; setTimeout(()=>Music.level(1),dur); return dur }
/** real music (public-domain pieces played with recorded instruments, see tts/feelmusic.py); falls back to the little synth tune */
const FMUSIC={buf:{},cur:null};
async function feelBuf(f){ if(FMUSIC.buf[f]) return FMUSIC.buf[f]; const a=ac(); if(!a) return null;
  try{ const r=await fetch(`music/feel-${f}.mp3`); if(!r.ok) throw 0; const ab=await r.arrayBuffer(); const b=await new Promise((res,rej)=>{ const p=a.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej) }); return FMUSIC.buf[f]=b }catch(e){ return null } }
function stopFeelMusic(){ const c=FMUSIC.cur; FMUSIC.cur=null; if(c){ try{ c.g.gain.setTargetAtTime(0,ac().currentTime,.08); c.s.stop(ac().currentTime+.4) }catch(e){} c.done() } }
async function playFeelMusic(f,maxSec=9){
  stopFeelMusic(); if(FAST){ await sleep(20); return } const a=ac(); const b=await Promise.race([feelBuf(f),rawWait(4000).then(()=>null)]);
  if(!b||!a){ await sleep((playTune(f)+200)/SPEED); return }
  Music.level(.05); const s=a.createBufferSource(), g=a.createGain(); s.buffer=b; s.connect(g).connect(a.destination); const t0=a.currentTime; const len=Math.min(b.duration,maxSec);
  g.gain.setValueAtTime(.95,t0); if(b.duration>maxSec){ g.gain.setValueAtTime(.95,t0+len-1.2); g.gain.linearRampToValueAtTime(0,t0+len) }
  s.start(t0); s.stop(t0+len+.05);
  await new Promise(res=>{ const me={s,g,done:res}; FMUSIC.cur=me; const fin=()=>{ if(FMUSIC.cur===me) FMUSIC.cur=null; res() }; s.onended=fin; setTimeout(fin,(len+.3)*1000); abortFns.add(()=>{ stopFeelMusic(); res() }) });
  Music.level(1); if(typeof heardPiece==='function') heardPiece(FEEL_PIECE[f]) }
addFormat('findFeeling','music',async(sk,rounds,opt={})=>{
  Object.keys(TUNES).forEach(f=>feelBuf(f));
  const avail=Object.keys(TUNES).filter(f=>sk.p.set==='all'||sk.p.set.includes(f)); const pool=avail.length>=2?avail:['happy','sad','angry'];
  const again=seenDemo('music:'+sk.id);
  if(again) await say('Let’s listen to the music again!','Mình nghe nhạc lại nhé!'); else await say('Let’s listen to some music! Music can sound happy or sad.','Mình cùng nghe nhạc nhé! Có bài nghe vui, có bài nghe buồn đấy.');
  let prev=null;
  const round=async(t,demo)=>{
    const c=card(); const sp=el(`<div class="speaker fade"><div class="notes"><i>♪</i><i>♫</i><i>♪</i></div><svg viewBox="0 0 100 100"><rect x="22" y="12" width="56" height="78" rx="12" fill="#9B6BD0" ${OL}/><circle cx="50" cy="62" r="18" fill="#D9C7F2" ${OL}/><circle cx="50" cy="62" r="7" fill="${INK}"/><circle cx="50" cy="30" r="8" fill="#D9C7F2" ${OL}/></svg></div>`); c.append(sp);
    const others=shuffle(pool.filter(f=>f!==t)).slice(0,Math.min(2,pool.length-1)); const set=shuffle([t,...others]);
    const listen=async()=>{ sp.classList.add('playing'); try{ await playFeelMusic(t) }finally{ sp.classList.remove('playing') } };
    let busyL=false; sp.onclick=async()=>{ if(busyL) return; busyL=true; try{ await listen() }catch(e){} busyL=false }; sp.setAttribute('role','button'); sp.setAttribute('aria-label','Nghe lại');
    const [row,opts]=optRow(set.map(f=>faceSVG(f)),'small'); c.append(row); await reveal(opts);
    await say('Listen…','Nghe này…',{gap:200,q:false});
    let firstAsk=true;   // the faces can be tapped while the music is still playing
    const ask=async()=>{ if(firstAsk){ firstAsk=false; await listen() } await say('How does the music sound? Tap the speaker to listen again.','Bản nhạc nghe thế nào nhỉ? Chạm vào cái loa để nghe lại nhé.') };
    if(demo){ await ask(); await Hand.moveTo(center(opts[set.indexOf(t)])); await Hand.tap(); opts[set.indexOf(t)].classList.add('right'); SFX.chime(); Hand.hide(); await say(`It sounds ${MUSIC_ADJ[t][0]}!`,`Nghe ${MUSIC_ADJ[t][1]} quá!`); return true }
    const ok=await stepPick(sk,opts,set.indexOf(t),{ask,record:true,labels:set.map(f=>[`that one looks ${f}`,`mặt đó trông ${VI_FEEL[f]}`])});
    RUN.qfn=async()=>{ await listen(); await ask() };
    await say(`Yes, it sounds ${MUSIC_ADJ[t][0]}!`,`Đúng rồi, nghe ${MUSIC_ADJ[t][1]} quá!`); return ok };
  if(opt.single){ turn('kid'); await round(pick(pool),false); turn(null); return }
  if(RUN&&RUN.mode?wantDemo('music'):(typeSeen('music'),!again)){ await watchMe(); prev=pool.includes('happy')?'happy':pool[0]; await round(prev,true); await yourTurn() } else turn('kid');
  for(let r=0;r<rounds;r++){ const t=nextDifferent(prev,()=>pick(pool)); prev=t; await round(t,false); await sleep(300) }
  turn(null);
});

  if(k==='party') return `<svg viewBox="0 0 200 140">${ground}<path d="M0 12 Q50 34 100 12 T200 12" fill="none" stroke="${INK}" stroke-width="1.5"/>${[10,30,50,70,90,110,130,150,170,190].map((x,i)=>`<path d="M${x-7} ${14+Math.sin(i)*3} l7 14 l7 -14z" fill="${PAL[i%5]}"/>`).join('')}${at(70,40,.7,ART.birthday())}${at(8,30,.8,ART.balloon('#E8607E'))}${at(150,34,.8,ART.balloon('#4A9BDB'))}${at(130,70,.5,ART.present('#58B592'))}</svg>`;

async function explore(st,withIntro){
  const A=st.act||{mode:'tap'}; const c=card(); const free=A.mode==='tap';
  const f=el(`<div class="explore fade ex-${A.mode}${free?'':' scene'}">${free?'':storyBG(st.art)}</div>`); c.append(f);
  let placed=0; const SZ=26;
  const items=st.explore.map(([k,en,vi],i)=>{ const art=typeof k==='function'?k():(k==='balloon'||k==='star'||k==='present'||k==='cupcake'?ART[k](PAL[i%5]):ART[k]());
    const p=free?{l:14+(i%2)*46+rand(10),t:10+Math.floor(i/2)*44+rand(8),w:30}:{l:(A.start[i][0]-SZ/2)/2,t:(A.start[i][1]-SZ)/1.4,w:SZ/2};
    const b=el(`<button class="exitem" style="left:${p.l}%;top:${p.t}%;width:${p.w}%">${art}</button>`); f.append(b);
    b.onclick=()=>{ if(b.dataset.used&&!free) return; SFX.pop(); b.dataset.used=1; say(en,vi,{gap:0,q:false}).catch(()=>{});
      if(free){ b.classList.remove('wob'); void b.offsetWidth; b.classList.add('wob'); return }
      const n=placed++; let tx,ty,tw;
      if(A.mode==='collect'){ tx=A.tgt[0]; ty=A.tgt[1]; tw=8 }
      else { const sl=A.mode==='stack'?A.slots[i]:A.slots[n]; tx=sl[0]; ty=sl[1]; tw=sl[2] }
      // fly in scene coordinates (percent of the scene), then settle exactly on the spot
      const fr=f.getBoundingClientRect(), br=b.getBoundingClientRect(); const toX=fr.left+fr.width*tx/200, toY=fr.top+fr.height*ty/140, sc=(fr.width*tw/200)/br.width;
      const dx=toX-(br.left+br.width/2), dy=toY-(br.top+br.height/2);
      const an=b.animate([{transform:'none'},{transform:`translate(${dx}px,${dy-30}px) scale(${(1+sc)/2})`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${sc})`}],{duration:Math.max(1,650*SPEED),easing:'ease-in-out'});
      an.finished.then(()=>{ if(A.mode==='collect'){ b.style.visibility='hidden'; f.classList.remove('gulp'); void f.offsetWidth; f.classList.add('gulp') }
        else { b.style.width=(tw/2)+'%'; b.style.left=((tx-tw/2)/2)+'%'; const h=b.getBoundingClientRect().height; b.style.top=((ty/140*fr.height-h/2)/fr.height*100)+'%'; b.classList.add('placed') } SFX.chime() }).catch(()=>{}) };
    return b });
  if(withIntro) for(const l of st.intro) await say(...l);
  await say(...(A.line||['Tap anything you like!','Con thích chạm vào đâu thì chạm nhé!']),{q:true});
  if(AUTO&&!free) for(const b of items){ await sleep(200); b.click() }
  const t0=Date.now(); while(Date.now()-t0<(AUTO?300:(free?14000:25000))*SPEED&&items.some(b=>!b.dataset.used)) await sleep(400);
  await sleep(1200); if(A.done&&items.every(b=>b.dataset.used)){ confetti(); await say(...A.done) }
}

function C(){ S.city=S.city||{items:[],gifts:0,open:['zoo'],stars:[]}; return S.city }
const zCount=(z,f)=>C().items.filter(it=>it.z===z&&(!f||f(it))).length;
function zRoom(z){ const Z=ZONES[z]; return z==='cars'?Z.road+Z.sky:Z.slots.length }
const zFill=z=>zCount(z)/zRoom(z);
function typeFits(t){ const D=CITEM[t]; if(D.z!=='cars') return zCount(D.z)<zRoom(D.z); return D.sky?zCount('cars',it=>CITEM[it.t].sky)<ZONES.cars.sky:zCount('cars',it=>!CITEM[it.t].sky)<ZONES.cars.road }
const zoneHasRoom=z=>Object.keys(CITEM).some(t=>CITEM[t].z===z&&typeFits(t));
const anOf=D=>D.plural?D.en:`${D.a} ${D.en}`;

/** the 3 presents: 1 area open → 3 from it; 2 areas → 2 from the emptier one; 3+ → 3 areas, emptier ones more likely */
function giftOptions(){
  const c=C(); const open=ZORDER.filter(z=>c.open.includes(z)&&zoneHasRoom(z)); if(!open.length) return [];
  let zones;
  if(open.length===1) zones=[open[0],open[0],open[0]];
  else if(open.length===2){ const [a,b]=open.slice().sort((x,y)=>zFill(x)-zFill(y)||Math.random()-.5); zones=[a,a,b] }
  else { const pool=open.slice(); zones=[]; while(zones.length<3&&pool.length){ const ws=pool.map(z=>1.15-zFill(z)); let r=Math.random()*ws.reduce((a,b)=>a+b,0), k=0; while(k<ws.length-1&&r>ws[k]){ r-=ws[k]; k++ } zones.push(pool.splice(k,1)[0]) } while(zones.length<3) zones.push(zones[0]) }
  const owned=new Set(c.items.map(it=>it.t)), out=[];
  for(const z of zones){ const ts=Object.keys(CITEM).filter(t=>CITEM[t].z===z&&typeFits(t)&&!out.includes(t)); if(!ts.length) continue;
    const fresh=ts.filter(t=>!owned.has(t)); out.push(pick(fresh.length?fresh:ts)) }
  return shuffle(out);
}

function planSession(li){

  const items=[need.find(s=>s.area==='M'),need.find(s=>s.area!=='M')].filter(Boolean);
  const pool=path.filter(s=>!items.includes(s)); while(items.length<2&&pool.length) items.push(pool.splice(rand(pool.length),1)[0]);
  const offs=SKILLS.filter(s=>s.kind==='off').sort((a,b)=>(S.missionCount[a.id]||0)-(S.missionCount[b.id]||0));

    document.body.append(m); const kid=$('.limitkid .mascot',m);

    talk(); $('.limitkid',m).onclick=talk;
    m.querySelectorAll('[data-c]').forEach(b=>wireHold(b,()=>{
      const c=b.dataset.c; m.remove();

      if(c==='more'){ S.extraMin=S.extraMin||{}; S.extraMin[today()]=((S.extraMin[today()])||0)+limitMin(); S.finishing=null }

function mapPoints(W,H){
  const N=LEVELS, pts=[];
  if(W>=H*1.05){ const m=Math.min(W*.08,90); for(let i=0;i<N;i++) pts.push({x:m+i*(W-2*m)/(N-1),y:H*(.52-.27*Math.sin(i*1.35+.3))}) }

  return pts;
}

/* =========================================================
   LIVELIER PLAY: sparkles where the child taps right, a star for every right answer (the stars of this
   level fly into a jar at the top), drag-and-drop for things that move somewhere (tapping still works),
   and pop games where bubbles and balloons keep rising.
   ========================================================= */
let lastPt=null, DRAGGING=0;
addEventListener('pointerup',()=>setTimeout(()=>{ if(!document.querySelector('.dragging')) DRAGGING=0 },60),true);
addEventListener('pointerdown',e=>{ lastPt={x:e.clientX,y:e.clientY,t:performance.now()} },true);
/** little stars/hearts flying out from a point */
function burst(p,{n=10,kind='star'}={}){ const fx=$('#fx'); if(!fx||!p||FAST) return;
  for(let i=0;i<n;i++){ const a=Math.PI*2*i/n+Math.random()*.5, d=60+Math.random()*60, col=pick(PAL);
    const sh=kind==='heart'?`<path d="M12 21 C4 15 1 10 4 6 C6.5 3 10 4 12 7 C14 4 17.5 3 20 6 C23 10 20 15 12 21Z" fill="${col}"/>`:`<path d="${starPath(12,12,11)}" fill="${col}" stroke="${INK}" stroke-width="1.4"/>`;
    const e=el(`<svg class="spark" viewBox="0 0 24 24" style="left:${p.x-11}px;top:${p.y-11}px">${sh}</svg>`); fx.append(e);
    e.animate([{transform:'translate(0,0) scale(.4) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(1) rotate(${rand(360)}deg)`,opacity:1,offset:.7},{transform:`translate(${Math.cos(a)*d*1.2}px,${Math.sin(a)*d*1.2+30}px) scale(.6)`,opacity:0}],{duration:900,easing:'cubic-bezier(.2,.7,.3,1)'}).finished.then(()=>e.remove(),()=>e.remove()) } }
/* ---- the star jar: one star for every right answer in this level ---- */
function starJar(){ let j=$('#starjar'); if(!j){ const tb=$('.wrap-kid .topbar'); if(!tb) return null; j=el(`<div class="starjar" id="starjar" aria-label="Sao"><svg viewBox="0 0 24 24"><path d="${starPath(12,12.5,11)}" fill="#FCB515" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/></svg><b>0</b></div>`); tb.append(j) }
  $('b',j).textContent=(RUN&&RUN.stars)||0; return j }
function awardStar(from){ if(!RUN||FAST) { if(RUN) RUN.stars=(RUN.stars||0)+1; return } RUN.stars=(RUN.stars||0)+1; const j=starJar(); if(!j) return;
  const p=from||{x:innerWidth/2,y:innerHeight/2}, t=center(j);
  const s=el(`<svg class="flystar" viewBox="0 0 24 24"><path d="${starPath(12,12,11)}" fill="#FCB515" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/></svg>`); $('#fx').append(s);
  const a=s.animate([{transform:`translate(${p.x-20}px,${p.y-20}px) scale(.6)`},{transform:`translate(${(p.x+t.x)/2-20}px,${Math.min(p.y,t.y)-90}px) scale(1.5) rotate(180deg)`},{transform:`translate(${t.x-20}px,${t.y-20}px) scale(.7) rotate(360deg)`}],{duration:900,easing:'ease-in-out'});
  a.finished.then(()=>{ s.remove(); $('b',j).textContent=RUN?RUN.stars:0; j.classList.remove('bump'); void j.offsetWidth; j.classList.add('bump'); tone(1320,.12,'sine',.08); tone(1760,.18,'sine',.06,.08);
    const m=$('#dockChoi'); if(m&&m.dataset.mood==='idle'){ m.dataset.mood='happy'; setTimeout(()=>{ if(m.dataset.mood==='happy') m.dataset.mood='idle' },900) } },()=>s.remove()) }
const _rec=rec;
rec=function(sk,ok,rt,c){ _rec(sk,ok,rt,c) };
/** a cheerful boing for a wrong tap */
function boing(){ tone(300,.18,'sine',.09,0,180); tone(220,.2,'sine',.05,.1,160) }

/* ---- drag and drop: drag `item` onto one of `zones`; a plain tap still works as before ---- */
function makeDrag(item,zones,{onDrop}={}){
  if(!item||item._drag) return; item._drag=true; item.style.touchAction='none';
  let st=null;
  const zoneAt=(x,y)=>zones().find(z=>{ const r=z.getBoundingClientRect(); return x>=r.left-24&&x<=r.right+24&&y>=r.top-24&&y<=r.bottom+24 });
  item.addEventListener('pointerdown',e=>{ if(item.dataset.used||item.disabled) return; st={x:e.clientX,y:e.clientY,drag:false,id:e.pointerId} });
  item.addEventListener('pointermove',e=>{ if(!st||e.pointerId!==st.id) return; const dx=e.clientX-st.x, dy=e.clientY-st.y;
    if(!st.drag&&Math.hypot(dx,dy)>10){ st.drag=true; DRAGGING++; try{ item.setPointerCapture(e.pointerId) }catch(_){} item.classList.add('dragging'); item.style.transition='none' }
    if(st.drag){ item.style.translate=`${dx}px ${dy}px`; const z=zoneAt(e.clientX,e.clientY); zones().forEach(q=>q.classList.toggle('droptarget',q===z)) } });
  const end=e=>{ if(!st) return; const s=st; st=null; if(!s.drag) return; DRAGGING=Math.max(0,DRAGGING-1); item.classList.remove('dragging'); zones().forEach(q=>q.classList.remove('droptarget'));
    item._noclick=true; setTimeout(()=>{ item._noclick=false },400);
    const z=e.type==='pointerup'&&zoneAt(e.clientX,e.clientY);
    if(z){ item._noclick=false; if(onDrop) onDrop(z); else item.click(); item._noclick=true; setTimeout(()=>{ item._noclick=false },400);
      setTimeout(()=>{ if(item.isConnected&&!item.dataset.used&&!item.disabled&&getComputedStyle(item).visibility!=='hidden'&&item.style.translate&&item.style.translate!=='0px 0px'){ item.style.transition='translate .35s cubic-bezier(.3,1.5,.5,1)'; item.style.translate='0px 0px'; setTimeout(()=>{ item.style.transition='' },400) } },750) }
    else { item.style.transition='translate .35s cubic-bezier(.3,1.5,.5,1)'; item.style.translate='0px 0px'; setTimeout(()=>{ item.style.transition='' },400) } };
  item.addEventListener('pointerup',end); item.addEventListener('pointercancel',end);
  item.addEventListener('click',e=>{ if(item._noclick){ e.stopImmediatePropagation(); e.preventDefault() } },true) }
/** Chồi's hand shows the drag: pick the thing up and carry it to the zone */
async function demoDrag(item,zone,dur=650){ const f=center(item), t=center(zone); await Hand.moveTo(f,520); await Hand.tap();
  item.classList.add('dragging'); const t0=performance.now(), D=Math.max(1,dur*SPEED);
  await new Promise(res=>{ const step=()=>{ const k=Math.min(1,(performance.now()-t0)/D), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2, x=f.x+(t.x-f.x)*e, y=f.y+(t.y-f.y)*e;
    item.style.translate=`${x-f.x}px ${y-f.y}px`; Hand.set({x,y}); if(k<1) requestAnimationFrame(step); else res() }; requestAnimationFrame(step) });
  item.classList.remove('dragging') }

/* ---- pop games: bubbles (feelings) and balloons (numbers) keep rising; pop all the right ones ---- */
async function popStream(sk,rounds,{intro,target,make,ask,label,answer,opt={},need=3,countAll=false,noDemo=false,finale=null,bg=null,from=null,ratio=3,between=null}){
  let curField=null;
  let introLeft=intro;
  const round=async(t,demo)=>{
    const c=card(); const field=el(`<div class="popfield fade">${bg?bg():''}</div>`); c.append(field); curField=field; if(introLeft){ await say(...introLeft); introLeft=null }
    let popped=0, wrong=0, alive=true, live=[];
    const others=make.others(t);
    let lastPop=performance.now(), ease=1.12;   // slower with every new one (4%), and 22% slower each time a right one floats away untapped
    const spawn=(isT)=>{ if(!alive) return; const v=isT?t:pick(others); if(!demo) ease=Math.min(3.6,ease*1.04); const sl=(demo?1:ease)*(from?1.6:1); const b=el(`<button class="riser ${make.cls}${from?' from drift d'+rand(3):''}" style="left:${6+rand(74)}%;--dur:${((demo?7:6.2)+Math.random()*2.4)*sl}s;--sway:${rand(2)?'':'-'}${10+rand(16)}px"><span class="in">${make.art(v)}</span></button>`);
      b.dataset.v=v; if(isT||countAll) b.dataset.ok='1'; field.append(b); live.push(b);
      if(from){ const fr=field.getBoundingClientRect(), p=from(field), bw=b.offsetWidth||80; b.style.left=(p.x-bw/2)+'px'; b.style.bottom=(fr.height-p.y-bw/2)+'px'; b.style.setProperty('--dx',(fr.width-p.x+bw*1.2)+'px') }   // out of the wand, then drifting across to the right, up and down a little
      b.addEventListener('animationend',e=>{ if(!/^(rise|riseFrom|drift\d)$/.test(e.animationName)) return; if(!demo&&b.dataset.ok&&!b.dataset.used) ease=Math.min(3.6,ease*1.22); b.remove(); live=live.filter(x=>x!==b) }); return b };
    // a steady stream: about one in three is a right one, and there is always one on its way
    let k=0; const tick=()=>{ if(!alive) return; const rightOnes=live.filter(b=>b.dataset.ok&&!b.dataset.used).length; spawn(rightOnes===0||k%ratio===0); k++ };
    for(let i=0;i<3;i++) setTimeout(tick,i*(from?900:500)); const iv=setInterval(tick,from?1800:demo?1500:1250);
    // the last balloon carries something (the map piece): the stream stops, one big balloon floats up and waits
    const startFinale=()=>{ alive=false; clearInterval(iv); live.forEach(b=>{ if(!b.dataset.used){ b.dataset.used='1'; b.classList.add('away') } });
      setTimeout(()=>{ const sp=el(`<button class="riser special"><span class="in">${ART.balloon('#E8484F')}<span class="tied">${finale}</span></span></button>`); sp.dataset.ok='1'; sp.dataset.v='1'; field.append(sp); live.push(sp);
        sp.animate([{transform:'translate(-50%,110%)'},{transform:'translate(-50%,calc(-50cqh + 50%))'}],{duration:Math.max(1,2200*SPEED),easing:'cubic-bezier(.3,.7,.4,1)',fill:'forwards'}).finished.then(()=>{ sp.dataset.ready='1' },()=>{});
        say('Look! The red balloon is back with the map piece! Pop it!','Nhìn kìa! Quả bóng đỏ mang mảnh bản đồ quay lại rồi! Chọc vỡ nó nhé!',{gap:0,q:true}).catch(()=>{}) },600*SPEED) };
    const dropPiece=async p=>{ const fr=field.getBoundingClientRect(), x=p.x-fr.left, y=p.y-fr.top, dx=fr.width/2-x, dy=fr.height*.5-y;
      const pc=el(`<div class="dropiece stk" style="left:${x}px;top:${y}px">${finale}</div>`); field.append(pc); tone(1200,.9,'sine',.06,0,500);
      await pc.animate([{transform:'translate(-50%,-50%) rotate(-25deg) scale(.6)'},{transform:`translate(calc(-50% + ${dx*.3+50}px),calc(-50% + ${dy*.35}px)) rotate(20deg) scale(.8)`},{transform:`translate(calc(-50% + ${dx*.65-50}px),calc(-50% + ${dy*.7}px)) rotate(-14deg) scale(1)`},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(0) scale(1.7)`}],{duration:Math.max(1,2000*SPEED),easing:'ease-in-out',fill:'forwards'}).finished.catch(()=>{});
      pc.classList.add('glow'); SFX.chime(); burst(center(pc),{n:14}); await sleep(500) };
    const stop=()=>{ alive=false; clearInterval(iv) }; abortFns.add(stop);
    await ask(t);
    const pop=b=>{ b.dataset.used=1; lastPop=performance.now(); const p=center(b); b.classList.add('pop'); burst(p,{n:12}); SFX.pop(); tone(900,.08,'triangle',.08); setTimeout(()=>b.remove(),300) };
    if(demo){ for(let i=0;i<3;i++){ let b=null; for(let w=0;w<40&&!b;w++){ b=live.find(x=>x.dataset.ok&&!x.dataset.used&&x.getBoundingClientRect().top>field.getBoundingClientRect().top+20); if(!b) await sleep(150) } if(!b) break;
        await Hand.chase(b,650); await Hand.tap(); pop(b); popped++; await say(cap(W[popped])+'!',cap(VI_N[popped])+'!',{gap:100}) } Hand.hide(); stop(); abortFns.delete(stop); field.remove(); return true }
    const t0=performance.now();
    await new Promise((res,rej)=>{ const ab=()=>{ rej(ABORT) }; abortFns.add(ab);
      field.addEventListener('click',e=>{ const b=e.target.closest('.riser'); if(!b||b.dataset.used) return;
        if(b.dataset.ok){ const bp=center(b); pop(b); popped++; say(cap(W[popped])+'!',cap(VI_N[popped])+'!',{gap:0,q:false}).catch(()=>{});
          if(b.classList.contains('special')){ abortFns.delete(ab); dropPiece(bp).then(res,res); return }
          if(finale&&popped===need-1) startFinale();
          else if(popped>=need){ abortFns.delete(ab); setTimeout(res,500*SPEED) } }
        else { wrong++; const inn=$('.in',b); inn.classList.remove('nope'); void inn.offsetWidth; inn.classList.add('nope'); boing(); if(wrong===1||wrong%3===0) say(`Oops, ${label(b.dataset.v)}.`,`Ơ, ${label(b.dataset.v,true)}.`,{gap:0,q:false}).catch(()=>{}) } });
      const nudge=idleNudge([field],()=>popped===0); abortFns.add(nudge); const hh=hintHand(()=>live.find(x=>x.dataset.ok&&!x.dataset.used&&x.getBoundingClientRect().top>field.getBoundingClientRect().top+30)); abortFns.add(hh); field.addEventListener('pointerdown',hh,{once:true});
      if(AUTO) (async()=>{ for(let i=0;i<need;i++){ await new Promise(r=>setTimeout(r,kidTapDelay())); const b=live.find(x=>x.dataset.ok&&!x.dataset.used&&(!x.classList.contains('special')||x.dataset.ready)); if(b) b.click(); else i-- } })() });
    stop(); abortFns.delete(stop); const ok=wrong===0; rec(sk,ok,performance.now()-t0,FEELS.includes(t)?'feel:'+t:null);
    confetti(); live.forEach(b=>{ if(!b.dataset.used){ b.dataset.used='1'; b.classList.add('away') } }); await say(...answer(t)); return ok };   // the field stays for the praise; the next card replaces it
  if(opt.single||noDemo){ turn('kid'); for(let r=0;r<(opt.single?1:rounds);r++){ const ok=await round(target(),false); if(ok) await praise() } turn(null); return }
  let prev=target(); await demoOr('pop',()=>round(prev,true));
  for(let r=0;r<rounds;r++){ const t=nextDifferent(prev,target); prev=t; const ok=await round(t,false); if(ok) await reteachPending(); else await kept(false); if(between) await between(r,curField); await sleep(300) }   // the answer line already says what the child did
  turn(null);
}
addFormat('findFeeling','pop',(sk,rounds,opt={})=>{ const pool=sk.p.set==='all'?FEELS:sk.p.set;
  return popStream(sk,rounds,{opt,intro:['Let’s pop the feelings bubbles!','Mình cùng chọc vỡ bong bóng cảm xúc nhé!'],target:()=>pick(pool),
    make:{cls:'bubble',art:f=>faceSVG(f),others:t=>FEELS.filter(f=>f!==t&&(sk.p.set==='all'||pool.length<3||pool.includes(f))).slice(0,6)},
    ask:t=>say(`Pop all the ${t} faces! Find three!`,`Chọc vỡ hết các mặt ${VI_FEEL[t]} nhé! Tìm ba cái!`),
    label:(v,vi)=>vi?`mặt đó đang ${VI_FEEL[v]}`:`that face looks ${v}`,answer:t=>[`You found three ${t} faces!`,`Con tìm được ba khuôn mặt ${VI_FEEL[t]}!`]}) });
addFormat('findNumeral','balloons',(sk,rounds,opt={})=>{ const max=sk.p.max||5;
  return popStream(sk,rounds,{opt,intro:['Let’s pop the number balloons!','Mình cùng chọc vỡ bóng bay số nhé!'],target:()=>1+rand(max),
    make:{cls:'balloon',art:n=>`${ART.balloon(PAL[n%PAL.length])}<b class="bn">${n}</b>`,others:t=>[...Array(max).keys()].map(i=>i+1).filter(n=>n!==t)},
    ask:t=>say(`Pop all the balloons with the number ${W[t]}! Find three!`,`Chọc vỡ hết bóng bay có số ${VI_N[t]} nhé! Tìm ba quả!`),
    label:(v,vi)=>vi?`đó là số ${VI_N[v]}`:`that’s ${W[v]}`,answer:t=>[`Three balloons with ${W[t]}! Great popping!`,`Ba quả bóng số ${VI_N[t]}! Giỏi quá!`]}) });

   inside the story, a quiet look back at earlier things, and a reward game at the end.
   ========================================================= */

const atG=(x,y,sc,svg)=>`<g transform="translate(${x} ${y}) scale(${sc})">${unwrap(svg)}</g>`;
const SO='stroke="#3A1B49" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"';
function treeG(x,y,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})"><g class="tp tp-tree"><rect x="-3.2" y="-16" width="6.4" height="18" rx="2" fill="#B5733E" ${SO}/><path d="M0 -44 q15 -1 17 13 q7 7 0 15 q-7 5 -15 2 q-8 4 -15 -3 q-6 -8 1 -15 q1 -12 12 -12z" fill="#2FA877" ${SO}/><path d="M-9 -30 q2 -6 8 -7" stroke="#7FE6B4" stroke-width="2" fill="none" stroke-linecap="round"/></g></g>` }
function cloudG(x,y,s=1){ return `<g class="tp tp-cloud"><path transform="translate(${x} ${y}) scale(${s})" d="M10 22 h40 a9 9 0 0 0 -3 -17 a12 12 0 0 0 -22 -1 a8 8 0 0 0 -15 18z" fill="#fff" stroke="#3A1B49" stroke-width="${(1.6/s).toFixed(2)}" stroke-linejoin="round"/></g>` }
function sunG(x,y,r=10,c='#FFD21F'){ let rays=''; for(let k=0;k<8;k++){ const a=k*Math.PI/4, c1=Math.cos(a), s1=Math.sin(a); rays+=`M${(x+c1*(r+4)).toFixed(1)} ${(y+s1*(r+4)).toFixed(1)} L${(x+c1*(r+8)).toFixed(1)} ${(y+s1*(r+8)).toFixed(1)} ` } return `<g class="tp tp-sun"><path class="rays" d="${rays}" stroke="#FFE45C" stroke-width="2.4" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${SO}/></g>` }

/** a picture: background + people and things standing in it. a = [{who:'Kim',f:'happy'} | {choi:true} | {art:svg}, x:% centre, b:% from bottom, h:% height, cls] */
function scenePic(bg,actors=[]){
  const sc=el(`<div class="spic fade">${BG[bg]?BG[bg]():bg}</div>`);
  actors.forEach((a,i)=>{ let inner='';
    if(a.choi) inner=`<div class="mascot" data-mood="${a.mood||'idle'}">${mascotSVG()}</div>`;
    else if(a.who) inner=kidSVG(a.who,a.f||'neutral')+(a.name?`<b>${a.who}</b>`:'');
    else if(a.polly) inner=pollySVG(!!a.talk);
    else inner=a.art;
    const d=el(`<div class="actor stk tapact ${a.who?'kid':''} ${a.polly?'polly':''} ${a.cls||''}" data-who="${a.who||(a.polly?'Polly':a.choi?'Chồi':'')}" style="left:${a.x}%;bottom:calc(${a.b??8}*var(--u));height:calc(${a.h||40}*var(--u));animation-delay:${i*120}ms">${inner}</div>`); if(a.key) d.dataset.key=a.key; sc.append(d) });
  sc.addEventListener('click',e=>{ if(sceneTap(e)){ e.stopImmediatePropagation(); e.preventDefault() } },true);
  return sc }
/** tapping things in a picture: the team says hello, clouds drift, the sun shines, trees shake, things bounce */
function sceneTap(e){
  const a=e.target.closest('.actor.tapact'), t=!a&&e.target.closest('.tp');
  const anim=(n,cls,ms=800)=>{ n.classList.remove(cls); void n.getBoundingClientRect(); n.classList.add(cls); setTimeout(()=>n.classList.remove(cls),ms) };
  const talk=(en,vi,o={})=>{ if(!SAYN) say(en,vi,{q:false,gap:0,...o}).catch(()=>{}) };
  if(a){ const w=a.dataset.who; anim(a,'tapped',700);
    if(CAST.includes(w)){ SFX.pop(); talk(`Hi! I’m ${w}!`,`Chào bạn! Mình là ${w}!`) }
    else if(w==='Polly'){ const s=a.querySelector('svg'); if(s){ s.outerHTML=pollySVG(true); setTimeout(()=>{ const s2=a.querySelector('svg'); if(s2) s2.outerHTML=pollySVG(false) },1200) } talk('Hello! Hello!','Xin chào! Xin chào!',{polly:true}) ; if(SAYN) tone(900,.12,'square',.05,0,1300) }
    else if(w==='Chồi'){ SFX.pop(); talk('Hi! I’m Chồi!','Chào bạn! Chồi đây!') }
    else { SFX.pop() }
    return true }
  if(t){ if(t.classList.contains('tp-sun')){ anim(t,'shine',1200); SFX.chime() } else if(t.classList.contains('tp-cloud')){ anim(t,'driftme',1600); SFX.soft() } else { anim(t,'shakeme',700); tone(600,.08,'triangle',.06,0,900) } return true }
  return false }
/** one page of the story: the picture, Chồi tells it, then the Next button. Tap the picture to hear it again. */
async function storyPage(pic,lines,{play,after}={}){
  const c=card(); const pg=el(`<div class="spage"></div>`); pg.append(pic.el||pic); c.append(pg); let gone=false; const alive=()=>!gone&&!(RUN&&RUN.aborted);
  const nx=el(`<button class="nextbtn" aria-label="Tiếp"><svg viewBox="0 0 24 24"><path d="M9 5 L16.5 12 L9 19" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`);
  const tell=async()=>{ if(pic.play) await pic.play(); if(!alive()) return; if(play) await play(alive); for(const l of lines){ if(!alive()) return; await say(...l,{q:false}) } };
  turn('choi'); await tell(); turn(null); if(after) await after();
  let busy=false; (pic.el||pic).addEventListener('click',async()=>{ if(busy||!nx.isConnected) return; busy=true; try{ await tell() }catch(e){} busy=false });
  pg.append(nx); requestAnimationFrame(()=>nx.classList.add('show')); nx.dataset.ok='1'; if(RUN) RUN.qfn=tell;
  await tapOnce([nx]); gone=true; SFX.pop(); try{ speechSynthesis.cancel() }catch(e){} voiceStop();
}
/** count things that are in the picture: tap each one (a look back at counting, inside the story) */
async function countInPic(sk,{pic,items,n,ask,answer}){
  const c=card(); c.append(pic);
  const btns=items.map(([x,b,h,art],i)=>{ const e=el(`<button class="pcount" style="left:${x}%;bottom:calc(${b}*var(--u));height:calc(${h}*var(--u))">${art}</button>`); pic.append(e); return e });
  await reveal([]); await say(...ask,{q:true});

    let alive=true, got=0, wrong=0, k=0, ease=1; const busy=new Set();   // ease grows 4% with every pop-up and 30% each time a right friend hides again untapped
    const up=(isT)=>{ if(!alive) return; const free=holes.filter((h,i)=>!busy.has(i)); if(!free.length) return; const h=pick(free), i=holes.indexOf(h); busy.add(i);

      const p=$('.peeker',h); p.innerHTML=kidSVG(who,f); p.dataset.f=f; p.dataset.who=who; delete p.dataset.used; if(f===R.f) p.dataset.ok='1'; else delete p.dataset.ok;
      p.classList.remove('down'); p.classList.add('up'); tone(700+rand(300),.06,'sine',.04);
      if(!demo) ease=Math.min(4.5,ease*1.04);
      const stay=(demo?2600:(2300+rand(500))*ease); p._t=setTimeout(()=>{ if(!demo&&p.dataset.ok&&!p.dataset.used) ease=Math.min(4.5,ease*1.3); p.classList.remove('up'); p.classList.add('down'); setTimeout(()=>busy.delete(i),350) },stay) };
    const tick=()=>{ if(!alive) return; const showing=holes.filter(h=>$('.peeker',h).classList.contains('up')&&$('.peeker',h).dataset.ok&&!$('.peeker',h).dataset.used).length; up(showing===0||k%2===0); k++ };
    if(introLeft){ await say(...introLeft); introLeft=null }
    let iv=null; const loop=()=>{ if(!alive) return; tick(); iv=setTimeout(loop,demo?1300:1100*Math.min(2.4,ease)) }; iv=setTimeout(loop,200);
    const stop=()=>{ alive=false; clearTimeout(iv) }; abortFns.add(stop);
    await say(...R.ask);
    const hit=p=>{ p.dataset.used=1; clearTimeout(p._t); p.classList.add('hit'); burst(center(p),{n:10}); SFX.chime(); setTimeout(()=>{ p.classList.remove('up','hit'); p.classList.add('down'); const i=holes.indexOf(p.parentElement); setTimeout(()=>busy.delete(i),350) },500) };
    if(demo){ for(let n=1;n<=2;n++){ let p=null; for(let w=0;w<40&&!p;w++){ p=holes.map(h=>$('.peeker',h)).find(x=>x.classList.contains('up')&&x.dataset.ok&&!x.dataset.used); if(!p) await sleep(150) } if(!p) break;
        clearTimeout(p._t); await Hand.moveTo(center(p),450); await Hand.tap(); hit(p); got++; await say(cap(W[got])+'!',cap(VI_N[got])+'!',{gap:100}) } Hand.hide(); stop(); abortFns.delete(stop); return true }
    const t0=performance.now();
    await new Promise((res,rej)=>{ const ab=()=>rej(ABORT); abortFns.add(ab); const tEnd=setTimeout(()=>{ abortFns.delete(ab); res() },45000);
      field.addEventListener('click',e=>{ const p=e.target.closest('.peeker'); if(!p||!p.classList.contains('up')||p.dataset.used) return;
        if(p.dataset.ok){ hit(p); got++; say(cap(W[got])+'!',cap(VI_N[got])+'!',{gap:0,q:false}).catch(()=>{}); if(got>=need){ clearTimeout(tEnd); abortFns.delete(ab); setTimeout(res,600) } }
        else { wrong++; p.classList.remove('nope'); void p.offsetWidth; p.classList.add('nope'); boing(); if(wrong===1||wrong%3===0) say(`Oops, that friend looks ${p.dataset.f}.`,`Ơ, bạn đó đang ${VI_FEEL[p.dataset.f]}.`,{gap:0,q:false}).catch(()=>{}) } });
      const nudge=idleNudge([field],()=>got===0); abortFns.add(nudge); const hh=hintHand(()=>holes.map(h=>$('.peeker',h)).find(x=>x.classList.contains('up')&&x.dataset.ok&&!x.dataset.used)); abortFns.add(hh); field.addEventListener('pointerdown',hh,{once:true});
      if(AUTO) (async()=>{ while(got<need){ await new Promise(r=>setTimeout(r,kidTapDelay())); const p=holes.map(h=>$('.peeker',h)).find(x=>x.classList.contains('up')&&x.dataset.ok&&!x.dataset.used); if(p) p.click() } })() });
    stop(); abortFns.delete(stop); rec(sk,wrong===0,performance.now()-t0,'feel:'+R.f); confetti(); await say(...R.done); return wrong===0 };
  if(!noDemo) await demoOr('peek',()=>round(list[0],true)); else turn('kid');
  for(const R of (skipFirst&&!noDemo?list.slice(1):list)){ const ok=await round(R,false); if(ok) await praise(); else await kept(false); await sleep(300) }
  turn(null);

/** wait for exactly n taps on one thing (claps): the child can't finish with fewer; a gentle reminder if they stop */
function tapN(target,n,onTap){
  return new Promise((res,rej)=>{ let c=0,done=false,t=null;
    const stopN=idleNudge([target],()=>!done&&c===0,{point:true}); const stopH=hintHand(()=>target,{kind:'tap3',always:true});
    const ab=()=>{ done=true; clearTimeout(t); stopN(); stopH(); target.onclick=null; rej(ABORT) }; abortFns.add(ab);
    const remind=()=>{ clearTimeout(t); t=setTimeout(()=>{ if(!done&&c<n) say('Keep clapping!','Vỗ tay tiếp nào!',{gap:0,q:false}).catch(()=>{}) },3500) };
    target.onclick=()=>{ if(done) return; c++; stopH(); onTap(c); if(c>=n){ done=true; clearTimeout(t); stopN(); abortFns.delete(ab); target.onclick=null; setTimeout(res,450*SPEED) } else remind() };
    if(AUTO) (async()=>{ for(let i=0;i<n;i++){ await new Promise(r=>setTimeout(r,kidTapDelay())); if(!done&&target.onclick) target.onclick() } })();
  });
}

/* ---- the city view (inside the activity card) ---- */
function isoCity(host){
  const W={host,spr:{},cam:{cx:0,cy:0,z:1},tgt:null,sel:null,busy:false,raf:0,tok:{}};
  const box=el(`<div class="isocity"><svg class="isow" role="img" aria-label="Thành phố của bé"></svg><div class="itop"><button class="ibtn" data-z="all" aria-label="Xem toàn cảnh"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="${CK_PL}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="ifoods" hidden></div></div>`);
  host.append(box); W.box=box; W.svg=box.querySelector('.isow'); W.foods=box.querySelector('.ifoods');
  const key=(i,j)=>i+j;
  W.draw=()=>{ const items=[];
    IISL.forEach(s=>items.push({k:key(s.i0,s.j0),b:0,h:isoIsland(s)})); IBRG.forEach(b=>items.push({k:key(b.i0,b.j0),b:-1,h:isoBridge(b)}));
    items.sort((a,b)=>a.k-b.k||a.b-b.b);
    W.svg.innerHTML=`<defs><filter id="isostk" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="4" result="d"/><feFlood flood-color="#FFFFFF"/><feComposite in2="d" operator="in" result="w"/><feOffset in="d" dx="2.5" dy="4" result="o"/><feFlood flood-color="#3A1B49" flood-opacity=".9"/><feComposite in2="o" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g class="iisl">${items.map(x=>x.h).join('')}</g><g class="ispr"></g><g class="ifx"></g><g class="ipolly tapme" data-id="polly"><g class="bob" filter="url(#isostk)"><svg x="-36" y="-48" width="72" height="94" viewBox="0 0 200 260" overflow="visible">${unwrap(pollySVG(false,6))}</svg></g></g>`;
    W.spr={};
    IDECO.forEach(([t,i,j],n)=>W.add({id:'tree'+n,i,j,...isoTree(t),plain:1}));
    W.add({id:'sign',i:6.5,j:5.5,...isoSign('Zoo'),plain:1});
    W.add({id:'rock',i:4.5,j:3.5,vb:'0 0 80 50',w:60,h:38,s:`<path d="M6 44 L18 14 L44 6 L72 22 L76 44Z" fill="#B7B3CC"/><path d="M44 6 L72 22 L76 44 L48 44Z" fill="#9C98B4"/>`,plain:1});
    W.add({id:'star',i:10.5,j:3.5,...isoStarTree((C().stars||[]).length),tap:1,plain:1});
    W.add({id:'choi',i:11.4,j:2.6,vb:'-12 -12 144 168',w:56,h:66,s:unwrap(mascotSVG()),tap:1});
    isoOpenIslands(W); [['s1',3.5,11],['s2',-4,3],['s3',3,-4]].filter(([id])=>isoShut(IISL.find(z=>z.id===id))).forEach(([id,i,j])=>{ W.add({id:'c'+id,i,j,...isoCloud(220),plain:1,soon:id,foot:-30}); W.add({id:'q'+id,i:i+.2,j:j+.2,vb:'0 0 80 80',w:60,h:60,s:(S.goldKey&&id==='s1')?`<circle cx="40" cy="40" r="32" fill="#FFF3B0" stroke="${CK_PL}" stroke-width="6"/><circle cx="28" cy="40" r="9" fill="#FFD21F" stroke="${CK_PL}" stroke-width="4"/><path d="M37 40 H62 M55 40 V49 M61 40 V47" stroke="${CK_PL}" stroke-width="5" stroke-linecap="round"/>`:`<circle cx="40" cy="40" r="32" fill="#fff" stroke="${CK_PL}" stroke-width="6"/><text x="40" y="56" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="44" fill="#9B6BD0">?</text>`,tap:1,soon:id}) });
    W.add({id:'lam',i:5.6,j:4.4,vb:'0 0 200 260',w:58,h:76,s:unwrap(kidSVG('Lam','happy',6)),tap:1,walk:1});
    W.add({id:'na',i:4.4,j:1.5,vb:'0 0 200 260',w:58,h:76,s:unwrap(kidSVG('Na','happy',6)),tap:1,walk:1});
    W.add({id:'ben',i:9.6,j:4.4,vb:'0 0 200 260',w:58,h:76,s:unwrap(kidSVG('Ben','happy',6)),tap:1,walk:1,home:'plaza'});
    Z0().animals.forEach((a,n)=>W.addAnimal(a,n));
    W.sort();
  };
  W.add=o=>{ W.spr[o.id]=o; const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','isp'+(o.tap||o.ani!=null?' tapme':'')); g.dataset.id=o.id;
    const sh=o.plain||o.soon?'':`<ellipse cx="0" cy="0" rx="${(o.w*.34).toFixed(1)}" ry="${(o.w*.12).toFixed(1)}" fill="${CK_PL}" opacity=".18"/>`;
    g.innerHTML=`${sh}<g class="bob"${o.plain?'':' filter="url(#isostk)"'}><svg x="${-o.w/2}" y="${-o.h+(o.foot||4)}" width="${o.w}" height="${o.h}" viewBox="${o.vb}" overflow="visible">${o.s}</svg></g>`;
    o.el=g; W.svg.querySelector('.ispr').append(g); W.pos(o); return o };
  W.addAnimal=(a,n)=>{ const D=ZA[a.t]; return W.add({id:'a'+n,ani:n,t:a.t,i:a.i,j:a.j,vb:zVB(a.t),w:D.w*.8,h:D.w*.8*(D.tall?1.05:1),s:zAnimal(a.t)}) };
  W.pos=o=>{ const [x,y]=isoP(o.i,o.j); o.el.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)})`) };
  W.sort=()=>{ const g=W.svg.querySelector('.ispr'); Object.values(W.spr).sort((a,b)=>key(a.i,a.j)-key(b.i,b.j)).forEach(o=>g.append(o.el)) };
  W.anim=(o,cls,ms=700)=>{ if(!o||!o.el) return; const b=o.el.querySelector('.bob'); b.classList.remove(cls); void b.getBoundingClientRect(); b.classList.add(cls); setTimeout(()=>b.classList.remove(cls),ms) };
  W.fx=(x,y,html,cls='ifxu',ms=1400)=>{ const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)})`); g.innerHTML=`<g class="${cls}">${html}</g>`; W.svg.querySelector('.ifx').append(g); setTimeout(()=>g.remove(),ms) };
  W.heart=o=>{ const [x,y]=isoP(o.i,o.j); for(let k=0;k<3;k++) setTimeout(()=>W.fx(x+(k-1)*22,y-o.h*.7,`<path d="M0 8 C-14 -2 -12 -16 -2 -14 Q0 -13 0 -10 Q0 -13 2 -14 C12 -16 14 -2 0 8Z" fill="#FF5C8A" stroke="${CK_PL}" stroke-width="3" stroke-linejoin="round"/>`),k*160) };
  W.bubble=(o,t)=>{ const [x,y]=isoP(o.i,o.j); const w=t.length*12+34; W.fx(x,y-o.h-8,`<rect x="${-w/2}" y="-46" width="${w}" height="40" rx="16" fill="#fff" stroke="${CK_PL}" stroke-width="4.5"/><path d="M-8 -8 L0 6 L8 -8" fill="#fff" stroke="${CK_PL}" stroke-width="4.5" stroke-linejoin="round"/><path d="M-9 -9 H9" stroke="#fff" stroke-width="6"/><text y="-19" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="20" fill="${CK_PL}">${esc(t)}</text>`,'ifxb',1800) };
  // camera: world units per screen pixel
  W.apply=()=>{ const r=W.svg.getBoundingClientRect(); if(!r.width) return; const c=W.cam, w=r.width*c.z, h=r.height*c.z; W.svg.setAttribute('viewBox',`${(c.cx-w/2).toFixed(1)} ${(c.cy-h/2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`) };
  W.fitZ=(b,m)=>{ const r=W.svg.getBoundingClientRect(); if(m==null) m=r.height>r.width*1.1?6:30; return Math.max((b.w+2*m)/Math.max(1,r.width),(b.h+2*m)/Math.max(1,r.height)) };
  W.fit=(b,instant)=>{ b=b||isoBounds(IISL[0]); const t={cx:b.x+b.w/2,cy:b.y+b.h/2,z:W.fitZ(b)}; if(instant){ W.cam=t; W.apply(); return } W.tgt=t; if(!W.camRaf) W.camRaf=requestAnimationFrame(W.camStep) };
  W.camStep=()=>{ const c=W.cam,t=W.tgt; if(!t){ W.camRaf=0; return } c.cx+=(t.cx-c.cx)*.16; c.cy+=(t.cy-c.cy)*.16; c.z+=(t.z-c.z)*.16; W.apply(); if(Math.abs(t.cx-c.cx)+Math.abs(t.cy-c.cy)<.5&&Math.abs(t.z-c.z)<.0008){ W.tgt=null; W.camRaf=0; return } W.camRaf=requestAnimationFrame(W.camStep) };
  W.toWorld=e=>{ const pt=W.svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(W.svg.getScreenCTM().inverse()) };
  W.zMin=()=>W.fitZ(isoBounds(IISL[0]))*.45; W.zMax=()=>W.fitZ(isoAll())*1.3;
  W.free=(skip)=>{ const taken=new Set(Object.values(W.spr).filter(o=>o.ani!=null&&o!==skip).map(o=>Math.floor(o.i)+','+Math.floor(o.j))); const out=[];
    for(let i=0;i<7;i++) for(let j=0;j<7;j++){ const k=i+','+j; if(!IBLOCK.has(k)&&!taken.has(k)&&k!=='6,5') out.push([i,j]) } return out };
  // the team and the animals wander about; Polly flies round the zoo
  const life=now=>{ if(!W.box.isConnected){ cancelAnimationFrame(W.raf); return }
    const t=now/1000; const pg=W.svg.querySelector('.ipolly'); if(pg&&!(W.pollyStop>now)){ const c=isoP(3.5,3.5); const a=t*.4; W.pollyAt=[c[0]+Math.cos(a)*300,c[1]-290+Math.sin(a)*50]; pg.setAttribute('transform',`translate(${W.pollyAt[0].toFixed(1)} ${W.pollyAt[1].toFixed(1)}) scale(${Math.sin(a)>0?-1:1} 1)`) }
    for(const o of Object.values(W.spr)){ if(!(o.walk||o.ani!=null)||W.drag&&W.drag.o===o||o.hold) continue;
      if(!o.to||now>o.next){ if(o.to&&now>o.next){ o.to=null; o.next=now+3000+Math.random()*5000; continue }
        if(!o.next){ o.next=now+1000+Math.random()*4000; continue } if(now<o.next) continue;
        const near=o.home==='plaza'?[[9.4,2.4],[11.6,2.4],[11.6,4.6],[9.4,4.6],[9.6,3.4]]:W.free(o).map(([i,j])=>[i+.5,j+.5]).filter(([i,j])=>Math.hypot(i-o.i,j-o.j)<2.2);
        if(!near.length){ o.next=now+3000; continue } const d=pick(near); o.from=[o.i,o.j]; o.to=d; o.t0=now; o.dur=1600+Math.hypot(d[0]-o.i,d[1]-o.j)*700; o.next=now+o.dur+2500+Math.random()*4000; o.el.querySelector('.bob').classList.add('walking') }
      if(o.to){ const p=Math.min(1,(now-o.t0)/o.dur); const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; const oi=o.i,oj=o.j; o.i=o.from[0]+(o.to[0]-o.from[0])*e; o.j=o.from[1]+(o.to[1]-o.from[1])*e; W.pos(o);
        if(Math.floor(oi+oj)!==Math.floor(o.i+o.j)) W.needSort=true;
        if(p>=1){ o.to=null; o.el.querySelector('.bob').classList.remove('walking'); if(o.ani!=null){ const A=Z0().animals[o.ani]; if(A){ A.i=o.i; A.j=o.j; save() } } } } }
    if(W.needSort){ W.needSort=false; W.sort() }
    W.raf=requestAnimationFrame(life) };
  W.draw(); requestAnimationFrame(()=>{ W.fit(null,true); if(!matchMedia('(prefers-reduced-motion: reduce)').matches) W.raf=requestAnimationFrame(life) });
  box.querySelector('.ibtn').onclick=()=>{ SFX.soft(); const all=W.cam.z<W.fitZ(isoAll())*.9; W.fit(all?isoAll():null) };
  addEventListener('resize',()=>{ if(W.box.isConnected) W.apply() });
  return W;
}
/** reactions when the child taps something */
function isoTap(W,o){
  const [x,y]=isoP(o.i,o.j);
  if(o.ani!=null){ const D=ZA[o.t];
    if(W.sel){ isoGive(W,o,W.sel); return }
    W.bubble(o,D.say[isVi()?1:0]);
    if(D.act==='spray'){ tone(260,.5,'sawtooth',.06,0,520); W.anim(o,'ijump',650); for(let k=0;k<7;k++) setTimeout(()=>W.fx(x+30+k*7,y-o.h*.45-k*4,`<circle r="6" fill="#7FC9EE" stroke="${CK_PL}" stroke-width="2.5"/>`,'ifxdrop',900),k*70) }
    else if(D.act==='roar'){ noise(.5,.25,0,500); tone(120,.5,'sawtooth',.08,0,70); W.anim(o,'ishake',550) }
    else W.anim(o,{slide:'islide',spin:'ispin',stretch:'istretch',roll:'iroll',jump:'ijump',yawn:'iyawn'}[D.act]||'ijump',1000), SFX.pop();
    say(`${cap(zAn(o.t))}!`,`${cap(D.vi)}!`,{gap:0,q:false}).catch(()=>{}); return }
  if(o.id==='lam'){ W.anim(o,'ijump',650); W.bubble(o,'A bird!'); say('Look! I can see a bird!','Nhìn kìa! Lam thấy một chú chim!',{gap:0,q:false}).catch(()=>{}); W.fx(x+60,y-150,`<path d="M-14 0 q7 -10 14 0 q7 -10 14 0" stroke="${CK_PL}" stroke-width="4" fill="none" stroke-linecap="round"/>`,'ifxu',1400); return }
  if(o.id==='na'){ W.anim(o,'ijump',650); W.bubble(o,'Hi!'); say('Hi! I love the animals!','Chào bạn! Na yêu các bạn thú lắm!',{gap:0,q:false}).catch(()=>{}); return }

/* ---- shared bits ---- */
function rfield(cls,bg){ const c=card(); const f=el(`<div class="rfield ${cls} fade">${bg||''}</div>`); c.append(f); return f }
const fpos=(f,e)=>{ const r=f.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height} };
/** the map piece flutters from (x,y) in the field to the middle and glows */
async function pieceDropAt(field,x,y,n){
  const fr=field.getBoundingClientRect(), dx=fr.width/2-x, dy=fr.height*.45-y;
  const pc=el(`<div class="dropiece stk" style="left:${x}px;top:${y}px">${mapPieceSVG(n)}</div>`); field.append(pc); tone(1100,.8,'sine',.06,0,600);
  await pc.animate([{transform:'translate(-50%,-50%) scale(.6)'},{transform:`translate(calc(-50% + ${dx*.4+40}px),calc(-50% + ${dy*.4-30}px)) rotate(16deg) scale(1.1)`},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(0) scale(1.8)`}],{duration:Math.max(1,1500*SPEED),easing:'ease-in-out',fill:'forwards'}).finished.catch(()=>{});
  pc.classList.add('glow'); SFX.chime(); burst(center(pc),{n:14}); await sleep(700) }
/** a loop that runs until stop(); dt in seconds */
function rafLoop(fn){ let on=true, t0=performance.now(); const step=t=>{ if(!on) return; if(PAUSED){ t0=t; requestAnimationFrame(step); return } const dt=Math.min(.05,(t-t0)/1000)/Math.max(.05,SPEED); t0=t; fn(dt); requestAnimationFrame(step) }; requestAnimationFrame(step); const stop=()=>{ on=false }; abortFns.add(stop); return ()=>{ on=false; abortFns.delete(stop) } }
/** wait for a condition set by the game: returns {done, promise} */
function gate(){ let res,rej; const p=new Promise((a,b)=>{ res=a; rej=b }); const ab=()=>rej(ABORT); abortFns.add(ab); return {p,done:v=>{ abortFns.delete(ab); res(v) }} }
const sayQ=(en,vi)=>say(en,vi,{gap:0,q:false}).catch(()=>{});


/* ---- a picture box with the shape of the background (200 × 140): everything inside is placed in %, so it lines up on every screen ---- */
function sbox(cls,bg,{under=''}={}){ const c=card(); const w=el(`<div class="sboxwrap fade"><div class="sbox ${cls}">${bg||''}</div>${under}</div>`); c.append(w); return $('.sbox',w) }
const pctIn=(box,e)=>{ const r=box.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100} };
function flyTo(elm,target,{ms=650,scale=1,arc=60}={}){ const a=elm.getBoundingClientRect(), b=target.getBoundingClientRect(); const dx=b.left+b.width/2-(a.left+a.width/2), dy=b.top+b.height/2-(a.top+a.height/2);
  return elm.animate([{translate:'0 0'},{translate:`${dx/2}px ${dy/2-arc}px`},{translate:`${dx}px ${dy}px`,scale}],{duration:Math.max(1,ms*SPEED),easing:'ease-in-out',fill:'forwards'}).finished.catch(()=>{}) }

   ========================================================= */
const TOYS=[()=>ART.ball(),()=>ART.car(),()=>ART.duck(),()=>ART.drum()];
async function toyCatch({piece=0,kitten=false}={}){
  const sk=SK['L2.M.SORT.02']; const f=rfield('toycatch',BG.home());
  if(kitten){ f.append(el(`<div class="kcat onshelf"><svg viewBox="-16 -40 32 42">${catG(0,0,1)}</svg></div>`)); await say('Oops! The kitten knocked the toys off the shelf!','Ơ! Mèo con làm đồ chơi trên kệ rơi xuống!') }
  const bk=el(`<div class="tbasket stk">${ART.basket()}<b class="tcount"></b></div>`); f.append(bk);
  let W0=0,H0=0, bx=.5; const fit=()=>{ const r=f.getBoundingClientRect(); W0=r.width; H0=r.height }; fit();
  const moveB=x=>{ bx=Math.max(.1,Math.min(.9,x/W0)); bk.style.left=(bx*100)+'%' }; moveB(W0/2);
  f.addEventListener('pointermove',e=>moveB(fpos(f,e).x)); f.addEventListener('pointerdown',e=>moveB(fpos(f,e).x));
  let toys=[], want='big', got=0, need=4, wrong=0, slowF=1, spawnT=0, phase=null, special=null; const t0=performance.now();
  const spawn=(kind)=>{ const big=kind?kind==='big':Math.random()<.5, isP=kind==='piece';
    const t=el(`<div class="ftoy ${isP?'piece':big?'big':'small'}" style="left:${8+rand(84)}%">${isP?mapPieceSVG(piece):pick(TOYS)()}</div>`); f.append(t);
    toys.push({e:t,y:-.15,big,isP,v:(isP?.16:.2+Math.random()*.06)*slowF,x:parseFloat(t.style.left)/100}) };
  const g=gate();
  const stop=rafLoop(dt=>{ if(!phase) return; fit(); spawnT-=dt;
    if(phase==='play'&&spawnT<=0){ spawnT=1.3; const right=toys.filter(o=>!o.done&&o.big===(want==='big')&&!o.isP).length; spawn(right?null:want) }
    if(phase==='piece'&&!toys.some(o=>o.isP&&!o.done)) spawn('piece');
    if(AUTO){ const tg=toys.filter(o=>!o.done&&(o.isP||o.big===(want==='big'))).sort((a,b)=>b.y-a.y)[0]; if(tg) moveB((bx+(tg.x-bx)*Math.min(1,dt*6))*W0) }
    for(const o of toys){ if(o.done) continue; o.y+=o.v*dt; o.e.style.top=(o.y*100)+'%';
      if(o.y>.72&&o.y<.86&&Math.abs(o.x-bx)<.11){ o.done=true;
        if(o.isP){ o.e.remove(); g.done('piece'); continue }
        if(o.big===(want==='big')){ got++; o.e.classList.add('caught'); SFX.pop(); burst(center(bk),{n:8}); $('.tcount',bk).textContent=got; sayQ(cap(W[got])+'!',cap(VI_N[got])+'!'); setTimeout(()=>o.e.remove(),300);
          if(got>=need){ phase=null; toys.forEach(q=>{ if(!q.done){ q.done=true; q.e.classList.add('gone') } }); setTimeout(()=>g.done('round'),500) } }
        else { wrong++; o.e.classList.add('bounce'); boing(); sayQ(o.big?'That one is big!':'That one is small!',o.big?'Cái đó to!':'Cái đó nhỏ!'); setTimeout(()=>o.e.remove(),700) } }
      else if(o.y>1.1){ o.done=true; o.e.remove(); if(o.isP||o.big===(want==='big')) slowF=Math.max(.55,slowF*.85) } }
    toys=toys.filter(o=>!o.done||o.e.isConnected) });
  turn('kid');
  try{
    await say('Toys are falling from the shelf! Move the basket. Catch the big toys!','Đồ chơi rơi từ trên kệ xuống! Con di chuyển cái giỏ. Bắt các đồ chơi to nhé!',{q:true});
    phase='play'; await g.p;
    await say('Four big toys!','Bốn đồ chơi to!'); want='small'; got=0; need=5; $('.tcount',bk).textContent=''; bk.classList.add('small');
    const g2=gate(); g.done=g2.done; g.p=g2.p;
    await say('Now catch the small toys!','Giờ bắt các đồ chơi nhỏ nhé!',{q:true}); phase='play'; await g2.p;
    await say('Five small toys! The room is tidy.','Năm đồ chơi nhỏ! Phòng gọn gàng rồi.');
    if(piece){ const g3=gate(); g.done=g3.done; await say('Look! Something else is falling. Catch it!','Nhìn kìa! Có gì đang rơi xuống nữa. Con bắt nhé!',{q:true}); phase='piece'; await g3.p; phase=null;
      const fr=f.getBoundingClientRect(), r=bk.getBoundingClientRect(); await pieceDropAt(f,r.left-fr.left+r.width/2,r.top-fr.top,piece) }
  } finally { stop() }
  turn(null); rec(sk,wrong<=1,performance.now()-t0,'size:all'); confetti();

/* =========================================================
   4. CRANE TOWER (Lesson 5): the crane swings a square or a rectangle; tap to drop it on the tower.
   ========================================================= */
async function craneStack({piece=0}={}){
  const sk=SK['L2.M.SHAPE.02']; const f=sbox('crane',BG.site()); const CX=.6;
  const hook=el(`<div class="chook"><i class="rope"></i></div>`); f.append(hook);

  const base=el(`<div class="cbase"></div>`); f.append(base);
  const COLS=['#E8607E','#4A9BDB','#FCB515','#58B592','#9B6BD0','#FF8A3D'];
  let stack=[], wrong=0; const t0=performance.now(); const need=5;
  const fr=()=>f.getBoundingClientRect();
  const make=(kind,i)=>{ if(kind==='piece') return el(`<div class="cblock piece">${mapPieceSVG(piece)}</div>`); const b=el(`<div class="cblock ${kind}" style="--c:${COLS[i%COLS.length]}"></div>`); return b };
  turn('kid');
  await say('Let’s build a tall tower with the crane! Tap to drop the block.','Mình xây tháp cao bằng cần cẩu nhé! Con chạm để thả khối xuống.',{q:true});
  for(let i=0;i<=need;i++){
    const kind=i===need?(piece?'piece':null):(i%2?'square':'rectangle'); if(!kind) break;
    const b=make(kind,i); hook.append(b); await sleep(30); const bw=b.getBoundingClientRect().width/fr().width;
    { // the block hangs above the tower top: on a tall phone the rope comes down from higher up
      const R=fr(), artH=R.height, armY=artH*(15/140), bh0=b.getBoundingClientRect().height;
      const hang=Math.min(armY+Math.max(30,artH*.16), R.height*.86-stack.reduce((a,q)=>a+q.h,0)-bh0*1.9);
      if(hang-armY>=24){ hook.style.top=armY+'px'; hook.style.height=(hang-armY)+'px' } else { hook.style.top='0px'; hook.style.height=Math.max(16,hang)+'px' } }
    if(kind!=='piece') await say(kind==='square'?'A square!':'A rectangle!',kind==='square'?'Hình vuông!':'Hình chữ nhật!',{q:false,gap:0});
    else await say('The crane has the map piece! Drop it on top!','Cần cẩu mang mảnh bản đồ! Con thả lên đỉnh tháp nhé!',{q:true});
    // swing
    let t=0, x=CX, dropping=false; const amp=.14;
    const stopS=rafLoop(dt=>{ if(dropping) return; t+=dt*1.1; x=CX+Math.sin(t)*amp; hook.style.left=(x*100)+'%' });
    const g=gate(); const tap=()=>{ if(dropping) return; dropping=true; f.removeEventListener('pointerdown',tap); g.done() };
    f.addEventListener('pointerdown',tap);
    if(AUTO) (async()=>{ for(let w=0;w<60&&!dropping;w++){ await new Promise(r=>setTimeout(r,60)); const top=stack.length?stack[stack.length-1].x:CX; if(Math.abs(x-top)<.03&&w>8) tap() } if(!dropping) tap() })();
    await g.p; stopS();
    // fall onto the tower (a kind magnet: within half a block it lines up)
    const top=stack.length?stack[stack.length-1]:{x:CX,w:base.getBoundingClientRect().width/fr().width}; let off=x-top.x; const ok=Math.abs(off)<(top.w/2+bw/2)*.85;
    if(ok&&Math.abs(off)<bw*.6) off*=.35; const lx=ok?top.x+off:x;
    const R2=fr(), hb=hook.getBoundingClientRect(), bb=b.getBoundingClientRect();
    const bh=bb.height, groundY=R2.height*.86, topY=groundY-stack.reduce((a,s)=>a+s.h,0);
    b.remove(); const fb=b; fb.style.left=(x*100)+'%'; fb.style.top=(bb.top-R2.top)+'px'; fb.classList.add('falling'); f.append(fb);
    const endY=ok?topY-bh:groundY-bh;
    await fb.animate([{top:(bb.top-R2.top)+'px',left:(x*100)+'%'},{top:endY+'px',left:(lx*100)+'%'}],{duration:Math.max(1,520*SPEED),easing:'cubic-bezier(.5,0,1,1)',fill:'forwards'}).finished.catch(()=>{});
    fb.style.top=endY+'px'; fb.style.left=(lx*100)+'%';
    if(kind==='piece'){ SFX.chime(); fb.style.visibility='hidden'; await pieceDropAt(f,lx*R2.width,endY+bh/2,piece); break }
    if(ok){ stack.push({x:lx,w:bw,h:bh,e:fb}); tone(220,.12,'square',.07); fb.classList.add('land'); burst(center(fb),{n:6}); if(stack.length>1) sayQ(cap(W[stack.length])+'!',cap(VI_N[stack.length])+'!') }
    else { wrong++; boing(); fb.classList.add('tip'); await say('Oops, it missed! Here’s another one.','Ối, trượt rồi! Thêm một khối nữa nhé.',{gap:0}); setTimeout(()=>fb.remove(),600); i-- }
    await sleep(350);
  }
  turn(null); rec(sk,wrong<=2,performance.now()-t0,'shape:rectangle'); confetti();
  await say(`A tall tower! ${cap(W[stack.length])} blocks: squares and rectangles.`,`Tháp cao quá! ${cap(VI_N[stack.length])} khối: hình vuông và hình chữ nhật.`);
}


/* =========================================================
   5. FROG CROSSING (Lesson 6): three roads with grass between them. The frog crosses one road at a time,
   only when the pedestrian light shows the green walking person (then the cars wait at the line).
   Hop on red: a car honks, the frog bumps back to the grass it came from (never all the way back).
   Morning → afternoon → night on the way (the Chapter 1 time words).
   ========================================================= */
const DAYPART=[['morning','buổi sáng','#8FD3F4'],['afternoon','buổi chiều','#FFD08A'],['afternoon','buổi chiều','#F7A35C'],['night','ban đêm','#2B2D6E']];
const PED=(c,walk)=>`<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="8" r="5" fill="${c}"/>${walk?`<path d="M20 15 L17 26 M20 15 L26 22 L31 21 M18 21 L12 23 M17 26 L12 36 M17 26 L24 30 L25 37" stroke="${c}" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`:`<path d="M20 15 V28 M14 17 V27 M26 17 V27 M17 28 V37 M23 28 V37" stroke="${c}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`}</svg>`;
async function frogRoad({piece=0}={}){
  const sk=SK['L2.M.POS.02']; const box=sbox('frogroad','');
  // bands, from the bottom: grass 0–16, road 16–30, grass 30–40, road 40–54, grass 54–64, road 64–78, pond 78–91, sky 91–100
  const ROADS=[[16,30],[40,54],[64,78]], GRASS=[3,30.5,54.5], POND=80;
  box.innerHTML=`<div class="fsky"></div><div class="fpond"><i class="lilypad"></i>${piece?`<button class="lily">${mapPieceSVG(piece)}</button>`:''}</div>
   ${ROADS.map(([a,b],i)=>`<div class="lane" style="bottom:${a}%;height:${b-a}%"><i class="dash"></i><i class="zebra"></i></div>`).join('')}
   <div class="pedlight"><i class="pr">${PED('#FF4D4D',false)}</i><i class="pg">${PED('#4CE38A',true)}</i></div><div class="rfrog stk">${ART.frog()}</div>`;
  const frog=$('.rfrog',box), sky=$('.fsky',box), pl=$('.pedlight',box), lanes=[...box.querySelectorAll('.lane')];
  const cars=[]; lanes.forEach((ln,i)=>{ for(let k=0;k<2;k++){ const dir=i%2?-1:1; const e=el(`<div class="fcar ${dir<0?'rev':''}" style="filter:hue-rotate(${[0,140,200,280,60,320][(i*2+k)%6]}deg)">${ART.car()}</div>`); ln.append(e);
    cars.push({e,lane:i,dir,x:dir>0?(k?-60:10):(k?150:80),v:(22+i*5)*(1+k*.15)}) } });
  const CW=[42,58], CARW=12;
  let green=false, pos=0, busy=false;
  const setG=v=>{ green=v; pl.classList.toggle('go',v) };
  const stopLoop=rafLoop(dt=>{ for(const c of cars){ let nx=c.x+c.dir*c.v*dt;
      if(green){ const line=c.dir>0?CW[0]-CARW-2:CW[1]+2; if(c.dir>0&&c.x<=line&&nx>line) nx=line; if(c.dir<0&&c.x>=line&&nx<line) nx=line }
      if(c.dir>0&&nx>110) nx=-20; if(c.dir<0&&nx<-20) nx=110; c.x=nx; c.e.style.left=c.x+'%' } });
  const clear=lane=>!cars.some(c=>c.lane===lane&&c.x+CARW>CW[0]-2&&c.x<CW[1]+2);
  setG(false); let cyc=null; const cycle=()=>{ setG(!green); cyc=setTimeout(cycle,(green?3600:3000)*Math.max(.3,SPEED)) }; cyc=setTimeout(cycle,2200*Math.max(.3,SPEED)); abortFns.add(()=>clearTimeout(cyc));
  const setSky=i=>{ sky.style.background=DAYPART[i][2]; box.dataset.part=DAYPART[i][0] }; setSky(0);
  const at=b=>{ frog.style.bottom=b+'%' }; at(GRASS[0]);
  let wrong=0; const t0=performance.now();
  turn('kid');
  try{
    await say('The frog wants to go home to the pond. Wait for the green walking light, then tap to cross!','Bạn ếch muốn về ao. Con chờ đèn xanh hình người đi bộ rồi chạm để ếch qua đường nhé!',{q:true});
    await say('It’s morning!','Buổi sáng rồi!',{gap:0});
    while(pos<3){
      const g=gate();
      const tap=async()=>{ if(busy) return; busy=true; const road=ROADS[pos];
        if(!green){ wrong++; at((road[0]+road[1])/2-5); tone(500,.12,'sine',.07,0,800); await sleep(380); tone(330,.25,'square',.07); tone(392,.25,'square',.05,.05);
          frog.classList.remove('bump'); void frog.offsetWidth; frog.classList.add('bump'); await sleep(300); at(GRASS[pos]); await say('Beep beep! Oh no! Wait for the green light.','Bíp bíp! Ôi! Chờ đèn xanh đã nhé.',{gap:0}); busy=false; return }
        for(let w=0;w<20&&!clear(pos);w++) await sleep(120);   // a car still on the crossing: wait a moment
        box.removeEventListener('pointerdown',tap); g.done() };
      box.addEventListener('pointerdown',tap);
      if(AUTO) (async()=>{ for(let w=0;w<300;w++){ await new Promise(r=>setTimeout(r,80)); if(green&&!busy&&g){ tap(); break } } })();
      await g.p; pos++; tone(500,.15,'sine',.08,0,900); at(pos<3?GRASS[pos]:POND); await sleep(450); busy=false;
      setSky(pos); await say(pos===1?'Hop! Now it’s afternoon.':pos===2?'Hop! One more road!':'Hop! Now it’s night.',pos===1?'Nhảy! Giờ là buổi chiều.':pos===2?'Nhảy! Còn một con đường nữa!':'Nhảy! Giờ là ban đêm.',{gap:0})
    }
    clearTimeout(cyc); setG(true); SFX.chime(); confetti();
    await say('The frog is home! Good night, frog!','Ếch về đến nhà rồi! Chúc ếch ngủ ngon!');
    if(piece){ await say('Look! Something is on the lily pad. Tap it!','Nhìn kìa! Có gì trên lá sen. Con chạm vào nhé!',{q:true}); const lily=$('.lily',box); lily.dataset.ok='1'; await tapOnce([lily]);
      const fr=box.getBoundingClientRect(), r=lily.getBoundingClientRect(); lily.style.visibility='hidden'; await pieceDropAt(box,r.left-fr.left+r.width/2,r.top-fr.top+r.height/2,piece) }
  } finally { stopLoop(); clearTimeout(cyc) }
  turn(null); rec(sk,wrong===0,performance.now()-t0,'time:all');
}

/* =========================================================
   6. MEMORY CARDS (Treasure): turn two cards; find the same feelings.
   ========================================================= */
// kind 'feel': two faces that feel the same. kind 'num': a number and the dots that show it (1, 2, 3: seen at a glance)
async function memoryCards({pairs=4,kind='feel'}={}){
  const num=kind==='num'; const sk=SK[num?'L2.M.NUM.03':'L2.W.FEEL.02']; if(num) pairs=3;
  const set=num?[1,2,3]:shuffle(FEELS).slice(0,pairs), deck=shuffle(num?[...set.map(v=>[v,'n']),...set.map(v=>[v,'d'])]:[...set,...set].map(v=>[v,'f']));
  const c=card(); const grid=el(`<div class="memgrid fade${num?' nums':''}" style="--n:${pairs}"></div>`); c.append(grid);
  const NAME=v=>num?[cap(W[v]),cap(VI_N[v])]:[cap(v),cap(VI_FEEL[v])];
  const cards=deck.map(([v,t])=>{ const front=t==='n'?`<b class="mnum">${v}</b>`:t==='d'?dieSVG(v):faceSVG(v); const b=el(`<button class="mcard"><span class="back stk"><svg viewBox="0 0 60 60"><path d="${starPath(30,30,18)}" fill="#FFD21F" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/></svg></span><span class="front">${front}</span></button>`); b.dataset.f=v; grid.append(b); return b });
  if(num) await say('Match each number to its dots! Turn two cards.','Tìm số và chấm đi cùng nhau nhé! Con lật hai thẻ.',{q:true});
  else await say('Turn two cards. Find two faces that feel the same!','Con lật hai thẻ. Tìm hai khuôn mặt có cùng cảm xúc nhé!',{q:true});
  turn('kid'); let open=[], matched=0, tries=0; const t0=performance.now(); const g=gate(); let lock=false;
  const flip=async b=>{ if(lock||b.classList.contains('up')) return; b.classList.add('up'); tone(700,.06,'sine',.05); open.push(b); { const [e1,v1]=NAME(num?+b.dataset.f:b.dataset.f); sayQ(e1+'!',v1+'!') }
    if(open.length<2) return; lock=true; tries++; const [a,d]=open; open=[];
    if(a.dataset.f===d.dataset.f){ matched++; await sleep(700); a.classList.add('done'); d.classList.add('done'); SFX.chime(); burst(center(d),{n:8}); { const [e1,v1]=NAME(num?+a.dataset.f:a.dataset.f); sayQ(`${e1} and ${e1.toLowerCase()}!`,`${v1} và ${v1.toLowerCase()}!`) } lock=false; if(matched>=pairs) setTimeout(()=>g.done(),700) }
    else { await sleep(1500*Math.max(.3,SPEED)); a.classList.remove('up'); d.classList.remove('up'); lock=false } };
  cards.forEach(b=>b.onclick=()=>flip(b));
  if(AUTO) (async()=>{ for(const fe of set){ const two=cards.filter(b=>b.dataset.f===String(fe)); for(const b of two){ await new Promise(r=>setTimeout(r,kidTapDelay())); flip(b) } await new Promise(r=>setTimeout(r,800)) } })();
  await g.p; turn(null); rec(sk,tries<=pairs+3,performance.now()-t0); confetti();
  await say('You found all the pairs!','Con tìm được hết các cặp rồi!');
  if(kind==='feel'&&arguments[0]&&arguments[0].thenNum){ await say('One more lock: a number lock!','Còn một ổ khoá nữa: khoá số!'); await memoryCards({kind:'num'}) }
}

/* ---- 3. three little things in the yard, one after another: Ben's mum leaves → the teacher's cookies → Polly takes Lam's cookie ---- */

/* ---- Polly and Lam's cookie: Polly's beak really reaches the cookie, the cookie goes with Polly; later Polly brings it back ---- */
const BEAK={x:.8,y:.44};   // where Polly's beak is, as a part of her picture
function parrotAt(sc,p,ck){ const sr=sc.getBoundingClientRect(), cr=ck.getBoundingClientRect(), pr=p.getBoundingClientRect();
  const lx=(cr.left+cr.width/2)-sr.left-BEAK.x*pr.width, ty=(cr.top+cr.height/2)-sr.top-BEAK.y*pr.height;
  return {left:(lx/sr.width*100)+'%',bottom:((sr.height-ty-pr.height)/sr.height*100)+'%'} }
const parrotFly=(p,from,to,ms)=>p.animate([from,to],{duration:Math.max(1,ms*SPEED),easing:'ease-in-out',fill:'forwards'}).finished.catch(()=>{});
async function pollyGrab(sc){ const p=sc.querySelector('.fs-parrot'), ck=sc.querySelector('.cookie'); if(!p||!ck) return;
  if(ck.parentElement!==sc){ sc.append(ck); ck.classList.remove('inbeak'); ck.removeAttribute('style') }
  p.getAnimations().forEach(a=>a.cancel()); const start={left:'-24%',bottom:'72%'}; p.style.left=start.left; p.style.bottom=start.bottom;
  const at=parrotAt(sc,p,ck); tone(900,.1,'square',.04,0,1400);
  await parrotFly(p,start,at,1300*1.0);
  // grab: the cookie goes into Polly's beak
  const pr=p.getBoundingClientRect(), cr=ck.getBoundingClientRect(); const cw=cr.width/pr.width*100, ch=cr.height/pr.height*100;
  p.append(ck); ck.classList.add('inbeak'); ck.style.width=cw+'%'; ck.style.left=(BEAK.x*100-cw/2)+'%'; ck.style.top=(BEAK.y*100-ch/2)+'%'; ck.style.bottom='auto';
  tone(1500,.12,'square',.05,0,1900); await sleep(380);
  await parrotFly(p,at,{left:'112%',bottom:'86%'},1100) }
async function pollyReturn(SC){ const sc=SC.el, p=sc.querySelector('.fs-parrot'); if(!p) return; const ck=p.querySelector('.cookie');
  p.getAnimations().forEach(a=>a.cancel()); const from={left:'112%',bottom:'86%'}; p.style.left=from.left; p.style.bottom=from.bottom;
  // where the cookie goes back: Lam's hand
  const home=el(`<div class="fs-prop cookie" style="visibility:hidden">${ART.cookie()}</div>`); sc.append(home);
  const at=parrotAt(sc,p,home); await say('Look! Polly is coming back.','Nhìn kìa! Polly bay trở lại.',{q:false});
  await parrotFly(p,from,at,1300);
  if(ck) ck.remove(); home.style.visibility=''; SFX.pop(); await sleep(250);
  await say('Polly gives the cookie back to Lam.','Polly trả lại bánh cho Lam.',{q:false});
  const perch={left:'76%',bottom:'60%'}; await parrotFly(p,at,perch,900);
  const b=el(`<div class="fs-pbub"></div>`); p.append(b);

async function playVoiceAs(b,rate=1.3){ try{ const a=ac(); if(!a) throw 0; const data=await b.arrayBuffer();
    const buf=await new Promise((res,rej)=>{ try{ const p=a.decodeAudioData(data,res,rej); if(p&&p.then) p.then(res,rej) }catch(e){ rej(e) } });
    await new Promise(res=>{ const s=a.createBufferSource(), g=a.createGain(); g.gain.value=1.8; s.buffer=buf; s.playbackRate.value=rate; s.connect(g).connect(a.destination); s.onended=res; s.start(); setTimeout(res,buf.duration/rate*1000+600) }) }
  catch(e){ await playBlobEl(b) } }

/* ---- tracing on the story's own picture (20/10): the line is drawn where it happens (the string down to Na's hand, the road for the bus),
   and when it is done the picture plays what the line made happen. K.scene = {bg, build(T), A, B (in % of the picture, or functions),
   lane, col, w(H), mover, moverSize, onProg(T,q,f), done(T)} ---- */
function traceSceneSetup(K){
  const SC=K.scene; const box=sbox('tscene'+(SC.cls?' '+SC.cls:''),SC.bg());
  // two layers: the lane and the drawn line lie under the people and things (a road under the bus); the green circle stays on top
  const svg=el('<svg class="tk tk-low" preserveAspectRatio="none" aria-hidden="true"></svg>'), top=el('<svg class="tk tk-top" preserveAspectRatio="none" aria-hidden="true"></svg>'); box.prepend(svg); box.append(top);
  const T={box,svg,cur:0,band:56,startR:56,K,el:{}}; let line=null, mover=null;
  if(SC.build) SC.build(T);
  if(SC.mover){ mover=el(`<div class="tk-ico mover tk-ms">${typeof SC.mover==='function'?SC.mover():ART[SC.mover]()}</div>`); box.append(mover) }
  const layout=()=>{ const r=box.getBoundingClientRect(), Wd=r.width, Ht=r.height; if(!Wd||!Ht) return false;
    const at=v=>typeof v==='function'?v(T,r):{x:v[0]*Wd/100,y:v[1]*Ht/100};
    let A=at(SC.A), B=at(SC.B); if(!A||!B) return false; B=K.v?{x:A.x,y:B.y}:{x:B.x,y:A.y};   // always a straight line, down or across
    const vb=Math.max(22,Ht*.07), ring=Math.max(24,Ht*.065); T.band=Math.max(52,Ht*.12); T.startR=Math.max(46,ring*1.5);
    svg.setAttribute('viewBox',`0 0 ${Wd} ${Ht}`); top.setAttribute('viewBox',`0 0 ${Wd} ${Ht}`);
    svg.innerHTML=traceLane(SC.lane||'dots',A,B,vb,K)+`<line class="done" x1="${A.x}" y1="${A.y}" x2="${A.x}" y2="${A.y}" stroke="${SC.col||INK}" stroke-width="${SC.w?SC.w(Ht):4}" stroke-linecap="round"/>`;
    top.innerHTML=`<circle cx="${A.x}" cy="${A.y}" r="${ring}" fill="#58B592" fill-opacity=".2" stroke="#58B592" stroke-width="5"/><circle cx="${A.x}" cy="${A.y}" r="${ring*.3}" fill="#58B592" stroke="${INK}" stroke-width="3"/>`;
    line=$('line.done',svg);
    if(mover){ const s=Math.max(28,Ht*(SC.moverSize||.1)); Object.assign(mover.style,{width:s+'px',height:s+'px',margin:`${-s/2}px 0 0 ${-s/2}px`}) }
    Object.assign(T,{A,B,len:K.v?B.y-A.y:B.x-A.x,Wd,Ht}); return true };
  T.setProg=p=>{ const A=T.A; T.cur=T.len?p/T.len:0; const q=K.v?{x:A.x,y:A.y+p}:{x:A.x+p,y:A.y}; if(line){ line.setAttribute('x2',q.x); line.setAttribute('y2',q.y) }
    if(mover){ mover.style.left=q.x+'px'; mover.style.top=q.y+'px' } if(SC.onProg) SC.onProg(T,q,T.cur); return q };
  /** the guides go; the picture stays. keep: false → everything drawn goes · 'line' → the drawn line stays (a road) · 'all' → the lane stays too (a slide, a bridge) */
  T.clean=(keep=false)=>{ const fade=e=>e.animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards'}); fade(top); if(!keep) fade(svg); else if(keep!=='all') [...svg.children].forEach(c=>{ if(c!==line) fade(c) }); if(mover) mover.remove() };
  layout(); T.setProg(0);
  let lw=box.getBoundingClientRect().width, lh=box.getBoundingClientRect().height;
  if(window.ResizeObserver){ const ro=new ResizeObserver(()=>{ if(!box.isConnected){ ro.disconnect(); return } const r=box.getBoundingClientRect(); if(Math.abs(r.width-lw)<2&&Math.abs(r.height-lh)<2) return; lw=r.width; lh=r.height;
    const f=T.cur, old=T.len; if(!layout()) return; T.setProg(f*T.len); if(T.onScale&&old) T.onScale(T.len/old) }); ro.observe(box) }
  return T }

/* ---- 5 and 9: count to ten out loud. Each number the child says (a burst of voice) moves something: a duck swims in, Polly pulls the balloon down.
   At least 0.6 s between two (a two-part word like "se-ven" moves one duck, not two). No microphone, or nothing heard: Chồi counts
   with the child. Nothing to tap, no "How many?" ---- */
async function countOutLoud({sk,box,n=10,ask,askMic,onBeat,together,done,doneTogether,numAt='left:50%;bottom:5%'}){
  const big=el(`<b class="pk-num" style="${numAt}"></b>`); box.append(big);
  let k=0; const show=i=>{ big.textContent=i; big.classList.remove('bump'); void big.offsetWidth; big.classList.add('bump') };
  const beat=()=>{ if(k>=n) return; k++; show(k); onBeat(k); if(k>=n) MICSTOP.at=performance.now()+1200 };
  const sayTogether=async()=>{ await say(...together); for(let i=1;i<=n;i++){ if(i>k) beat(); else show(i); await say(cap(W[i])+'.',cap(VI_N[i])+'.',{gap:500,rate:.85,q:false}) } confetti(); await say(...doneTogether); return null };
  if(micState==='denied'||micState==='none'){ await say(...ask,{q:true}); return sayTogether() }   // the microphone was refused before: count with Chồi
  const mic=el(`<button class="mic boxmic" aria-label="Micro">${ICON.mic}</button>`); box.append(mic);
  await say(...ask,{q:true}); await say(...askMic,{q:true}); RUN.qfn=async()=>{ await say(...ask,{replay:true}); await say(...askMic,{replay:true}) };
  turn('kid');
  let loud=false, last=0, quiet=0, floor=null, t0=0, fb=null;
  const arm=()=>{ clearTimeout(fb); fb=setTimeout(()=>{ if(k<n){ beat(); last=performance.now(); arm() } },2200) };   // a quiet child still sees things move, slowly
  const T=await micTurn(mic,16000,{onStart:()=>{ t0=performance.now(); arm() },
    onLevel:l=>{ const now=performance.now(); if(floor===null&&now-t0>250) floor=l; const th=Math.max(.16,(floor||0)*2.6);
      if(!loud&&l>th&&now-last>600&&now-quiet>110){ loud=true; last=now; beat(); arm() } else if(loud&&l<th*.55){ loud=false; quiet=now } }});
  clearTimeout(fb); mic.remove(); turn(null);
  const r=T.r||null, heard=T.heard||null, voiced=!!(r&&r.voiced);
  if(!voiced) return sayTogether();
  while(k<n){ beat(); await say(cap(W[k])+'.',cap(VI_N[k])+'.',{gap:200,q:false}) }   // the last few, together
  const NW=isVi()?VI_N:W; const got=heard?NW.slice(1,n+1).filter((w,i)=>heard.some(h=>norm(h).includes(norm(w))||h.includes(String(i+1)))).length:null;
  const id='c'+Date.now(); S.speaks.push({s:sk.id,d:today(),lang:S.lang,text:NW.slice(1,n+1).join(', '),voiced:true,heard:heard?heard[0]:null,matched:got===null?null:got>=Math.ceil(n*.6),clip:r.blob?id:null}); save(); if(r.blob) putClip(id,r.blob);
  confetti(); await praise(done);
  if(r.blob){ await say('Listen! That’s you counting!','Nghe này, con đếm đấy!',{gap:200}); Music.level(.15); await playBlob(r.blob); Music.level(1) }
  return r }

/* =========================================================
   LEVEL 2 · THE GARDEN AT NIGHT: "camping in the garden" (spiral version, 20/10)
   One evening in the garden behind Na's house: the sun goes down → fireflies → the lanterns play music → a storm, Lam is scared →
   ladybugs after the rain → Na's kitten looks for a dry spot → Na's drum → hide and seek (count to ten) → the flashlight finds
   everyone, and the map piece → Ben is tired, into his sleeping bag (a lullaby).
   New: seeing 1–3 at a glance (start: fireflies; middle: ladybugs, answers are dot cards; end: Na's drum).
   Second new: scared, tired. Mầm: in, on, under (the kitten; asked again with the flashlight: Where? Who?).

  box.append(kidAt('Lam','happy',22,4,12),kidAt('Na','happy',80,4,12));

  await say('Na’s lanterns are magic. When a lantern lights up, it plays music!','Đèn lồng của Na có phép. Đèn nào sáng lên là phát ra nhạc!');

  for(let r=0;r<rounds;r++){ const [t,tvi,phrase]=RR[r], other=t==='excited'?'surprised':'excited', pair=[L[r*2],L[r*2+1]], k=rand(2), feels=k?[other,t]:[t,other];

    const listen=async()=>{ await say(r?'Two new lanterns. Listen to this one…':'Listen to this lantern…',r?'Hai đèn lồng mới. Nghe đèn này nhé…':'Nghe đèn lồng này nhé…',{gap:150,q:false}); await play(0); await say('…and this one.','…và đèn này.',{gap:150,q:false}); await play(1) };
    const ask=()=>say(`Which lantern’s music ${phrase}? Tap that lantern!`,`Nhạc của đèn lồng nào nghe ${tvi}? Con chạm vào đèn đó nhé!`);

      onRight:async()=>{ hh(); pair[k].classList.add('lit','bright') }});

  L.forEach((b,i)=>setTimeout(()=>b.classList.add('lit','bright'),i*200*SPEED)); SFX.chime(); await sleep(900);
