/** the 3 presents: 1 area open → 3 from it; 2 areas → 2 from the emptier one; 3+ → 3 areas, emptier ones more likely */
function giftOptions(){
  const c=C(); const open=ZORDER.filter(z=>c.open.includes(z)&&zoneHasRoom(z)); if(!open.length) return [];
  let zones;
  if(open.length===1) zones=[open[0],open[0],open[0]];
  else if(open.length===2){ const [a,b]=open.slice().sort((x,y)=>zFill(x)-zFill(y)||Math.random()-.5); zones=[a,a,b] }
  else { const pool=open.slice(); zones=[]; while(zones.length<3&&pool.length){ const ws=pool.map(z=>1.15-zFill(z)); let r=Math.random()*ws.reduce((a,b)=>a+b,0), k=0; while(k<ws.length-1&&r>ws[k]){ r-=ws[k]; k++ } zones.push(pool.splice(k,1)[0]) } while(zones.length<3) zones.push(zones[0]) }
  const owned=new Set(c.items.map(it=>it.t)), out=[];
  for(const z of zones){ const ts=Object.keys(CITEM).filter(t=>CITEM[t].z===z&&typeFits(t)&&!out.includes(t)); if(!ts.length) continue;
    const fresh=ts.filter(t=>!owned.has(t)); out.push(pick(fresh.length?fresh:ts)) }
  return shuffle(out);
}

  const path=LESSONS.slice(1).flatMap(l=>l.items).map(id=>SK[id]);

const NODE_ART=[()=>ART.balloon('#E8607E'),()=>ART.birthday(),()=>ART.kite(),()=>ART.bed(),()=>ART.basket(),()=>ART.blocks(),()=>ART.sun(),()=>ART.star('#FCB515')];

function mapPoints(W,H){
  const N=LEVELS, pts=[];
  if(W>=H*1.05){ const m=Math.min(W*.08,90); for(let i=0;i<N;i++) pts.push({x:m+i*(W-2*m)/(N-1),y:H*(.52-.27*Math.sin(i*1.35+.3))}) }

}
function smoothPath(p){ let d=`M${p[0].x} ${p[0].y}`; for(let i=0;i<p.length-1;i++){ const a=p[i-1]||p[i], b=p[i], c=p[i+1], e=p[i+2]||c;
  d+=` C${b.x+(c.x-a.x)/6} ${b.y+(c.y-a.y)/6} ${c.x-(e.x-b.x)/6} ${c.y-(e.y-b.y)/6} ${c.x} ${c.y}` } return d }
function drawMap(){
  const pm=$('#pathmap'); if(!pm) return; root.querySelectorAll('.mapbg').forEach(x=>x.remove()); const W=pm.clientWidth, H=pm.clientHeight; if(!W||!H) return;
  const pts=mapPoints(W,H), d=smoothPath(pts), R=Math.max(30,Math.min(48,Math.min(W,H)*.075));
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647 };
  const deco=[]; for(let k=0;k<26&&deco.length<14;k++){ const x=rnd()*W, y=rnd()*H; if(pts.some(p=>Math.hypot(p.x-x,p.y-y)<R*2.2)) continue; deco.push({x,y,t:rnd()}) }
  const decoSVG=deco.map(({x,y,t})=>t<.45?`<g transform="translate(${x} ${y})"><rect x="-3" y="0" width="6" height="16" fill="#9B6A45"/><circle cx="0" cy="-4" r="13" fill="#7CC9A4" stroke="${INK}" stroke-width="2"/></g>`:t<.8?`<g transform="translate(${x} ${y})"><circle r="4" fill="${t<.6?'#E8607E':'#FCB515'}"/><circle r="1.6" fill="#fff"/></g>`:`<g transform="translate(${x} ${y})"><ellipse rx="14" ry="8" fill="#9ED8F0" opacity=".9"/></g>`).join('');
  const done=S.done||{}, cur=Math.min(S.lesson,LEVELS-1);

  $('#dvFast').onclick=()=>{ DEV.fast=!DEV.fast; saveDev(); applyDev(); $('#dvFast').textContent=DEV.fast?'Tốc độ ×3':'Tốc độ ×1' };
  $('#dvAuto').onclick=()=>{ DEV.auto=!DEV.auto; saveDev(); applyDev(); $('#dvAuto').textContent=DEV.auto?'Tự trả lời: bật':'Tự trả lời: tắt' };
  $('#dvStop').onclick=()=>stopSession();
}
function seedPlayed(){ // so the Mix has something to mix in a fresh sandbox
  ['L2.W.FEEL.01','L2.M.NUM.05','L2.M.SHAPE.02','L2.M.POS.01','L2.E.PH.02'].forEach((id,i)=>{ if(!S.attempts.some(a=>a.s===id)) S.attempts.push({s:id,ok:i%2===0,rt:900,d:today(),lang:S.lang}) });
}
function renderDev(){
  root.className='sheet';
  const path=[...new Set(LESSONS.flatMap(l=>l.items))].map(id=>SK[id]);
  const others=SKILLS.filter(s=>!path.includes(s)&&s.kind!=='off');
  const fmtsOf=sk=>FMTS[sk.game]||['—'];
  const row=sk=>`<div class="devrow"><div><b>${esc(sk.vi)}</b> <code>${sk.id.replace('L2.','')}</code></div><div class="row">${fmtsOf(sk).map(f=>`<button class="btn ghost sm" data-act="${sk.id}" data-fmt="${f}">${f==='—'?'Chơi':f}</button>`).join('')}</div></div>`;
  root.innerHTML=`<div class="wrap">
   <div class="row" style="justify-content:space-between"><div><div class="eyebrow">Chế độ dev · không lưu tiến độ khi bật "hộp cát"</div><h1>Thử nhanh mọi hoạt động</h1></div><button class="btn sun" id="dvHome">Về màn hình bé</button></div>
   <div class="panel hl"><h2>Xem toàn bộ từ đầu</h2>
     <p class="note"><b>Cả lộ trình liên tục:</b> chạy như một bé hoàn toàn mới (thành phố trống, chưa nghe giới thiệu chủ đề), lần lượt Khởi động → Bài 1 → … → Bài 6, mỗi màn đủ: chào, câu chuyện, khám phá, 2 hoạt động, lượt Trộn, việc tối, chọn quà cho thành phố. Giữa hai bài có nút "Bài tiếp theo". Xong thì trả lại dữ liệu cũ.</p>
     <div class="row"><button class="btn" id="tourAll">▶ Xem cả lộ trình từ đầu</button></div>
     <p class="note"><b>Như bé mới cài app:</b> xoá dữ liệu trên máy này và mở màn hình cài đặt đầu tiên. Cũng có thể mở thẳng bằng cách thêm <code>#new</code> vào cuối đường link.</p>
     <div class="row"><button class="btn warn" id="freshStart">Bắt đầu lại như bé mới</button></div><div class="err" id="freshMsg"></div></div>
   <div class="panel"><h2>Tuỳ chọn</h2>
     <label class="switch"><input type="checkbox" id="o_rounds" ${DEV.rounds===1?'checked':''}> Chỉ 1 lượt của bé (sau lượt Chồi làm mẫu)</label>
     <label class="switch"><input type="checkbox" id="o_fast" ${DEV.fast?'checked':''}> Tốc độ ×3 (nói nhanh, nghỉ ngắn)</label>
     <label class="switch"><input type="checkbox" id="o_mute" ${DEV.mute?'checked':''}> Tắt giọng đọc, chỉ hiện phụ đề (nhanh nhất)</label>
     <label class="switch"><input type="checkbox" id="o_auto" ${DEV.auto?'checked':''}> Tự trả lời đúng (chỉ xem luồng)</label>
     <label class="switch"><input type="checkbox" id="o_sand" ${DEV.sandbox?'checked':''}> Hộp cát: chơi xong trả lại tiến độ như cũ</label>
     <div class="row"><button class="btn ghost sm" data-lang="en">${S.lang==='en'?'✓ ':''}English</button><button class="btn ghost sm" data-lang="vi">${S.lang==='vi'?'✓ ':''}Tiếng Việt</button></div></div>
   <div class="panel"><h2>Cả buổi theo bài</h2><div class="row">${LESSONS.map((L,i)=>`<button class="btn ghost sm" data-lesson="${i}">${i===0?'Khởi động':'Bài '+i}</button>`).join('')}<button class="btn ghost sm" data-lesson="${LESSONS.length}">Ôn tập</button></div></div>
   <div class="panel"><h2>Từng hoạt động (theo lộ trình)</h2>${path.map(row).join('')}</div>
   <div class="panel"><h2>Ôn từ lớp Mầm và hoạt động khác</h2>${others.map(row).join('')}</div>
   <div class="panel"><h2>Các phần khác của buổi</h2><div class="row">
     <button class="btn ghost sm" data-x="greet">Chào</button><button class="btn ghost sm" data-x="intro">Giới thiệu chủ đề</button><button class="btn ghost sm" data-x="mix">Trộn</button>
     ${Object.keys(MISSIONS).map(id=>`<button class="btn ghost sm" data-job="${id}">Việc tối: ${esc(MISSIONS[id].short)}</button>`).join('')}
     ${Object.keys(STORIES).map(k=>`<button class="btn ghost sm" data-story="${k}">Truyện: ${k}</button>`).join('')}
     <button class="btn ghost sm" data-x="city">Thành phố: nhận 1 quà</button><button class="btn ghost sm" data-x="city5">Thành phố: nhận 5 quà liền (xem mở khu mới)</button><button class="btn ghost sm" data-x="limit">Nhắc 20 phút</button>
     <button class="btn ghost sm" data-x="sticker">Kết thúc: hình dán</button><button class="btn ghost sm" data-x="highFive">Kết thúc: đập tay</button><button class="btn ghost sm" data-x="breathing">Kết thúc: thở</button><button class="btn ghost sm" data-x="bye">Tạm biệt</button></div></div>
  </div>`;
  const opt=(id,fn)=>$(id).onchange=e=>{ fn(e.target.checked); saveDev() };
  opt('#o_rounds',v=>DEV.rounds=v?1:3); opt('#o_fast',v=>DEV.fast=v); opt('#o_mute',v=>DEV.mute=v); opt('#o_auto',v=>DEV.auto=v); opt('#o_sand',v=>DEV.sandbox=v);
  $('#dvHome').onclick=renderHome;
  $('#tourAll').onclick=()=>devRun(async()=>{
    const keep={child:S.child,lang:S.lang,consentMic:S.consentMic,music:S.music}; S=Object.assign(fresh(),keep);
    for(let i=0;i<LESSONS.length;i++){
      const sess={d:today(),start:Date.now(),skills:[]}; S.sessions.push(sess);
      await sessionFlow(sess,i); await afterLevel(sess); sess.done=true; sess.end=Date.now(); save();
      if(i<LESSONS.length-1){ const c=card(); const nxt=LESSONS[i+1].items.map(id=>esc(SK[id].vi)).join(' · ');
        c.append(el(`<div class="tourcard fade"><div class="eyebrow">Hết ${i===0?'Khởi động':'Bài '+i}</div><h2>Tiếp: Bài ${i+1}</h2><p class="note">${nxt}</p><button class="btn" id="tourNext">Bài tiếp theo ▶</button></div>`));
        setCaption('Bấm "Bài tiếp theo" để xem buổi sau.','Dành cho người thử nghiệm'); const btn=$('#tourNext'); btn.dataset.ok='1';
        await Promise.race([tapOnce([btn],{nudge:false}),new Promise(r=>setTimeout(r,AUTO?1500:600000))]); S.dayOffset++; RUN.start=Date.now() }
    }
    const c=card(); c.append(el(`<div class="tourcard fade"><h2>Hết lộ trình Chủ đề 1</h2><p class="note">Các buổi sau sẽ là ôn tập những nội dung bé chưa vững.</p></div>`)); await sleep(2500);
  });
  let armedF=false; $('#freshStart').onclick=async()=>{ if(!armedF){ armedF=true; $('#freshMsg').textContent='Bấm lần nữa để xoá tiến độ, thành phố và ghi âm trên máy này.'; return } try{localStorage.removeItem(KEY)}catch(e){} await clearClips(); S=fresh(); renderSetup() };
  root.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ S.lang=b.dataset.lang; save(); renderDev() });
  root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ const sk=SK[b.dataset.act]; DEV.fmt=b.dataset.fmt==='—'?null:b.dataset.fmt;
    devRun(async()=>{ ptip(sk); await gameCard(sk.game); await GAMES[sk.game](sk,ROUNDS); confetti(); await sleep(800) }) });
  root.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>devRun(async()=>{ const li=+b.dataset.lesson; S.lesson=Math.max(S.lesson,li); if(li>0) S.introSeen[CHAPTER.id]=true; else S.introSeen={};
    const sess={d:today(),start:Date.now(),skills:[]}; S.sessions.push(sess); await sessionFlow(sess,li); await afterLevel(sess) }));
  root.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>devRun(()=>giveMission(SK[b.dataset.job])));
  root.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>devRun(async()=>{ const st=STORIES[b.dataset.story]; RUN.story=st; if(st.act) await explore(st,true); else { await storyIntro(st); await explore(st) } await say(...st.outro) }));
  const X={city:cityGift,city5:async()=>{ for(let i=0;i<5;i++) await cityGift() },limit:async()=>{ await limitOverlay(true) },greet,intro:chapterIntro,mix:async()=>{ seedPlayed(); await mixActivity() },sticker,highFive,breathing,bye:goodbye};
  root.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>devRun(X[b.dataset.x]));
}

/* ---------------- boot ---------------- */
window.__choi={get state(){return S},SKILLS,status,planSession,
  demo(id){ RUN={aborted:false,start:Date.now()}; renderPlay(); const sk=SK[id]; ptip(sk); return GAMES[sk.game](sk,ROUNDS).catch(e=>{ if(e!==ABORT) console.error(e) }) },
  mission(id){ RUN={aborted:false,start:Date.now()}; renderPlay(); return giveMission(SK[id]).catch(()=>{}) }};
document.documentElement.classList.toggle('tv',!!S.tv);
if(!FAST&&HASH!=='dev') setTimeout(()=>voiceInit(S.lang==='vi'?'vi':'en'),200);   // load the recorded voice early
document.body.append(el(`<div class="rotate" aria-live="polite"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"><rect x="22" y="6" width="20" height="34" rx="4"/><rect x="8" y="38" width="40" height="20" rx="4" opacity=".6"/><path d="M50 20 a14 14 0 0 1 2 22 l4-1 M52 42 l-1-5" stroke-linecap="round"/></svg><b>Xoay ngang điện thoại</b><span>Chế độ TV chơi theo chiều ngang. Ba mẹ có thể tắt chế độ TV bằng cách nhấn giữ nút TV ở bản đồ.</span></div>`));
if(HASH==='new'){ try{localStorage.removeItem(KEY)}catch(e){} clearClips(); S=fresh(); renderSetup() } else if(HASH==='dev'){ if(!S.child){ S.child={name:'Bin',birthYear:new Date().getFullYear()-5}; save() } renderDev() } else if(!S.child) renderSetup(); else renderHome();
</script>

</body>
