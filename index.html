<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chồi Ơi">
<meta name="theme-color" content="#F3F8F5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>html,body{margin:0;height:100%}</style>
</head>
<body>
<title>Chồi Ơi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: kid screens = illustrated meadow backdrop, one white activity card, Chồi + subtitle dock at the bottom.
   Parent screens = scrollable sheet. Fun Academy brand (same as the math app): green, yellow, deep purple, Nunito.
   Deliberately one light look for both themes. */
:root{
  --bg:#F3F8F5; --card:#FFFFFF; --ink:#361D46; --muted:#6A5877; --line:#D3E3DB; --soft:#E6F2EC;
  --green:#58B592; --green-ink:#2A8060; --green-lt:#A9DEC6; --yellow:#FCB515; --yellow-dk:#C98A00;
  --berry:#E8607E; --sky:#DDF1F8; --blue:#4A9BDB; --skin:#FFE0C2; --face:#FFD45E; --face-dk:#E0A92E;
  --font:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#root{height:100%}

/* ---------- meadow backdrop ---------- */
.kid{position:relative;height:100%;overflow:hidden}
.scene{position:absolute;inset:0;background:linear-gradient(180deg,#D8EEF7 0%,#E9F6F1 58%,#F3F8F5 100%);z-index:0}
.scene .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:32%}
.cloud{position:absolute;width:120px;opacity:.95;animation:drift linear infinite}
.cloud.c1{top:7%;left:-20%;animation-duration:70s}
.cloud.c2{top:16%;left:-30%;width:84px;animation-duration:95s;animation-delay:-40s}
.cloud.c3{top:4%;left:-25%;width:70px;animation-duration:120s;animation-delay:-80s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(140vw)}}
.wrap-kid{position:relative;z-index:1;height:100%;max-width:calc(640px*var(--k,1));margin:0 auto;padding-inline:16px;display:flex;flex-direction:column}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}

/* ---------- top bar + turn badge ---------- */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:10px 4px;min-height:56px}
.moon-btn{justify-self:start;border:0;background:var(--card);border-radius:999px;padding:8px 14px;display:flex;gap:6px;align-items:center;box-shadow:0 3px 0 var(--line);font-weight:800;font-size:14px}
.moon-btn svg{width:18px;height:18px}
.turns{display:flex;gap:10px;align-items:center}
.tb{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;opacity:.35;transform:scale(.88);transition:all .35s;box-shadow:0 0 0 3px transparent}
.tb svg{width:38px;height:38px}
.tb.on{opacity:1;transform:scale(1.12);box-shadow:0 0 0 4px var(--yellow)}
.turns.idle .tb{opacity:0}
.gate{justify-self:end;position:relative;width:40px;height:40px;border:0;background:transparent;border-radius:50%;opacity:.35;display:grid;place-items:center;touch-action:none}
.gate svg{width:24px;height:24px}
.gate .ring{position:absolute;inset:0;width:40px;height:40px}
.gate .ring circle{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:120;stroke-dashoffset:120;transform:rotate(-90deg);transform-origin:center}
.gate.holding{opacity:1}
.gate.holding .ring circle{transition:stroke-dashoffset 1s linear;stroke-dashoffset:0}

/* ---------- activity card ---------- */
.ptip{font-size:12px;color:var(--muted);text-align:center;min-height:16px;padding:0 8px 6px;line-height:1.35}
.ptip b{font-weight:800;color:var(--ink)}
#card{flex:1;min-height:0;container-type:size;background:var(--card);border:2px solid var(--line);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(54,29,70,.07)}
.dock{display:flex;align-items:flex-end;gap:10px;padding-block:8px 14px}
.dock .mascot{width:86px;flex:none}
.caption{flex:1;min-width:0;background:var(--card);border-radius:20px 20px 20px 6px;padding:10px 14px;min-height:56px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px}
.caption .en{font-weight:900;font-size:18px;line-height:1.25;color:var(--ink)}
.askagain{flex:none;align-self:center;width:52px;height:52px;border-radius:50%;border:0;background:var(--card);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;color:var(--ink);padding:0}
.askagain svg{width:28px;height:28px}
.askagain.beat{animation:pop .4s}
#dockChoi{cursor:pointer}
.caption .vi{font-size:12.5px;line-height:1.35;color:var(--muted);font-weight:600}

/* ---------- mascot ---------- */
.mascot svg{width:100%;height:auto;display:block;overflow:visible}
.mascot .eyes-closed,.mascot .mouth-talk,.mascot .mouth-big,.mascot .zzz{display:none}
.mascot[data-mood="talk"] .mouth-smile{display:none}
.mascot[data-mood="talk"] .mouth-talk{display:block;animation:talk .26s ease-in-out infinite alternate;transform-origin:60px 103px}
.mascot[data-mood="happy"] .mouth-smile{display:none}
.mascot[data-mood="happy"] .mouth-big{display:block}
.mascot[data-mood="happy"] .body{animation:hop .5s ease 2}
.mascot[data-mood="sleep"] .eyes-open{display:none}
.mascot[data-mood="sleep"] .eyes-closed,.mascot[data-mood="sleep"] .zzz{display:block}
.mascot[data-mood="sleep"] .body{animation:breathe 3.2s ease-in-out infinite}
.mascot[data-wave="1"] .armR{animation:wave .45s ease-in-out 4 alternate}
.mascot .eyes-open{animation:blink 4.5s infinite;transform-origin:60px 82px}
.mascot .leaves{transform-origin:60px 42px;animation:sway 3s ease-in-out infinite alternate}
.mascot .armR{transform-origin:100px 100px}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes hop{50%{transform:translateY(-12px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes breathe{50%{transform:scale(1.03)}}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(-35deg)}}

/* ---------- home ---------- */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding-bottom:6vh}
.home .mascot{width:min(54vw,calc(220px*var(--k,1)))}
.home .logo{height:22px;width:auto;opacity:.9}
.play{width:128px;height:128px;border-radius:50%;border:0;background:var(--yellow);box-shadow:0 8px 0 var(--yellow-dk);display:grid;place-items:center;animation:pulse 1.8s ease-in-out infinite}
.play svg{width:54px;height:54px;margin-left:10px}
.play:active{transform:translateY(6px);box-shadow:0 2px 0 var(--yellow-dk)}
.hear svg{width:100%;height:100%}
.hear.small{width:84px;height:76px;border-radius:22px;padding:8px}
.hear{border:0;background:var(--card);border-radius:28px;width:120px;height:110px;box-shadow:0 6px 0 var(--line);padding:10px}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ---------- options & pieces ---------- */
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.opt{width:clamp(84px,24vw,calc(136px*var(--k,1)));aspect-ratio:1;border-radius:24px;background:var(--card);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);display:grid;place-items:center;padding:8px;transition:transform .12s,opacity .45s,translate .45s}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.opt svg{width:100%;height:100%}
.opt.wide{width:clamp(124px,40vw,calc(190px*var(--k,1)));width:min(45cqw,190px,calc((100cqh - 100px) / 2 * 1.2));aspect-ratio:6/5;padding:6px}
.opt.sky3{width:clamp(84px,26vw,calc(130px*var(--k,1)));width:min(29cqw,calc(130px*var(--k,1)));aspect-ratio:6/5;padding:5px}
.pre{opacity:0;translate:0 12px;pointer-events:none}
.opt.right{border-color:var(--green);background:#EFFAF4;animation:pop .45s}
.opt.nope{animation:shake .35s}
.opt.hint{border-color:var(--yellow);animation:wiggle .8s ease-in-out 3}
.num{font-weight:900;font-size:clamp(54px,15vw,calc(80px*var(--k,1)));line-height:1;color:var(--ink)}
@keyframes pop{50%{transform:scale(1.1)}}
@keyframes nudgeW{25%{rotate:-8deg;scale:1.1}75%{rotate:8deg;scale:1.1}}
.nudge{animation:nudgeW .5s 2 ease-in-out!important}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes wiggle{25%{transform:rotate(-5deg) scale(1.05)}75%{transform:rotate(5deg) scale(1.05)}}
.ear{border:0;background:var(--ink);color:#fff;border-radius:999px;width:52px;height:52px;display:grid;place-items:center;box-shadow:0 4px 0 #1f0f2a;transition:opacity .4s}
.ear svg{width:26px;height:26px}
.fade{animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pic{width:min(46vw,calc(190px*var(--k,1)));width:min(46cqw,36cqh,calc(190px*var(--k,1)))}
.pic svg{width:100%;height:auto;display:block}

/* games */
.flashcard{width:min(62vw,calc(230px*var(--k,1)));aspect-ratio:1;border-radius:26px;background:var(--soft);position:relative;overflow:hidden}
.flashcard .dot{position:absolute;width:23%;aspect-ratio:1;border-radius:50%;background:var(--green);border:4px solid var(--green-ink);transform:translate(-50%,-50%)}
.flashcard .cover{position:absolute;inset:0;z-index:2;background:var(--ink);display:grid;place-items:center;color:var(--yellow);font-size:70px;font-weight:900;transition:opacity .3s}
.field{position:relative;width:100%;max-width:calc(380px*var(--k,1));height:min(36vh,calc(250px*var(--k,1)));border-radius:24px;background:var(--soft)}
.thing{position:absolute;border:0;background:transparent;width:64px;height:64px;transform:translate(-50%,-50%);padding:0}
.thing svg{width:100%;height:100%}
.thing.done svg{opacity:.45}
.thing .tag{position:absolute;right:-6px;top:-8px;background:var(--green);color:#fff;font-weight:900;font-size:18px;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;animation:pop .3s}
.sky{width:100%;height:100%;border-radius:18px;overflow:hidden;display:block}
.sortzone{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:110px;width:100%;max-width:calc(400px*var(--k,1));align-items:center}
.item{width:62px;height:62px;display:grid;place-items:center;touch-action:none;cursor:grab;position:relative;z-index:2}
.item svg{width:100%;height:100%;pointer-events:none}
.item.dragging{z-index:20}
.item.back{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.baskets{display:flex;gap:16px;justify-content:center;width:100%;max-width:calc(400px*var(--k,1))}
.basket{flex:1;min-height:120px;border-radius:20px 20px 44px 44px;background:var(--soft);border:5px solid var(--line);display:flex;flex-wrap:wrap;gap:2px;align-content:flex-end;justify-content:center;padding:10px;position:relative}
.basket .item{width:40px;height:40px;cursor:default}
.basket .lbl{position:absolute;inset:8px auto auto 50%;transform:translateX(-50%);opacity:.3;width:44px}
.basket.glow{animation:wiggle .7s ease-in-out 2}
.clapbtn{width:140px;height:140px;border-radius:50%;border:0;background:var(--yellow);box-shadow:0 8px 0 var(--yellow-dk);padding:22px}
.clapbtn svg{width:100%;height:100%}
.clapbtn.beat{animation:pop .25s}
.beats{display:flex;gap:10px;min-height:24px}
.beats i{width:22px;height:22px;border-radius:50%;background:var(--berry);display:block;animation:pop .25s}
canvas.trace{width:100%;max-width:calc(380px*var(--k,1));height:min(42vh,calc(300px*var(--k,1)));background:var(--soft);border-radius:24px;touch-action:none;display:block}
.mic{width:110px;height:110px;border-radius:50%;border:0;background:var(--berry);display:grid;place-items:center;box-shadow:0 0 0 calc(var(--lvl,0)*40px) rgba(232,96,126,.22),0 6px 0 #B8405C;transition:box-shadow .08s,opacity .4s}
.mic svg{width:48px;height:48px}
.mic.idle{background:var(--line);box-shadow:0 6px 0 #BFD3C9}
.mic.ready{animation:micPulse 1.1s ease-in-out infinite}
@keyframes micPulse{50%{transform:scale(1.12)}}
.mic.rec{background:#E8584F}
.words{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-weight:900;font-size:28px;color:var(--line)}
.words span{transition:color .25s}
.words span.on{color:var(--ink)}
.countrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:calc(380px*var(--k,1))}
.countrow b{width:46px;height:46px;border-radius:50%;background:var(--soft);color:var(--muted);display:grid;place-items:center;font-size:22px;font-weight:900;transition:background .25s,color .25s}
.countrow b.on{background:var(--green);color:#fff}
.breath{display:flex;gap:24px;align-items:flex-end;justify-content:center}
.breath .flower,.breath .candle{width:min(32vw,calc(130px*var(--k,1)));transition:transform 3s ease-in-out}
.breath .flower.in{transform:scale(1.22)}
.breath .flame{transform-origin:50% 100%;transition:transform 3s ease-in-out,opacity 3s}
.breath .candle.out .flame{transform:scale(.15);opacity:.2}
.introfaces{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.introfaces div{width:min(19vw,calc(88px*var(--k,1)));transition:transform .35s,opacity .35s;opacity:.35}
.introfaces div.on{transform:scale(1.25);opacity:1}
.hand{position:absolute;left:0;top:0;width:58px;opacity:0;transition:opacity .3s;filter:drop-shadow(0 3px 4px rgba(54,29,70,.25))}
.hand svg{width:100%;height:auto;display:block}
.ripple{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:4px solid var(--yellow);animation:ripple .6s ease-out forwards}
@keyframes ripple{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}

/* title card between activities */
.gamecard{display:flex;flex-direction:column;align-items:center;gap:14px}
.badge{width:min(50cqw,40cqh,calc(200px*var(--k,1)));aspect-ratio:1;border-radius:50%;background:var(--soft);border:5px solid var(--green);display:grid;place-items:center;padding:15%;animation:badgeIn .75s cubic-bezier(.3,1.5,.5,1) both}
.badge svg{width:100%;height:100%;overflow:visible}
@keyframes badgeIn{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
#card.out>*{animation:cardOut .38s ease forwards}
@keyframes cardOut{to{opacity:0;transform:translateX(-46px)}}
.confetti{position:absolute;width:10px;height:14px;border-radius:3px;top:-20px;animation:conf 1.6s ease-in forwards}
@keyframes conf{to{transform:translateY(120cqh) rotate(540deg)}}
/* counting: each object kind arrives its own way */
.field{overflow:hidden}
.thing{animation-fill-mode:both}
.thing.e-rise{animation:eRise 1s cubic-bezier(.2,.9,.3,1.15) both}
.thing.e-drop{animation:eDrop .85s cubic-bezier(.3,1.4,.5,1) both}
.thing.e-pop{animation:ePop .6s cubic-bezier(.3,1.7,.5,1) both}
.thing.e-roll{animation:eRoll 1s cubic-bezier(.2,.8,.3,1) both}
.thing.e-swim{animation:eSwim 1.1s cubic-bezier(.2,.8,.3,1) both}
.thing.e-hop{animation:eHop .75s ease-out both}
.thing.e-twinkle{animation:eTw .9s ease both}
.thing.e-flutter{animation:eFl 1.3s ease-out both}
.thing.jump{animation:eJump .45s ease both}
@keyframes eRise{from{transform:translate(-50%,260px);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
@keyframes eDrop{from{transform:translate(-50%,-260px);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
@keyframes ePop{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
@keyframes eRoll{from{transform:translate(-420px,-50%) rotate(-540deg)}to{transform:translate(-50%,-50%) rotate(0)}}
@keyframes eSwim{from{transform:translate(340px,-50%);opacity:0}60%{transform:translate(-80%,-60%)}to{transform:translate(-50%,-50%);opacity:1}}
@keyframes eHop{0%{transform:translate(-50%,80px);opacity:0}60%{transform:translate(-50%,-95%);opacity:1}100%{transform:translate(-50%,-50%)}}
@keyframes eTw{from{transform:translate(-50%,-50%) scale(0) rotate(-200deg);opacity:0}to{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}}
@keyframes eFl{0%{transform:translate(-50%,-50%) translate(-180px,-140px) rotate(-25deg);opacity:0}40%{transform:translate(-50%,-50%) translate(-40px,-70px) rotate(20deg);opacity:1}70%{transform:translate(-50%,-50%) translate(20px,-20px) rotate(-12deg)}100%{transform:translate(-50%,-50%)}}
@keyframes eJump{50%{transform:translate(-50%,-80%) scale(1.12)}100%{transform:translate(-50%,-50%)}}
/* count-along shelf */
.bignum{font-weight:900;font-size:clamp(56px,20cqw,calc(104px*var(--k,1)));line-height:1;color:var(--green-ink);min-height:1em;display:block}
.bignum.bump{animation:pop .35s}
.shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:calc(340px*var(--k,1));background:var(--soft);border-radius:20px;padding:10px}
.slot{aspect-ratio:1;display:grid;place-items:center;position:relative}
.slot svg{width:92%;height:92%}
.slot .o{opacity:0;width:100%;height:100%;display:grid;place-items:center}
.slot .o.show{opacity:1;animation:sPop .5s cubic-bezier(.3,1.7,.5,1) both}
.slot .o.show.e-rise,.slot .o.show.e-hop{animation:sRise .55s cubic-bezier(.3,1.5,.5,1) both}
.slot .o.show.e-drop{animation:sDrop .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes sPop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes sRise{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
@keyframes sDrop{from{transform:translateY(-50px);opacity:0}to{transform:none;opacity:1}}
/* clean setup */
.setup{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:calc(420px*var(--k,1));margin:0 auto;padding-inline:16px;padding-block:24px}
.setup .mascot{width:120px;align-self:center}
.setup .logo{align-self:center;height:22px}
.linkbtn{border:0;background:none;color:var(--green-ink);font-weight:800;font-size:14px;padding:8px;align-self:center;text-decoration:underline;text-underline-offset:3px}
.langs{justify-self:center;display:flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 3px 0 var(--line)}
.langs button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:900;font-size:14px;color:var(--muted)}
.langs button.on{background:var(--green);color:var(--ink)}
.lessons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.lessons li{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14px;line-height:1.45}
.lessons li.done{opacity:.55}
.lessons li.cur{background:#FFF3D0;box-shadow:inset 4px 0 0 var(--yellow)}
.flashcard.plain{background:none;border-radius:0}
.flashcard.plain svg{width:100%;height:100%;display:block}
.flashcard.plain .cover{border-radius:24px}
.sky-field{position:relative;width:100%;max-width:calc(380px*var(--k,1));height:min(44cqh,calc(290px*var(--k,1)))}
.floaty{position:absolute;bottom:4%;width:100px;height:122px;margin-left:-50px;border:0;background:none;padding:0;animation:floaty 4.6s ease-in-out infinite alternate;transition:opacity .45s}
.floaty:nth-child(2){animation-duration:5.4s}.floaty:nth-child(3){animation-duration:4s}.floaty:nth-child(4){animation-duration:5.9s}
.floaty svg{width:100%;height:100%}
.floaty .bn{position:absolute;left:0;right:0;top:22%;text-align:center;font-weight:900;font-size:36px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.floaty.bubble{width:96px;height:96px;margin-left:-48px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#DDF1F8 60%,#BFE3F7);border:3px solid #9ED3EE;padding:12px}
.floaty.popped{animation:popout .35s forwards}
@keyframes floaty{0%{translate:0 0}35%{translate:14px calc(-0.45 * min(44cqh,290px))}70%{translate:-12px calc(-0.25 * min(44cqh,290px))}100%{translate:6px calc(-0.62 * min(44cqh,290px))}}
@keyframes popout{to{transform:scale(1.6);opacity:0}}
.floaty.nope{animation:shake .35s}

/* ---------- landscape screens (laptop, iPad on its side, TV): the play area runs almost the full width;
   a small Chồi sits on the left, the subtitles run under the play area ---------- */
@media (min-aspect-ratio:5/4) and (min-width:640px){
  .wrap-kid:not(.map){max-width:none;display:grid;grid-template-columns:clamp(70px,9vw,120px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
    grid-template-areas:"top top" "choi card" "choi pads" "ear cap";column-gap:12px;padding-bottom:10px}
  .wrap-kid:not(.map) .topbar{grid-area:top;padding-block:6px 4px;min-height:48px}
  .wrap-kid:not(.map) .ptip{display:none}
  .wrap-kid:not(.map) #card{grid-area:card}
  .wrap-kid:not(.map) .tvpads{grid-area:pads}
  .wrap-kid:not(.map) .dock{display:contents}
  .wrap-kid:not(.map) .dock .mascot{grid-area:choi;width:100%;align-self:end;margin-bottom:6px}
  .wrap-kid:not(.map) .dock .caption{grid-area:cap;margin-top:8px;min-height:calc(clamp(17px,2.2vw,24px)*1.25 + clamp(12px,1.3vw,15px)*1.35 + 18px);padding:8px 16px;border-radius:16px;flex-direction:row;align-items:baseline;align-content:center;gap:2px 14px;flex-wrap:wrap}
  .wrap-kid:not(.map) .dock .caption .en{font-size:clamp(17px,2.2vw,calc(24px*var(--k,1)))}
  .wrap-kid:not(.map) .dock .caption .vi{font-size:clamp(12px,1.3vw,calc(15px*var(--k,1)))}
  .wrap-kid:not(.map) .askagain{grid-area:ear;justify-self:center;align-self:end;width:clamp(44px,5vw,calc(60px*var(--k,1)));height:clamp(44px,5vw,calc(60px*var(--k,1)))}
  .wrap-kid:not(.map) .devbar{grid-column:1/-1}
}
/* short landscape screens (a phone on its side, in the browser): no top bar, the card gets almost the whole height */
@media (min-aspect-ratio:5/4) and (min-width:640px) and (max-height:520px){
  .wrap-kid:not(.map){grid-template-columns:clamp(62px,10vw,92px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"stop card" "choi card" "choi pads" "ear cap";column-gap:10px;
    padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom));padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}

  .wrap-kid:not(.map) .dock .mascot{align-self:center}
  .wrap-kid:not(.map) .dock .caption{margin-top:5px;padding:5px 14px;gap:1px 10px;min-height:calc(clamp(15px,2vw,19px)*1.25 + 12px*1.35 + 11px)}

  .wrap-kid:not(.map) .askagain{width:42px;height:42px}
  .wrap-kid:not(.map) #card{border-radius:20px;padding:10px;gap:10px}
  /* things that stack up too tall in a short card */
  #card .speaker{width:min(34cqw,48cqh,160px)}

  #card:has(>.fscene.withq){flex-direction:row}

  #card:has(>.fscene.withq)>.opts{width:auto;flex-direction:column;flex-wrap:nowrap}
  #card:has(>.fscene.withq) .opt{width:min(28cqh,96px)}
}

  .rotate svg{width:96px;height:96px;animation:wiggle 1.6s ease-in-out infinite} .rotate b{font-size:22px} .rotate span{max-width:32ch;opacity:.85;font-size:15px;line-height:1.5} }
/* ---------- the map ---------- */
.wrap-kid.map,.wrap-kid.wide{max-width:1100px}
.zoomout{position:absolute;right:12px;bottom:12px;z-index:4;width:52px;height:52px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
.zoomout svg{width:30px;height:30px}
.pathmap{flex:1;min-height:0;position:relative}
.mapbg{position:absolute;left:0;top:0;z-index:1}
.kid .wrap-kid.map{z-index:2}
.node{position:absolute;translate:-50% -50%;border-radius:50%;border:0;padding:0;background:#fff;box-shadow:0 5px 0 #CDB57C,0 0 0 4px #fff,0 0 0 7px #58B592;display:grid;place-items:center;transition:transform .2s}
.node .ico{width:66%;height:66%;display:grid;place-items:center}
.node .ico svg{width:100%;height:100%}
.node .num{position:absolute;right:-6px;top:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px;font-weight:900;display:grid;place-items:center;padding:0 5px}
.node .stars{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.node .stars i{width:16px;height:16px;background:#FCB515;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.node.cur{box-shadow:0 5px 0 #C98A00,0 0 0 5px #fff,0 0 0 10px #FCB515;animation:pulse 1.6s ease-in-out infinite}
.node.cur:hover,.node.open:hover{transform:scale(1.07)}
.node.locked{background:#EEF2F0;box-shadow:0 4px 0 #CFD8D3,0 0 0 4px #fff,0 0 0 6px #C9D6CF}
.node.locked .ico{filter:grayscale(1);opacity:.45}
.node.locked .num{background:#9AA7A0}
.node .lock{position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-30%)}
.node .lock svg{width:100%;height:100%}
.node.go{animation:nodeGo .3s ease}
.node.nope{animation:shake .35s}
.node.nudge{animation:pop .5s 2}
.node.opening{animation:nodeOpen .9s ease .3s}
@keyframes nodeGo{50%{transform:scale(.88)}}
@keyframes nodeOpen{40%{transform:scale(1.25)}}
.mapchoi{position:absolute;translate:-50% -100%;pointer-events:none;transition:left .9s cubic-bezier(.45,0,.2,1),top .9s cubic-bezier(.45,0,.2,1);z-index:2}
.mapchoi.nojump{transition:none}
.mapchoi.hopping .mascot{animation:mapHop .45s ease-in-out 2}
@keyframes mapHop{50%{transform:translateY(-26px)}}
.maphand{position:absolute;width:52px;translate:-20% 0;pointer-events:none;animation:handTap 1.2s ease-in-out infinite;z-index:3}
.maphand svg{width:100%;height:auto}
@keyframes handTap{50%{transform:translateY(-14px)}}
.mapdock{display:flex;align-items:flex-end;gap:10px;padding-block:6px 14px}
.citybtn{flex:none;width:96px;height:96px;border:0;padding:0;border-radius:26px;background:none;box-shadow:0 6px 0 #CDB57C,0 0 0 5px #fff;position:relative;animation:pulse 2.4s ease-in-out infinite}
.citybtn>svg{width:100%;height:100%;display:block;border-radius:24px}
.citybtn .owed{position:absolute;left:-12px;top:-14px;width:44px;height:44px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 3px 8px rgba(54,29,70,.25);animation:pulse 1s infinite}
.citybtn .owed svg{width:100%;height:100%}
.citybtn:has(.owed){animation:pulse 1.4s infinite}
.citybtn .cnt{position:absolute;right:-8px;top:-8px;min-width:30px;height:30px;padding:0 7px;border-radius:15px;background:var(--berry);color:#fff;font-weight:900;font-size:16px;display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
.citymini>svg{width:100%;height:auto;display:block}
.citymini{border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.mapdock .caption{align-self:center}
.mapdock .hear.small{margin-left:auto;flex:none}
/* ---------- play-time reminder ---------- */
.modal.limit{z-index:60;background:rgba(54,29,70,.6)}
.limitbox{background:var(--card);border-radius:24px;padding:20px;width:min(100%,calc(420px*var(--k,1)));display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-height:96vh;overflow:auto}
.limitkid{display:flex;align-items:flex-end;gap:12px;cursor:pointer}
.limitkid .mascot{width:110px}
.limitbox .clock{position:relative;width:86px}
.limitbox .clock svg{width:100%;height:auto}
.limitbox .clock b{position:absolute;right:-8px;bottom:-4px;background:var(--yellow);border-radius:999px;padding:2px 9px;font-weight:900;font-size:18px}
.limitbox h2{font-size:24px;font-weight:900;margin:6px 0 0}
.limitbox .big{font-size:19px;font-weight:800;margin:0;color:var(--berry)}
.limitpar{width:100%;border-top:2px dashed var(--line);margin-top:10px;padding-top:12px;display:flex;flex-direction:column;gap:8px;text-align:left}
.limitpar label{font-size:14px;font-weight:800}
.limitpar input{font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;width:100%}
.limitpar .row{display:flex;flex-wrap:wrap;gap:8px}
.limitpar .btn{flex:1 1 auto}
.switch select{width:auto;flex:none}
.seeds .opt{opacity:1}
.panel.hl{border-color:var(--green);box-shadow:inset 4px 0 0 var(--green)}
.tourcard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px}
.tourcard h2{font-size:24px;font-weight:900;margin:0}
.microw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:15px}
.microw input{width:24px;height:24px;accent-color:var(--green)}

/* ---------- parent sheets (text allowed) ---------- */
.sheet{height:100%;overflow-y:auto;-webkit-user-select:text;user-select:text;background:var(--bg)}
.sheet .wrap{max-width:calc(640px*var(--k,1));margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
.sheet .logo{height:24px;width:auto;align-self:flex-start}
.sheet h1{font-size:28px;line-height:1.15;margin:0;text-wrap:balance;font-weight:900}
.sheet h2{font-size:19px;margin:0;font-weight:900}
.sheet p{margin:0;line-height:1.55;font-size:15px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--green-ink);font-weight:900}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field-row{display:flex;flex-direction:column;gap:6px}
.field-row label{font-size:14px;font-weight:800}
.sheet input,.sheet select{font:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.btn{border:2px solid var(--green);border-radius:12px;padding:11px 16px;font-weight:800;font-size:15px;background:var(--green);color:var(--ink);min-height:46px}
.btn.ghost{background:var(--card);border-color:var(--green-ink);color:var(--green-ink)}
.btn.warn{background:var(--berry);border-color:var(--berry);color:#fff}
.btn.sun{background:var(--yellow);border-color:var(--yellow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:13.5px;color:var(--muted);line-height:1.5}
.ok-text{color:var(--green-ink);font-weight:800}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{border-radius:14px;padding:10px 6px;text-align:center;background:var(--card);border:2px solid var(--line)}
.chip b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;font-weight:900}
.chip span{font-size:12px;color:var(--muted);font-weight:700}
.area-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.skill{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding-block:10px;border-top:1px solid var(--line)}
.skill:first-of-type{border-top:0}
.skill .t{font-weight:800;font-size:14.5px;min-width:0}
.skill .d{grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.45}
.skill .d code{font-size:11px;color:var(--muted)}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap;align-self:start}
.pill.got_it{background:#D5F0E3;color:var(--green-ink)}
.pill.practising{background:#FFEFC7;color:#8A5E00}
.pill.not_yet{background:var(--soft);color:var(--muted)}
.pill.assigned{background:#FBE0E7;color:#A93556}
.pill.spoken{background:#ECE3F3;color:var(--ink)}
.tick{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:4px;color:var(--ink)}
.tick input{width:20px;height:20px;accent-color:var(--green)}
.clip{display:flex;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.clip:first-of-type{border-top:0}
.clip .pb{width:40px;height:40px;border-radius:50%;border:0;background:var(--berry);flex:none;display:grid;place-items:center}
.clip .pb svg{width:16px;height:16px}
.clip .pb[disabled]{background:var(--line)}
.clip div{min-width:0;font-size:13px;line-height:1.4}
.clip .say{font-weight:900;font-size:16px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{width:100%;max-width:30px;background:var(--green);border-radius:6px 6px 2px 2px;display:block;min-height:2px}
.bars span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.missioncard{background:var(--ink);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.missioncard h2{color:var(--yellow)}
.missioncard p{color:#EDE4F5}
.missioncard .en{font-weight:900;color:#fff;font-size:17px}
.missioncard .eyebrow{color:#CDBEDD}
.switch{display:flex;align-items:center;gap:10px;font-weight:800}
.switch input{width:22px;height:22px;accent-color:var(--green)}
.tipmodal{z-index:80}
.tipbox{max-width:520px;max-height:90vh;overflow:auto}
.tipsteps{margin:8px 0 10px;padding-left:22px;line-height:1.55}
.tipsteps li{margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(54,29,70,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal .panel{width:min(100%,calc(360px*var(--k,1)))}
.err{color:#B8405C;font-size:13.5px;min-height:18px;font-weight:700}
@media (prefers-reduced-motion: reduce){.cloud,.play,.mascot *{animation:none!important}}

/* ================= STICKER SKIN (chosen 16/10/2026): thick plum outlines, hard shadows, yellow dotted ground ================= */
:root{--pl:#3A1B49;--stk-sun2:#FFD21F;--stk-sub:#FFE9A6}
.stk{filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(3px 4px 0 rgba(58,27,73,.9))}
.dock .mascot,.home .mascot{filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(4px 5px 0 rgba(58,27,73,.9))}
.scene{background-color:#FBB516;background-image:radial-gradient(circle,#FFD866 4px,transparent 4.5px),radial-gradient(circle,#FFD866 4px,transparent 4.5px);background-size:36px 36px;background-position:0 0,18px 18px}
.scene .hills,.scene .cloud{display:none}
#card{border:4px solid var(--pl);border-radius:30px;box-shadow:7px 9px 0 var(--pl)}
.caption{background:var(--pl);border-radius:22px;box-shadow:5px 6px 0 rgba(58,27,73,.35)}
.caption .en{color:#fff}.caption .vi{color:var(--stk-sub)}
.askagain,.moon-btn{background:#fff;border:3px solid var(--pl);box-shadow:3px 4px 0 var(--pl)}
.opt{border:4px solid var(--pl);box-shadow:5px 6px 0 var(--pl);border-radius:26px}
.opt:active{transform:translate(3px,4px);box-shadow:2px 2px 0 var(--pl)}
.opt.right{border-color:var(--pl);background:#D8F7E6}
.opt.hint{border-color:#9B6BD0}
.opt.kidhead{padding:4px}
.nextbtn{background:var(--stk-sun2);border:4px solid var(--pl);box-shadow:4px 5px 0 var(--pl)}
.nextbtn svg path{stroke:var(--pl)}
.spic,.peekfield,.fscene{box-shadow:none;border-radius:22px}
.actor b,.fs-kid b{background:#fff;border:2.5px solid var(--pl);box-shadow:2px 3px 0 var(--pl);border-radius:10px;padding:0 8px}
.play{background:var(--stk-sun2);border:5px solid var(--pl);box-shadow:6px 8px 0 var(--pl)}
.play:active{transform:translate(4px,6px);box-shadow:2px 2px 0 var(--pl)}
.ear{background:#fff;color:var(--pl);border:3px solid var(--pl);box-shadow:3px 4px 0 var(--pl)}
.tb{border:3px solid var(--pl)}
.fs-sky{background:#6CC7F2}.fs-ground{background:#3FBE7D;border-top:3px solid var(--pl)}
.fs-tired.dusk .fs-sky{background:#5D5F95}.fs-scared.go .fs-sky{background:#8C95AC}
.fs-kid{width:24%}
.polly-pop{position:absolute;right:3%;bottom:3%;width:clamp(64px,20cqh,124px);z-index:8;animation:pollyIn .5s cubic-bezier(.3,1.5,.5,1) both;pointer-events:none}
.polly-pop svg{width:100%;height:auto;display:block}
.polly-pop .pbub{position:absolute;right:72%;top:2%;background:#fff;border:3px solid var(--pl);border-radius:16px;padding:4px 12px;font-weight:900;font-size:clamp(14px,3.4cqh,24px);white-space:nowrap;box-shadow:3px 4px 0 var(--pl);color:var(--pl)}
.polly-pop.bye{animation:pollyOut .45s ease-in forwards}
.polly-pop .pwing{transform-box:fill-box;transform-origin:80% 10%;animation:flap .2s 6 alternate}
@keyframes pollyIn{from{transform:translate(60%,40%) rotate(20deg);opacity:0}}
@keyframes pollyOut{to{transform:translate(80%,-60%) rotate(-20deg);opacity:0}}
@keyframes flap{to{transform:rotate(-28deg)}}
.mapfind .mp-piece{animation:pieceIn 1s cubic-bezier(.3,1.5,.5,1) both}
.mapfind .mp-piece svg{width:100%;height:auto;display:block;animation:cbob 2s 1s ease-in-out infinite}
@keyframes pieceIn{0%{transform:translate(-50%,-50%) scale(.2) rotate(-40deg);opacity:0}100%{transform:translate(-50%,-50%)}}
@container (min-aspect-ratio:6/5){
  .spage:has(>.fscene){background:linear-gradient(#6CC7F2 72%,#3A1B49 72%,#3A1B49 calc(72% + 3px),#3FBE7D calc(72% + 3px));box-shadow:none;border-radius:22px}
  .spage:has(>.fs-tired.dusk){background:linear-gradient(#5D5F95 72%,#3A1B49 72%,#3A1B49 calc(72% + 3px),#3FBE7D calc(72% + 3px))} .spage:has(>.fs-scared.go){background:linear-gradient(#8C95AC 72%,#3A1B49 72%,#3A1B49 calc(72% + 3px),#3FBE7D calc(72% + 3px))}
}

/* ---- the level map is the old treasure map ---- */

.pathmap>svg.pathsvg{position:absolute;left:0;top:0;z-index:1}.pathmap>.node,.pathmap>.mapchoi,.pathmap>.maphand{z-index:2}
.node{background:#fff;box-shadow:4px 5px 0 var(--pl);border:4px solid var(--pl)}
.node.cur{box-shadow:4px 5px 0 var(--pl),0 0 0 6px #fff,0 0 0 11px #FFD21F;border-color:var(--pl)}
.node.locked{background:#E9DCB8;border-color:#B48A62;box-shadow:3px 4px 0 #B48A62}
.node .num{background:var(--pl);box-shadow:0 0 0 3px #fff}
.node .mpiece{position:absolute;right:-22%;bottom:-18%;width:58%;animation:pop .5s}
.node .mpiece svg{width:100%;height:auto;display:block}
.citybtn,.gamesbtn,.mapbtn,.mixbtn,.musicbtn{flex:none;width:96px;height:96px;border:4px solid var(--pl);padding:0;border-radius:26px;background:#fff;box-shadow:5px 6px 0 var(--pl);position:relative;overflow:visible}
.citybtn>svg,.gamesbtn>svg,.mixbtn>svg,.musicbtn>svg{width:100%;height:100%;display:block;border-radius:22px}
.gamesbtn .cnt,
.mixbtn .cnt{position:absolute;right:-8px;top:-8px;min-width:30px;height:30px;padding:0 7px;border-radius:15px;background:var(--berry);color:#fff;font-weight:900;font-size:16px;display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
@media (max-width:520px){ .citybtn,.gamesbtn,.mixbtn{width:78px;height:78px;border-radius:22px} }
/* ---- block-island city ---- */
.isocity{position:absolute;inset:0;background:linear-gradient(160deg,#BFE6F5 0%,#E3E9FB 55%,#FFE8D6 100%);overflow:hidden}
.isow{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.isow.panning{cursor:grabbing}
.isow .tapme{cursor:pointer}
.itop{position:absolute;right:12px;top:max(78px,calc(env(safe-area-inset-top,0px) + 70px));z-index:4}
.ibtn{width:52px;height:52px;border-radius:50%;border:3px solid var(--pl);background:#fff;box-shadow:3px 4px 0 var(--pl);display:grid;place-items:center;padding:0}
.ifoods{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;background:rgba(255,255,255,.94);border:3px solid var(--pl);border-radius:22px;padding:6px;box-shadow:4px 5px 0 var(--pl);z-index:4;flex-wrap:wrap;max-width:calc(100% - 24px)}
.ifood{width:54px;height:54px;border-radius:16px;border:3px solid var(--pl);background:#fff;display:grid;place-items:center;padding:0;touch-action:none;cursor:grab}

.ifood.sel{background:#FFD21F;transform:translateY(-4px)}
@media (max-width:520px){ .ifood{width:44px;height:44px;border-radius:13px} .ifood svg{width:34px;height:34px} }
.ighost{position:fixed;width:64px;height:64px;pointer-events:none;z-index:60;transform:translate(-50%,-60%) scale(1.15)}
.ighost svg{width:100%;height:100%}
.igift{background:#fff;border:4px solid var(--pl);box-shadow:5px 6px 0 var(--pl);display:grid;place-items:center}
.igift svg{width:100%;height:100%;display:block;overflow:visible}
.imark{fill:#FFD21F;stroke:#fff;stroke-width:4;opacity:.7;animation:imark .9s ease-in-out infinite alternate}
@keyframes imark{to{opacity:.3}}
.isow .bob{transform-box:fill-box;transform-origin:50% 100%}
.isow .ijump{animation:hop .6s}
.isow .ishake{animation:shake .5s}
.isow .ispin{animation:ispin .8s}
.isow .ichomp{animation:ichomp .5s 2}
.isow .islide{animation:islide 1s}
.isow .istretch{animation:istretch 1s}
.isow .iroll{animation:iroll 1s}
.isow .iyawn{animation:iyawn 1s}
.isow .igrow{animation:pop .6s}
.isow .idropin{animation:idropin .8s cubic-bezier(.3,1.4,.5,1)}
.isow .ilift{transform:translateY(-18px) scale(1.08)}
.isow .walking{animation:iwalk .4s ease-in-out infinite alternate}
@keyframes ispin{50%{transform:translateY(-40px) rotate(180deg)}100%{transform:rotate(360deg)}}
@keyframes ichomp{50%{transform:scale(1.08,.9)}}
@keyframes islide{30%{transform:translateX(30px) rotate(-20deg)}60%{transform:translateX(-10px) rotate(8deg)}}
@keyframes istretch{40%{transform:scaleY(1.18)}}
@keyframes iroll{50%{transform:rotate(-25deg) translateX(-10px)}}
@keyframes iyawn{40%{transform:scale(1.12,1.06)}}
@keyframes idropin{0%{transform:translateY(-220px) scale(.6);opacity:0}60%{opacity:1}}
@keyframes iwalk{to{transform:translateY(-6px) rotate(2deg)}}
.isow .ifxu{animation:ifxu 1.3s ease-out forwards}
.isow .ifxkey{animation:ifxkey 1.3s ease-in-out forwards}
@keyframes ifxkey{0%{transform:translate(-160px,-120px) rotate(-30deg);opacity:0}25%{opacity:1}60%{transform:translate(0,40px) rotate(0)}75%{transform:translate(0,40px) rotate(90deg)}100%{transform:translate(0,30px) rotate(90deg) scale(1.3);opacity:0}}
@keyframes ifxu{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{transform:translateY(-90px);opacity:0}}
.isow .ifxb{transform-box:fill-box;transform-origin:50% 100%;animation:ifxb 1.8s ease-out forwards}
@keyframes ifxb{0%{transform:scale(0)}12%{transform:scale(1.15)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.isow .ifxdrop{animation:ifxdrop .9s ease-in forwards}

.riser.away{opacity:0;transition:opacity .5s;pointer-events:none}

.mapbtn .blabel{position:absolute;left:50%;bottom:-12px;translate:-50% 0;white-space:nowrap;background:var(--pl);color:#fff;font-weight:900;font-size:14px;padding:2px 10px;border-radius:10px;border:3px solid #fff}

function idb(){ if(_db) return _db; _db=new Promise((res,rej)=>{ try{ const r=indexedDB.open('choi-oi-audio',1); r.onupgradeneeded=()=>r.result.createObjectStore('clips'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error) }catch(e){rej(e)} }); return _db }

// English listening/phonics skills only count attempts made in English mode (drawing lines counts in both)
function dayStats(id){ const m={}; const eng=/\.E\.(LS|PH)\./.test(id); for(const a of S.attempts) if(a.s===id&&!(eng&&a.lang==='vi')){ const v=(m[a.d]=m[a.d]||{n:0,ok:0}); v.n++; if(a.ok) v.ok++ } return m }
const isPass=v=>v.n>=4&&v.ok/v.n>=0.8;
function passDays(id){ return Object.entries(dayStats(id)).filter(([,v])=>isPass(v)).map(([d])=>d) }
function failStreak(id){ const ds=Object.entries(dayStats(id)).sort((a,b)=>a[0]<b[0]?-1:1); let c=0; for(let i=ds.length-1;i>=0;i--){ const v=ds[i][1]; if(isPass(v)) break; if(v.n>=4) c++ } return c }
function status(sk){
  if(sk.kind==='off') return S.ticked[sk.id]?'got_it':(S.offscreen[sk.id]?'assigned':'not_yet');
  if(sk.kind==='speak') return S.speaks.some(x=>x.s===sk.id)?'spoken':'not_yet';
  if(passDays(sk.id).length>=2) return 'got_it';
  return S.attempts.some(a=>a.s===sk.id)?'practising':'not_yet';
}
function satisfied(pid){ const p=SK[pid]; if(!p||p.kind!=='tap') return true; return passDays(pid).length>=1 }
const unlocked=sk=>sk.prereqs.every(satisfied);
function rec(sk,ok,rt,c){ if(RUN){ RUN.hintArmed=false; if((RUN.preQ&&RUN.preQ.length)||RUN.remindQ){ (window.__lostPre=window.__lostPre||[]).push((RUN.step??'')+':'+sk.id+':'+((RUN.preQ||[]).map(l=>l[0]).join('|')||'remind')); RUN.preQ=[]; RUN.remindQ=null } } if(RUN&&RUN.noRec) return; c=c===undefined?(RUN&&RUN.concept)||null:c; const a={s:sk.id,ok:!!ok,rt:Math.round(rt||0),d:today(),lang:S.lang}; if(c) a.c=c; S.attempts.push(a); if(typeof revNote==='function') revNote(sk.id,ok); if(c&&typeof missNote==='function') missNote(c,ok); save() }

/* ---------------- planner ---------------- */
function planSession(){
  if(S.lesson<LESSONS.length){ const L=LESSONS[S.lesson]; return {lesson:S.lesson,items:L.items.map(id=>SK[id]),mission:SK[L.job]} }
  // after the path: review what is not solid yet, in path order (one Math, one other)
  const path=LESSONS.slice(1).flatMap(l=>l.items).map(id=>SK[id]);
  const need=path.filter(s=>s.kind==='tap'&&status(s)!=='got_it');
  const items=[need.find(s=>s.area==='M'),need.find(s=>s.area!=='M')].filter(Boolean);
  const pool=path.filter(s=>!items.includes(s)); while(items.length<2&&pool.length) items.push(pool.splice(rand(pool.length),1)[0]);
  const offs=SKILLS.filter(s=>s.kind==='off').sort((a,b)=>(S.missionCount[a.id]||0)-(S.missionCount[b.id]||0));
  return {lesson:null,items,mission:offs[0]};
}

function tone(freq,dur,type='sine',vol=.18,when=0,slide,dest){ const a=ac(); if(!a) return; const t=a.currentTime+when; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(dest||a.destination); o.start(t); o.stop(t+dur+.05) }
function noise(dur,vol=.4,when=0,freq=1800){ const a=ac(); if(!a) return; const n=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3); const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; const g=a.createGain(); g.gain.value=vol; s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime+when) }

/* =========================================================
   THE HINT HAND (19/10): the child does nothing for ~5.5 s → the hand shows what to do (with a little sparkle).
   Questions that are scored: only on the first turn of each game (RUN.hintArmed, cleared by the first scored answer).
   The doing parts of a story (hug, clap, breathe, open the map, tap the shaking bush, the microphone): every time.
   ========================================================= */
function hintHand(targetFn,{kind='tap',always=false,ms=5500,repeat=7000}={}){
  if(AUTO||!RUN) return ()=>{};
  if(!always&&!RUN.hintArmed) return ()=>{};
  let t=null, stop=false, busy=false;
  const go=async()=>{ if(stop||!RUN||RUN.aborted) return; const tg=targetFn(); if(!tg||!tg.isConnected) return;
    busy=true;
    try{ burst(center(tg),{n:8}); tone(1320,.12,'sine',.05); tone(1760,.16,'sine',.04,.08);
      await Hand.moveTo(center(tg),550); if(stop) return;
      if(kind==='hold') await Hand.press(1300); else if(kind==='tap3'){ for(let i=0;i<3&&!stop;i++){ await Hand.tap(); await sleep(180) } } else { await Hand.tap(); await sleep(200); if(!stop) await Hand.tap() }
      await sleep(450) }catch(e){}
    if(!stop) Hand.hide(); busy=false; if(!stop) t=setTimeout(go,repeat) };
  t=setTimeout(go,ms);
  return ()=>{ if(stop) return; stop=true; clearTimeout(t); if(busy) Hand.hide() } }

function tvPads(els){ const bar=padBar(); if(!S.tv||!bar||!RUN||!els.length||els.length>4) return ()=>{};
  const order=els.map((e,i)=>({e,i,r:e.getBoundingClientRect()})).sort((a,b)=>Math.abs(a.r.top-b.r.top)>a.r.height*.6?a.r.top-b.r.top:a.r.left-b.r.left);
  bar.innerHTML=''; bar.classList.add('live');
  order.forEach((o,j)=>{ const c=els.length===1?'#FFFFFF':PADC[j]; o.e.classList.add('tvframe'); o.e.style.setProperty('--tvc',els.length===1?'#FCB515':PADC[j]);
    const p=el(`<button class="tvpad${els.length===1?' one':''}" style="--c:${c}" aria-label="Chọn">${els.length===1?ICON.hand:`<svg viewBox="0 0 24 24" fill="#fff">${PADSHAPE[j]}</svg>`}</button>`);
    p.onclick=()=>{ SFX.pop(); o.e.dispatchEvent(new MouseEvent('click',{bubbles:true})) }; bar.append(p) });
  return ()=>{ bar.innerHTML=''; bar.classList.remove('live'); els.forEach(e=>{ e.classList.remove('tvframe'); e.style.removeProperty('--tvc') }) } }
/** TV mode: one big pad that taps the next thing (feeding, drumming, jumping…) */
function tvTapPad(onTap){ const bar=padBar(); if(!S.tv||!bar||!RUN) return ()=>{}; bar.innerHTML=''; bar.classList.add('live');
  const p=el(`<button class="tvpad one" style="--c:#FFFFFF" aria-label="Chạm">${ICON.hand}</button>`); p.onclick=()=>{ onTap() }; bar.append(p);
  return ()=>{ bar.innerHTML=''; bar.classList.remove('live') } }
function tapOnce(els,{nudge=true,hint}={}){
  return new Promise((res,rej)=>{
    const unpad=tvPads(els); const stopNudge=nudge?idleNudge(els):()=>{};
    const isNext=els.length===1&&els[0].classList.contains('nextbtn'), hm=hint===false||isNext?null:(hint==='always'||els.length===1?'always':'armed');
    const stopHint=hm?hintHand(()=>els.find(e=>e.dataset.ok==='1'&&!e.dataset.used),{always:hm==='always'}):()=>{};
    const hs=[]; const cleanup=()=>{ hs.forEach(([e,f])=>e.removeEventListener('click',f)); hs.length=0; abortFns.delete(ab); unpad(); stopNudge(); stopHint() };
    const ab=()=>{ cleanup(); rej(ABORT) };
    els.forEach((e,i)=>{ const f=ev=>{ ev.stopPropagation(); cleanup(); res(i) }; e.addEventListener('click',f); hs.push([e,f]) });
    abortFns.add(ab); if(RUN&&RUN.aborted) return ab();
    if(AUTO) setTimeout(()=>{ if(!hs.length) return; let i=els.findIndex(e=>e.dataset.ok==='1'); if(window.__autoWrong&&Math.random()<window.__autoWrong) i=Math.floor(Math.random()*els.length); cleanup(); res(i<0?0:i) },HASH==='auto'?15:HASH==='time'?2200:900*SPEED);
  });
}
async function watchMe(){ turn('choi'); await say('Watch me first!','Xem Chồi làm trước nhé!') }

/* ---------------- choice rounds ---------------- */
/** One child round: pictures appear first, then Chồi asks. First tap is what counts. */
async function kidRound(sk,R){
  if(RUN) RUN.concept=R.concept||null;
  if(R.pre) await R.pre(); await reveal(R.opts); await sleep(300); await flushPre(); await R.ask();
  const again=R.replay||R.ask; RUN.qfn=again;
  R.opts.forEach((o,i)=>{ if(i===R.correct) o.dataset.ok='1' });
  const t0=performance.now(); let first=true;
  for(;;){
    const i=await tapOnce(R.opts);
    if(i===R.correct){ R.opts[i].classList.add('right'); SFX.chime(); burst(center(R.opts[i])); if(first) rec(sk,true,performance.now()-t0); if(R.onRight) await R.onRight(); await kept(first,{later:true,line:R.praise}); if(R.answer) await say(...R.answer,{gap:300}); await reteachPending(); return }
    R.opts[i].classList.remove('nope'); void R.opts[i].offsetWidth; R.opts[i].classList.add('nope'); boing();
    const Lb=R.labels&&R.labels[i]; if(Lb) await say(`Oops, ${Lb[0]}.`,`Ơ, ${Lb[1]}.`,{gap:300});
    if(first){ rec(sk,false,performance.now()-t0); first=false; await say('Try again!','Thử lại nào!'); await again() }
    else { R.opts[R.correct].classList.add('hint'); await Hand.moveTo(center(R.opts[R.correct]),600); await sleep(700); Hand.hide(); await again() }
  }
}
/** Choice activity: one demo round by Chồi (hand taps the answer), then child rounds. */
/** a game the child has already been shown: no 'watch me' demo the second time */
function seenDemo(key){ S.seenDemo=S.seenDemo||{}; const was=!!S.seenDemo[key]; S.seenDemo[key]=1; save(); return was&&!(RUN&&RUN.dev&&RUN.forceDemo) }
async function choiceActivity(sk,rounds,intro,make){
  const noShow=RUN&&RUN.mode?!wantDemo('choice'):(typeSeen('choice'),seenDemo('choice:'+sk.id+':'+intro[0]));
  let first=make(noShow?0:-1); await say(...intro);
  if(noShow){ turn('kid'); for(let r=0;r<rounds;r++){ const R=r?make(r):first; await kidRound(sk,R); await sleep(500) } turn(null); return }
  await watchMe();
  let R=first; if(R.pre) await R.pre(); await reveal(R.opts); await sleep(300); await flushPre(); await R.ask(); await sleep(300);
  if(R.explain) await R.explain();
  await Hand.moveTo(center(R.opts[R.correct])); await Hand.tap(); R.opts[R.correct].classList.add('right'); SFX.chime(); if(R.onRight) await R.onRight();
  await say(...R.answer); await sleep(400);
  await yourTurn();
  for(let r=0;r<rounds;r++){ R=make(r); await kidRound(sk,R); await sleep(500) }
  turn(null);
}

/** what a line to draw looks like: a road (default), a dotted lane for things that fall or fly, a slide, a bridge, a kite string */
function traceLane(lane,A,B,band,K){
  const v=A.x===B.x, L=`x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"`, h=band/2;
  const side=d=>v?`x1="${A.x+d}" y1="${A.y}" x2="${B.x+d}" y2="${B.y}"`:`x1="${A.x}" y1="${A.y+d}" x2="${B.x}" y2="${B.y+d}"`;
  if(lane==='dots'||lane==='string') return `<line ${side(-h)} stroke="#8FB9A6" stroke-width="4" stroke-dasharray="3 11" stroke-linecap="round"/><line ${side(h)} stroke="#8FB9A6" stroke-width="4" stroke-dasharray="3 11" stroke-linecap="round"/>`;
  if(lane==='slide') return `<line ${L} stroke="${INK}" stroke-width="${band+10}" stroke-linecap="round"/><line ${L} stroke="#E8607E" stroke-width="${band}" stroke-linecap="round"/><line ${side(-h*.45)} stroke="#F7A9B8" stroke-width="6" stroke-linecap="round"/>`;
  if(lane==='bridge'){ const n=Math.max(6,Math.round(Math.abs(B.x-A.x)/26)); let planks=''; for(let i=0;i<=n;i++){ const x=A.x+(B.x-A.x)*i/n; planks+=`<line x1="${x}" y1="${A.y-h}" x2="${x}" y2="${A.y+h}" stroke="#8A5530" stroke-width="3"/>` }
    return `<rect x="${A.x-6}" y="${A.y-h}" width="${B.x-A.x+12}" height="${band}" rx="6" fill="#C98A52" stroke="${INK}" stroke-width="3"/>${planks}<line ${side(-h-10)} stroke="${INK}" stroke-width="4"/>${[0,.25,.5,.75,1].map(t=>`<line x1="${A.x+(B.x-A.x)*t}" y1="${A.y-h-10}" x2="${A.x+(B.x-A.x)*t}" y2="${A.y-h}" stroke="${INK}" stroke-width="4"/>`).join('')}` }
  return `<line ${L} stroke="#D3E3DB" stroke-width="${band}" stroke-linecap="round"/><line ${L} stroke="#fff" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>`;
}

}

/* =========================================================
   HANDS-ON FORMATS (not multiple choice): build, feed, hide & seek,
   copy, jump, order. Each has Chồi's demo, then the child's turn.
   ========================================================= */
const EXTRA={};
function addFormat(game,fmt,fn){ FMTS[game]=FMTS[game]||[]; if(!FMTS[game].includes(fmt)) FMTS[game].unshift(fmt); (EXTRA[game]=EXTRA[game]||{})[fmt]=fn }
function wrapGame(game,baseFmt){ const base=GAMES[game]; FMTS[game]=FMTS[game]||[baseFmt]; GAMES[game]=(sk,rounds)=>{ const fmt=fmtFor(sk,FMTS[game]); return (EXTRA[game]&&EXTRA[game][fmt])?EXTRA[game][fmt](sk,rounds):base(sk,rounds) } }
const choiceFmts=game=>(FMTS[game]||[]).filter(f=>!(EXTRA[game]&&EXTRA[game][f]));
const kidTapDelay=()=>HASH==='auto'?3:HASH==='time'?700:450*SPEED;

/** pick among visible options; returns true if right on the first tap */
async function stepPick(sk,opts,correct,{ask,labels,onRight,record=true,concept}={}){
  if(concept&&RUN) RUN.concept=concept;
  opts.forEach((o,i)=>{ delete o.dataset.ok; o.classList.remove('hint'); if(i===correct) o.dataset.ok='1' });
  // the child may answer while Chồi is still asking: the options listen straight away
  const hush=()=>{ voiceStop(); try{ speechSynthesis.cancel() }catch(e){} stopFeelMusic() };
  const race=async(talk,p)=>{ let tapped=false; p.then(()=>{ tapped=true; hush() },()=>{}); try{ await talk() }catch(e){ if(e===ABORT) throw e } return tapped };
  let p=tapOnce(opts); if(ask) await race(ask,p); if(ask&&RUN) RUN.qfn=ask; const t0=performance.now(); let first=true;
  for(;;){ const i=await p;
    if(i===correct){ SFX.chime(); burst(center(opts[i])); if(first&&record) rec(sk,true,performance.now()-t0); if(onRight) await onRight(i); return first }
    opts[i].classList.remove('nope'); void opts[i].offsetWidth; opts[i].classList.add('nope'); boing();
    p=tapOnce(opts); let early=false;
    const Lb=labels&&labels[i]; if(Lb) early=await race(()=>say(`Hmm, ${Lb[0]}.`,`Ơ, ${Lb[1]}.`,{gap:300}),p);
    if(first){ if(record) rec(sk,false,performance.now()-t0); first=false; if(!early) early=await race(()=>say('Let’s look again.','Mình nhìn lại nhé.'),p) }
    else if(!early){ opts[correct].classList.add('hint'); await Hand.moveTo(center(opts[correct]),600); await sleep(600); Hand.hide() }
    if(ask&&!early) await race(ask,p) }
}
/** count taps on one or more buttons until the child stops for a moment */
function countTaps(btns,onTap,{idle=2000,auto=0,cap=0,fastAt=0}={}){
  return new Promise((res,rej)=>{ let c=0,timer=null,fin=false; const unpad=tvTapPad(()=>{ const b=btns.find(x=>!x.dataset.used)||btns[0]; if(b&&b.onclick) b.onclick() });
    const stopNudge=idleNudge(btns,()=>c===0,{point:true}); const stopHint=hintHand(()=>btns.find(x=>!x.dataset.used&&x.style.visibility!=='hidden')||btns[0]);
    const ab=()=>{ fin=true; clearTimeout(timer); stopNudge(); stopHint(); unpad(); rej(ABORT) }; abortFns.add(ab);
    let waitDrag=0; const done=()=>{ if(fin) return; if(DRAGGING>0&&waitDrag++<6){ timer=setTimeout(done,600); return } fin=true; clearTimeout(timer); stopNudge(); abortFns.delete(ab); unpad(); btns.forEach(b=>b.onclick=null); res(c) };
    btns.forEach(b=>b.onclick=()=>{ if(fin||b.dataset.used) return; c++; stopHint(); onTap(c,b); clearTimeout(timer);
      if(cap&&c>=cap){ fin=true; btns.forEach(x=>x.onclick=null); setTimeout(()=>{ fin=false; done() },500*SPEED); return }   // too many taps: stop here
      timer=setTimeout(done,(fastAt&&c===fastAt?450:idle)*SPEED) });
    if(AUTO) (async()=>{ if(window.__autoWrong&&Math.random()<window.__autoWrong) auto=Math.max(1,auto+(Math.random()<.5?-1:2)); for(let i=0;i<auto;i++){ await new Promise(r=>setTimeout(r,kidTapDelay())); const b=btns.find(x=>!x.dataset.used)||btns[0]; b.click() } })() });
}
/** a child who doesn't tap: say the question again after a while, then wiggle what can be tapped */
function idleNudge(els,still=()=>true,{point=false}={}){
  if(AUTO||!RUN) return ()=>{}; let n=0, t=null, miss=0; const live=()=>RUN&&!RUN.aborted&&els.some(e=>e.isConnected)&&still();
  const wig=()=>{ els.forEach(e=>{ if(e.dataset.used||e.disabled) return; e.classList.remove('nudge'); void e.offsetWidth; e.classList.add('nudge'); setTimeout(()=>e.classList.remove('nudge'),1100) }); SFX.ding() };
  const tick=async()=>{ if(!live()) return; n++;
    if(n%2===1){ await askAgain() } else wig();
    if(n<5) t=setTimeout(tick,(n%2?9000:11000)) };
  // taps that miss everything: after a few, show what to tap
  const host=$('#card'); const onMiss=async e=>{ if(!live()||els.some(x=>x.contains(e.target))) return; miss++;
    if(miss%3===0){ wig(); if(point){ const tg=els.find(x=>!x.dataset.used&&!x.disabled)||els[0]; try{ await Hand.moveTo(center(tg),500); await Hand.tap(); await sleep(400) }catch(_){} Hand.hide() } } };
  if(host) host.addEventListener('pointerdown',onMiss,true);
  t=setTimeout(tick,12000); return ()=>{ clearTimeout(t); n=99; if(host) host.removeEventListener('pointerdown',onMiss,true) } }
/** one counting turn with a limit on taps. Wrong → look again and try once more; wrong again → show the answer and move on.
 *  Only the first try is recorded. */
async function countTurn(sk,{n,btns,onTap,idle=2000,cap,before,reset,retry,answer,fastAt=0,concept}){
  if(RUN) RUN.concept=concept!==undefined?concept:(sk.id==='L2.M.NUM.05'?'flash:':'count:')+n;
  const t0=performance.now(); let k=await countTaps(btns,onTap,{idle,auto:n,cap:cap||n+2,fastAt}); await sleep(350);
  const ok=k===n; rec(sk,ok,performance.now()-t0); if(ok) return {ok:true,k};
  if(before) await before(k);
  if(reset) await reset(); await retry();
  k=await countTaps(btns,onTap,{idle,auto:n,cap:cap||n+2,fastAt}); await sleep(350);
  if(k===n){ SFX.chime(); return {ok:false,k,second:true} }
  await answer(k); return {ok:false,k} }
async function demoTaps(btns,n,onEach){ for(let i=0;i<n;i++){ const b=btns.find(x=>!x.dataset.used)||btns[0]; await Hand.moveTo(center(b),520); await Hand.tap(); await onEach(i+1,b) } Hand.hide() }
async function kept(first,{later=false,line=null}={}){ if(first) await praise(line); else { mood('happy'); await say('You kept trying, and you got it!','Con cố gắng mãi và đã làm được!',{keepMood:true}); mood('idle') } if(!later) await reteachPending() }

/* =========================================================
   SPIRAL LESSONS (19/10): teach → practise → review; teach a concept again after two misses in a row.
   RUN.mode for one activity:
     'teach'    first look at a new idea (or a Mầm idea, once per school year): Chồi shows how
     'practice' the idea again later in the level: no demo once the child knows that way of playing
     'review'   an idea from an earlier level: a ~3-second reminder, no demo once the way of playing is known
     (unset)    the old behaviour
   A replayed level keeps its pictures but skips Chồi's demo of any way of playing the child has already seen.
   ========================================================= */
function typeSeen(key){ S.seenType=S.seenType||{}; const was=!!S.seenType[key]; if(!was){ S.seenType[key]=1; save() } return was }
function wantDemo(key){ const seen=typeSeen(key); if(RUN&&RUN.dev&&RUN.forceDemo) return true; const m=RUN&&RUN.mode; if(!m) return true; if(RUN.replay||m!=='teach') return !seen; return true }
/** Chồi's demo round, when it is wanted; otherwise straight to the child's turn */
async function demoOr(key,fn){ if(wantDemo(key)){ turn('choi'); RUN.inDemo=true; RUN.preQ=[['Watch me first!','Xem Chồi làm trước nhé!']];
    try{ await fn() } finally { if(RUN){ RUN.inDemo=false; if(RUN.preQ&&RUN.preQ.length) (window.__lostPre=window.__lostPre||[]).push(key+':watch'); RUN.preQ=[] } }
    Hand.hide(); await sleep(300); turn('kid'); SFX.ding(); RUN.preQ=[['Now it’s your turn!','Giờ đến lượt con!']]; return true }
  turn('kid'); return false }

/* ---- 1. build a face (feelings) ---- */
const BROWS={neutral:'M28 33 h14 M58 33 h14',raised:'M27 28 q8 -7 16 0 M57 28 q8 -7 16 0',angry:'M26 31 L43 39 M74 31 L57 39',sad:'M26 37 L41 30 M74 37 L59 30'};

  const round=async(t,demo)=>{
    const c=card(); const face=el(`<div class="pic big fade">${buildFaceSVG(null,null,{blank:1})}</div>`); c.append(face);
    const [bw,mw]=RECIPE[t]; let curB=null,curM=null; const draw=()=>face.innerHTML=buildFaceSVG(curB,curM,{blank:1});
    await say(`Let’s make ${/^[aeiou]/.test(t)?"an":"a"} ${t} face!`,`Mình làm khuôn mặt ${VI_FEEL[t]} nhé!`);
    let ok=true;
    for(const part of ['brows','mouth']){
      const right=part==='brows'?bw:mw; const keys=Object.keys(part==='brows'?BROWS:MOUTHS).filter(k=>k!==right);
      const set=shuffle([right,...shuffle(keys).slice(0,2)]);
      // the choices show only the part (eyebrows or a mouth); the chosen one flies up onto the face
      const VB=part==='brows'?[16,18,68,28]:[22,50,56,34];
      const partSVG=k=>part==='brows'?`<svg viewBox="${VB.join(' ')}"><path d="${BROWS[k]}" stroke="${INK}" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>`:`<svg viewBox="${VB.join(' ')}">${MOUTHS[k]}</svg>`;
      const row=el(`<div class="opts partopts"></div>`); const opts=set.map(k=>{ const b=el(`<button class="opt pre partopt">${partSVG(k)}</button>`); row.append(b); return b }); c.append(row); await reveal(opts);
      const ask=()=>say(part==='brows'?`For ${/^[aeiou]/.test(t)?"an":"a"} ${t} face, which eyebrows should we use?`:`Now, which mouth makes the face look ${t}?`,part==='brows'?`Khuôn mặt đang ${VI_FEEL[t]} thì lông mày thế nào? Con chọn nhé.`:`Cái miệng nào làm khuôn mặt trông ${VI_FEEL[t]}?`);
      const apply=async i=>{ const from=opts[i].querySelector('svg').getBoundingClientRect(), fs=face.querySelector('svg').getBoundingClientRect();
        const to={left:fs.left+fs.width*VB[0]/100,top:fs.top+fs.height*VB[1]/100,width:fs.width*VB[2]/100,height:fs.height*VB[3]/100};
        const fl=el(`<div class="flypart" style="left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px">${partSVG(set[i])}</div>`); document.body.append(fl); opts[i].style.visibility='hidden';
        tone(600,.25,'sine',.06,0,1100);

        fl.remove(); if(part==='brows') curB=set[i]; else curM=set[i]; draw(); SFX.pop(); face.classList.remove('pop'); void face.offsetWidth; face.classList.add('pop'); await sleep(300) };
      if(demo){ await ask(); await Hand.moveTo(center(opts[set.indexOf(right)])); await Hand.tap(); await apply(set.indexOf(right)) }

  turn(null);

/* ---- 2. hide and seek: count to ten, then find Chồi ---- */
async function hideSeek(sk){
  const n=sk.p.n;
  await say('Let’s play hide and seek!','Mình chơi trốn tìm nhé!');
  const c=card(); const big=el(`<b class="bignum">&nbsp;</b>`); const yard=el(`<div class="yard fade"></div>`);
  const bushes=[0,1,2].map(i=>{ const b=el(`<button class="bush" style="left:${18+i*32}%" aria-label="bụi cây">${ART.bush()}</button>`); yard.append(b); return b });
  c.append(big,yard);
  const show=k=>{ big.textContent=k; big.classList.remove('bump'); void big.offsetWidth; big.classList.add('bump') };
  turn('choi'); await say(`I’ll count to ${W[n]}. You hide!`,`Chồi đếm đến ${VI_N[n]}, con đi trốn nhé!`);
  for(let i=1;i<=n;i++){ show(i); await say(cap(W[i])+'.',VI_N[i],{gap:150,rate:.9}) }
  await say('Ready or not, here I come!','Chồi đi tìm đây!');
  turn('kid'); SFX.ding(); await say(`Now you count to ${W[n]}. I’ll hide!`,`Giờ con đếm đến ${VI_N[n]} nhé, Chồi đi trốn đây!`,{gap:200});
  big.innerHTML='&nbsp;';
  const mic=el(`<button class="mic" aria-label="Micro">${ICON.mic}</button>`); c.append(mic);
  await say('Tap the microphone, then count!','Con chạm vào micro rồi đếm nhé!',{gap:150});
  const ms=n*1150+1400, id='c'+Date.now(); let lit=Promise.resolve();
  const T=await micTurn(mic,ms,{onStart:()=>{ lit=(async()=>{ for(let i=1;i<=n;i++){ await sleep(1150); show(i); SFX.pop() } })().catch(()=>{}) }}); const r=T.r||null, heard=T.heard||null; await lit; mic.remove();
  if(T.skipped||T.nomic){ await say('Let’s count together!','Mình cùng đếm nhé!',{gap:150}); for(let i=1;i<=n;i++){ show(i); await say(cap(W[i])+'.',VI_N[i],{gap:150,rate:.9}) } }
  else if(r&&r.blob&&r.voiced){ await say('Listen! That’s you counting!','Nghe này, con đếm đấy!',{gap:200}); Music.level(.15); await playBlob(r.blob); Music.level(1) }
  const NW=isVi()?VI_N:W; const got=heard?NW.slice(1,n+1).filter((w,i)=>heard.some(h=>norm(h).includes(norm(w))||h.includes(String(i+1)))).length:null;
  S.speaks.push({s:sk.id,d:today(),lang:S.lang,text:NW.slice(1,n+1).join(', '),voiced:r?r.voiced:null,heard:heard?heard[0]:null,matched:got===null?null:got>=Math.ceil(n*.6),clip:r&&r.blob?id:null}); save();
  if(r&&r.blob) putClip(id,r.blob);
  await say('You counted to ten! Now, where am I? Tap a bush!','Con đếm đến mười rồi! Chồi trốn ở đâu nhỉ? Chạm vào một bụi cây!');
  const hide=rand(3); let tries=0;
  await new Promise((res,rej)=>{ const stopN=idleNudge(bushes); const ab=()=>{ stopN(); rej(ABORT) }; abortFns.add(ab);
    bushes.forEach((b,i)=>b.onclick=async()=>{ if(b.dataset.used) return; b.dataset.used=1; tries++; b.classList.add('peek');
      if(i===hide){ b.insertAdjacentHTML('beforeend',`<div class="peekchoi">${mascotSVG()}</div>`); SFX.chime(); confetti(); stopN(); abortFns.delete(ab); await say('You found me!','Con tìm thấy Chồi rồi!').catch(()=>{}); res() }
      else { SFX.soft(); say('Not here! Try another bush.','Không có ở đây! Con thử bụi cây khác nhé.').catch(()=>{}) } });
    if(AUTO) setTimeout(()=>bushes[hide].click(),kidTapDelay()) });
  turn(null);
}

function bouncyBall(ball,{x=50,y=6,floor=6,left=3,right=96,g=280}={}){
  const st={x,y,vx:0,vy:0,on:true,rest:true}; let spin=0; const put=()=>{ ball.style.left=st.x+'%'; ball.style.bottom=st.y+'%'; ball.style.rotate=spin+'deg' }; put();
  let t0=performance.now();
  const step=t=>{ if(!st.on) return; if(PAUSED){ t0=t; requestAnimationFrame(step); return } const dt=Math.min(.04,(t-t0)/1000)/Math.max(.05,SPEED); t0=t;
    if(!st.rest){ st.vy-=g*dt; st.x+=st.vx*dt; st.y+=st.vy*dt;
      if(st.y<floor){ st.y=floor; if(Math.abs(st.vy)>28){ st.vy=-st.vy*.6; tone(170,.05,'sine',.05) } else st.vy=0; st.vx*=.82; if(!st.vy&&Math.abs(st.vx)<2){ st.vx=0; st.rest=true } }
      if(st.x<left){ st.x=left; st.vx=Math.abs(st.vx)*.7; tone(230,.05,'sine',.05) } if(st.x>right){ st.x=right; st.vx=-Math.abs(st.vx)*.7; tone(230,.05,'sine',.05) }
      spin+=st.vx*dt*9; put() }
    if(st.onStep) st.onStep(st); requestAnimationFrame(step) };
  requestAnimationFrame(step); abortFns.add(()=>{ st.on=false });
  st.kick=(vx,vy)=>{ st.vx=vx; st.vy=vy; st.rest=false; tone(330,.08,'square',.06); noise(.05,.15,0,900) }; st.stop=()=>{ st.on=false }; return st }

/** press and hold (a hug, a deep breath, pulling a blanket); a ring fills up. TV mode: hold the big pad */
function holdOn(target,ms=1600){
  return new Promise((res,rej)=>{
    const ring=el(`<div class="holdring"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/></svg></div>`); target.append(ring); const circ=ring.querySelector('circle');
    let t0=0, raf=null, done=false; const total=ms*Math.max(SPEED,.05);
    const step=()=>{ const p=Math.min(1,(performance.now()-t0)/total); circ.style.strokeDashoffset=107*(1-p); target.style.setProperty('--hold',p);
      if(p>=1){ finish(); return } raf=requestAnimationFrame(step) };
    const down=e=>{ if(e) e.preventDefault(); if(done) return; stopH(); t0=performance.now(); target.classList.add('holding'); cancelAnimationFrame(raf); raf=requestAnimationFrame(step); tone(440,.15,'sine',.05,0,660) };
    let quick=0; const stopN=idleNudge([target],()=>true,{point:true}); const stopH=hintHand(()=>target,{kind:'hold',always:true});
    const up=()=>{ if(done||!target.classList.contains('holding')) return; cancelAnimationFrame(raf); target.classList.remove('holding'); circ.style.strokeDashoffset=107; target.style.setProperty('--hold',0);
      if(performance.now()-t0<total*.6){ quick++;   // the child taps instead of holding
        if(quick===2) say('Keep your finger on it. Hold, hold, hold!','Con giữ ngón tay thật lâu nhé. Giữ, giữ, giữ!',{gap:0,q:false}).catch(()=>{});
        if(quick>=5) finish() } };
    const bar=padBar(); let pad=null;
    if(S.tv&&bar){ bar.innerHTML=''; bar.classList.add('live'); pad=el(`<button class="tvpad one hold" style="--c:#FFFFFF" aria-label="Nhấn giữ">${ICON.hand}</button>`); bar.append(pad);
      pad.addEventListener('pointerdown',down); ['pointerup','pointerleave','pointercancel'].forEach(ev=>pad.addEventListener(ev,up)) }
    target.addEventListener('pointerdown',down); ['pointerup','pointerleave','pointercancel'].forEach(ev=>target.addEventListener(ev,up));
    const cleanup=()=>{ done=true; stopN(); cancelAnimationFrame(raf); ring.remove(); target.classList.remove('holding'); if(pad){ bar.innerHTML=''; bar.classList.remove('live') } abortFns.delete(ab) };
    function finish(){ cleanup(); SFX.chime(); res() }
    const ab=()=>{ cleanup(); rej(ABORT) }; abortFns.add(ab);
    if(AUTO) setTimeout(()=>{ if(!done) finish() },HASH==='auto'?10:600*SPEED);
  });
}
