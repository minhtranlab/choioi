const MBUF={}; async function musicBuf(file){ if(MBUF[file]) return MBUF[file]; const a=ac(); if(!a) return null;
  try{ const r=await fetch(`music/${file}.mp3`); if(!r.ok) throw 0; const ab=await r.arrayBuffer(); return MBUF[file]=await new Promise((res,rej)=>{ const p=a.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej) }) }catch(e){ return null } }
/** play a music file. under: Chồi may talk over it (it is quieter and does not wait). Returns {stop, done} */
async function playMusic(file,{gain=.95,maxSec=60,under=false}={}){
  const a=ac(), b=await Promise.race([musicBuf(file),rawWait(4000).then(()=>null)]); if(!a||!b||FAST) return {stop(){},done:Promise.resolve()};
  if(!under) Music.level(.05);
  const s=a.createBufferSource(), g=a.createGain(); s.buffer=b; s.connect(g).connect(a.destination); const t0=a.currentTime, len=Math.min(b.duration,maxSec);
  g.gain.setValueAtTime(gain,t0); if(b.duration>maxSec){ g.gain.setValueAtTime(gain,t0+len-1.2); g.gain.linearRampToValueAtTime(0,t0+len) }
  s.start(t0); s.stop(t0+len+.05);
  let fin; const done=new Promise(res=>{ fin=res }); let over=false;
  const end=()=>{ if(over) return; over=true; if(!under) Music.level(1); fin() };
  s.onended=end; setTimeout(end,(len+.4)*1000);
  const stop=()=>{ try{ g.gain.setTargetAtTime(0,a.currentTime,.08); s.stop(a.currentTime+.4) }catch(e){} end() };
  abortFns.add(stop); return {stop,done} }

      const again=curB===b; if(cur){ cur.stop(); cur=null } if(curB){ curB.classList.remove('playing'); curB=null } if(again) return;
      SFX.pop(); b.classList.add('playing'); curB=b; setCaption(`${P.en} · ${P.who}`,`${P.vi} · ${P.who}`);
      const me=await playMusic(id+'-box',{maxSec:40}); if(curB!==b){ me.stop(); return } cur=me; me.done.then(()=>{ if(curB===b){ b.classList.remove('playing'); curB=null; cur=null } }) };
    return b });
  const n=MUSIC_ORDER.filter(id=>heard[id]).length;
  try{ await say(n?'Your music box! Tap a picture to listen.':'Play the levels to find music for your music box!',n?'Hộp nhạc của con đây! Chạm vào một bức tranh để nghe nhé.':'Chơi các màn để tìm nhạc cho hộp nhạc nhé!');

  if(cur) cur.stop(); RUN=null; renderHome() }

   ACCOUNTS + GOOGLE SHEET SYNC (17/10)
   One account = one child: child's name, birth year, a login name, a 4-digit PIN, the parent's email.
   Progress lives on this device (localStorage) and is copied to a Google Sheet through a Google Apps Script
   web app (see apps-script/Code.gs). On another device the parent logs in with the login name + PIN and the
   progress comes back. Without a sheet address the app still works and keeps everything on this device.
   ========================================================= */
const SYNC_URL_DEFAULT='https://script.google.com/macros/s/AKfycbxoZAmzYyTYv5vDPXHBti7fN1ZUA40q_ZIUzYtc3ygimTO5PkLuZKiQRE0IQLqEE7g6/exec';   // the Apps Script web app address (…/exec). Can also be typed in Settings.
const syncUrl=()=>String(S.syncUrl||SYNC_URL_DEFAULT||'').trim();
const BOOT_UPD=S.updatedAt||0;   // this device's last change when the app opened (to compare with the sheet)

/* SHA-256 (plain JS, the same on every device and browser), used so the PIN itself is never sent or stored */
function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=Array.from(new TextEncoder().encode(str)), l=b.length*8; b.push(0x80); while(b.length%64!==56) b.push(0);
  for(let i=7;i>=0;i--) b.push(i>3?0:(l>>>(i*8))&255);
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){ const w=new Array(64);
    for(let i=0;i<16;i++) w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){ const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3), s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0 }
    let [a,bb,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){ const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0, t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))|0; hh=g; g=f; f=e; e=(d+t1)|0; d=c; c=bb; bb=a; a=(t1+t2)|0 }
    h=[h[0]+a|0,h[1]+bb|0,h[2]+c|0,h[3]+d|0,h[4]+e|0,h[5]+f|0,h[6]+g|0,h[7]+hh|0] }
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('') }
const pinHash=(login,pin)=>sha256('choi-oi:'+String(login).trim().toLowerCase()+':'+String(pin).trim());
const cleanLogin=s=>String(s||'').trim().toLowerCase();
const loginOk=s=>/^[a-z0-9._-]{3,20}$/.test(s);

async function api(action,data,{timeout=15000}={}){
  const u=syncUrl(); if(!u){ const e=new Error('nourl'); e.code='nourl'; throw e }
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),timeout);
  try{ const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data}),signal:ctl.signal,redirect:'follow'});
    const j=await r.json(); if(!j||!j.ok){ const e=new Error((j&&j.error)||'fail'); e.code=(j&&j.error)||'fail'; throw e } return j }
  catch(e){ if(!e.code) e.code='net'; throw e } finally{ clearTimeout(tm) } }

/* what goes to the sheet: the whole progress, trimmed (old attempts beyond 900 are dropped; recordings stay on the device) */
function syncState(){ const st=JSON.parse(JSON.stringify(S)); delete st.acct; delete st.syncUrl; delete st.syncInfo;
  st.attempts=(S.attempts||[]).slice(-900); st.speaks=(S.speaks||[]).slice(-150).map(x=>({...x,clip:null})); st.sessions=(S.sessions||[]).slice(-120); return st }
/* one line per skill, for the parent to read in the sheet */
function progressSummary(){ return SKILLS.map(sk=>{ const at=S.attempts.filter(a=>a.s===sk.id), last=at.length?at[at.length-1].d:(S.speaks.filter(x=>x.s===sk.id).slice(-1)[0]||{}).d||'';
  return {id:sk.id,name:sk.vi,status:status(sk),tries:at.length,correct:at.filter(a=>a.ok).length,last,review:(S.rev&&S.rev[sk.id]&&S.rev[sk.id].due)||''} }) }
const LEVEL_VI=['Khởi động','Bài 1 · Công viên','Bài 2 · Khu vườn','Bài 3 · Nhà Na','Bài 4 · Cửa hàng','Bài 5 · Công trường','Bài 6 · Đồi nắng','Đảo Kho Báu'];
/* numbers for the Report sheet: where the child is, how often they play, what is due for review */
function syncMeta(){ const days=new Set([...(S.attempts||[]).map(a=>a.d),...Object.keys(S.playMs||{})]); const last=[...days].sort().pop()||'';
  const wk=[...Array(7)].map((_,i)=>localDate(S.dayOffset-i)); const min7=Math.round(wk.reduce((a,d)=>a+((S.playMs||{})[d]||0),0)/60000);
  const due=Object.values(S.rev||{}).filter(r=>r.due<=today()).length; const lv=Math.min(S.lesson||0,LEVEL_VI.length-1);
  return {lesson:S.lesson||0,level:Object.keys(S.done||{}).length>=8?'Xong Chương 1':LEVEL_VI[lv],pieces:S.pieces||0,done:Object.keys(S.done||{}).length,last,days:days.size,min7,due,mix:(S.sessions||[]).filter(x=>x.mix).length,chapter:1} }

let _syncT=null, _syncBusy=false;
function syncSoon(ms=6000){ if(!S.acct||!syncUrl()) return; clearTimeout(_syncT); _syncT=setTimeout(()=>syncPush().catch(()=>{}),ms) }
async function syncPush(){ if(!S.acct||!syncUrl()||_syncBusy) return; _syncBusy=true;
  try{ S.updatedAt=Date.now();
    if(S.acct.pending){ await api('register',{login:S.acct.login,h:S.acct.h,child:S.child&&S.child.name,birthYear:S.child&&S.child.birthYear,email:S.acct.email||'',state:syncState(),summary:progressSummary(),meta:syncMeta()}); S.acct.pending=false }
    else await api('save',{login:S.acct.login,h:S.acct.h,state:syncState(),summary:progressSummary(),meta:syncMeta()});
    S.syncInfo={ok:Date.now()}; saveLocal() }
  catch(e){ S.syncInfo={err:e.code||String(e),at:Date.now()}; saveLocal() } finally{ _syncBusy=false } }
/* on start: if the sheet has newer progress (played on another device), use it */
async function syncPull(){ if(!S.acct||S.acct.pending||!syncUrl()) return false;
  try{ const j=await api('load',{login:S.acct.login,h:S.acct.h}); const st=j.state;
    if(st&&(st.updatedAt||0)>BOOT_UPD&&!RUN){ const keep={acct:S.acct,syncUrl:S.syncUrl,lang:S.lang}; S=Object.assign(fresh(),st,keep); S.syncInfo={ok:Date.now(),pulled:true}; saveLocal(); return true }
    S.syncInfo={ok:Date.now()}; saveLocal(); return false }
  catch(e){ S.syncInfo={err:e.code||String(e),at:Date.now()}; saveLocal(); return false } }
addEventListener('pagehide',()=>{ try{ if(S.acct&&!S.acct.pending&&syncUrl()&&navigator.sendBeacon){ S.updatedAt=Date.now(); saveLocal(); navigator.sendBeacon(syncUrl(),new Blob([JSON.stringify({action:'save',login:S.acct.login,h:S.acct.h,state:syncState(),summary:progressSummary(),meta:syncMeta()})],{type:'text/plain'})) } }catch(e){} });

  const start=(name,year)=>{ S.child={name,birthYear:+year}; saveLocal(); renderHome() };
  const btn=$('#setupGo');
  btn.onclick=async()=>{ err('');
    if(tab==='guest'){ const n=$('#setupName').value.trim(); if(!n) return err('Nhập tên của bé nhé.'); return start(n,$('#setupYear').value) }
    if(tab==='login'){ const lg=cleanLogin($('#lgName').value), pin=$('#lgPin').value.trim(); if(!loginOk(lg)) return err('Nhập tên đăng nhập (3–20 chữ thường, số).'); if(!/^\d{4}$/.test(pin)) return err('Mã PIN gồm 4 chữ số.');
      btn.disabled=true; btn.textContent='Đang tải tiến độ…';
      try{ const h=pinHash(lg,pin); const j=await api('load',{login:lg,h}); const keep={syncUrl:S.syncUrl,lang:S.lang};
        S=Object.assign(fresh(),j.state||{},keep,{acct:{login:lg,h,email:j.email||''},child:(j.state&&j.state.child)||{name:j.child||lg,birthYear:+j.birthYear||yNow-5}}); S.syncInfo={ok:Date.now(),pulled:true}; saveLocal(); renderHome() }
      catch(e){ btn.disabled=false; btn.textContent='Đăng nhập'; err(ACCT_ERR[e.code]||ACCT_ERR.fail) } return }
    // register
    const n=$('#setupName').value.trim(), y=$('#setupYear').value, lg=cleanLogin($('#rgLogin').value), pin=$('#rgPin').value.trim(), em=$('#rgEmail').value.trim();
    if(!n) return err('Nhập tên của bé nhé.'); if(!loginOk(lg)) return err('Tên đăng nhập: 3–20 chữ thường không dấu, số, dấu chấm hoặc gạch.'); if(!/^\d{4}$/.test(pin)) return err('Mã PIN gồm 4 chữ số.'); if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return err('Email chưa đúng.');
    const keepProgress=!!(S.child&&S.attempts&&S.attempts.length);   // a guest who now makes an account keeps what was played
    if(!keepProgress){ const keep={syncUrl:S.syncUrl,lang:S.lang,consentMic:S.consentMic}; S=Object.assign(fresh(),keep) }
    S.child={name:n,birthYear:+y}; S.acct={login:lg,h:pinHash(lg,pin),email:em,pending:true}; S.updatedAt=Date.now();
    if(!syncUrl()){ saveLocal(); renderHome(); return }   // no sheet yet: the account is sent when an address is set
    btn.disabled=true; btn.textContent='Đang tạo tài khoản…';
    try{ await api('register',{login:lg,h:S.acct.h,child:n,birthYear:+y,email:em,state:syncState(),summary:progressSummary(),meta:syncMeta()}); S.acct.pending=false; S.syncInfo={ok:Date.now()}; saveLocal(); renderHome() }
    catch(e){ btn.disabled=false; btn.textContent='Tạo tài khoản và bắt đầu'; if(e.code==='taken'){ S.acct=null; return err(ACCT_ERR.taken) } if(e.code==='net'){ saveLocal(); err(ACCT_ERR.net+' Bé vẫn chơi được; tài khoản sẽ được gửi lại sau.'); setTimeout(renderHome,2200); return } S.acct=null; err(ACCT_ERR[e.code]||ACCT_ERR.fail) } };
}

/* =========================================================
   FUN MIX (17/10): a short play (about 3–4 minutes) mixing what the child already knows with what needs practice.
   Order: an easy one → another easy one → two to practise → an easy one → one to practise → one unlocked game.
   Review schedule for each skill (3 → 7 → 21 days): a right answer on or after its review day moves it one step
   further; a wrong answer brings it back to "practise now". New mistakes come first, then skills due for review,
   then the ones mastered most recently.
   ========================================================= */
const REV_DAYS=[0,3,7,21];
const addDays=(d,n)=>{ const t=new Date(d+'T12:00:00'); t.setDate(t.getDate()+n); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0') };
function revNote(id,ok){ S.rev=S.rev||{}; const r=S.rev[id]||(S.rev[id]={box:0,due:today()}); const d=today();
  if(!ok){ r.box=0; r.due=d; r.miss=d; return }
  if(r.due<=d){ r.box=Math.min(3,r.box+1); r.due=addDays(d,REV_DAYS[r.box]); r.ok=d } }

/* FUN MIX CATALOGUE (20/10): every level registers short review turns that use its own scene, friends and way of playing
   (the same pictures the child met there). Fun Mix only uses turns from levels the child has finished; a skill with no turn
   here falls back to the general quick questions below. Add the turns of each new level here. */
const MIXQ=[]; const mixQ=(level,skill,what,run)=>MIXQ.push({level,skill,what,run});
mixQ(0,'L2.W.FEEL.01','school: friends hiding in the bushes, find the face',()=>bushFaces(SK['L2.W.FEEL.01'],1));
mixQ(0,'L2.M.NUM.02','school garden: count the flags',()=>gardenFlags());
mixQ(0,'L2.E.WR.02','school: draw the road, the water, the slide or the bridge',()=>GAMES.trace(SK['L2.E.WR.02'],1,{skins:[pick([...EP0_TRACE1,...EP0_TRACE2])],intro:['Let’s draw a line, like at school!','Mình vẽ một đường, như ở trường nhé!']}));
mixQ(1,'L2.W.FEEL.01','park: pop the bubbles with the right face',()=>bubbleFaces({rounds:1,polly:false}));
mixQ(1,'L2.W.FEEL.02','park: the balloon man’s balloon for the excited / surprised friend',()=>balloonMan(SK['L2.W.FEEL.02'],1));
mixQ(1,'L2.M.NUM.02','park: pop the balloons stuck in the tree, and count',()=>popCover({gusts:1}));
mixQ(1,'L2.E.WR.02','park: Na’s kite string, down or across',()=>GAMES.trace(SK['L2.E.WR.02'],1,{skins:[pick(EP1_TRACE)],intro:['Na wants to fly her kite!','Na muốn thả diều!']}));
mixQ(2,'L2.W.FEEL.02','garden at night: which lantern’s music sounds excited / has a surprise',()=>lanternMusic({rounds:1}));
mixQ(2,'L2.M.NUM.05','garden at night: a ladybug lands for a moment; the card with the same dots',()=>ladybugDots(SK['L2.M.NUM.05'],1));
mixQ(2,'L2.M.NUM.05','garden at night: Na’s drum, one beat for each dot',()=>EXTRA.flash.drum(SK['L2.M.NUM.05'],1));
mixQ(3,'L2.M.SORT.01','Na’s room: put the crayons in the cup of the same colour',()=>crayonSort());
mixQ(3,'L2.M.SORT.02','Na’s room: tidy up, big toys and small toys',()=>tidyUp());
mixQ(3,'L2.M.NUM.05','Na’s room: Lam’s domino, look quickly and match the dots',()=>dominoes(SK['L2.M.NUM.05'],1));
mixQ(3,'L2.M.POS.01','Na’s room: the kitten is on / under the bed, in the basket',()=>kittenHide(SK['L2.M.POS.01'],1));
/* the skills a quick question can be made for, and how to make one */
const MIX_FMT={findNumeral:['tap'],flash:['card','ladybug','dice'],findFeeling:['tap','story'],question:['mixed'],routine:['when'],sounds:['hear'],clap:['count'],position:['find']};
function mixMakers(){ const played=new Set(S.attempts.map(a=>a.s)); const out=[]; const done=S.done||{};
  for(const sk of SKILLS){ if(!played.has(sk.id)) continue;
    const own=MIXQ.filter(q=>q.skill===sk.id&&done[q.level]);
    if(own.length) out.push({sk,run:()=>inMode('review',()=>pick(own).run(),sk.id)});
    else if(sk.id==='L2.M.NUM.02') out.push({sk,run:()=>mixCount(sk)});
    else if(MAKE[sk.game]&&MIX_FMT[sk.game]){ const F=MIX_FMT[sk.game].filter(f=>choiceFmts(sk.game).includes(f)); if(F.length) out.push({sk,run:()=>kidRound(sk,MAKE[sk.game](sk,1,pick(F),{}))}) } }
  return out }
const accOf=id=>{ const a=S.attempts.filter(x=>x.s===id).slice(-8); return a.length?a.filter(x=>x.ok).length/a.length:1 };
function mixPlan(){ const all=mixMakers(); if(!all.length) return null; const d=today(), R=S.rev||{};
  const rank=m=>{ const r=R[m.sk.id]; if(r&&r.miss&&r.box===0) return 0; if(r&&r.due<=d) return 1; if(r&&r.ok) return 2; return 3 };
  const weak=all.slice().sort((a,b)=>rank(a)-rank(b)||accOf(a.sk.id)-accOf(b.sk.id)||(((R[b.sk.id]||{}).ok||'')>((R[a.sk.id]||{}).ok||'')?1:-1));
  const practise=weak.slice(0,3), rest=all.filter(m=>!practise.includes(m));
  const easy=(rest.length?rest:all).slice().sort((a,b)=>accOf(b.sk.id)-accOf(a.sk.id)).slice(0,3);
  const P=i=>practise[i%practise.length], E=i=>easy[i%easy.length];
  return [E(0),E(1),P(0),P(1),E(2),P(2)] }

/* count objects in a small picture (up to 5, Chapter 1) */
async function mixCount(sk){ const n=3+rand(3); const SC=pick([['park','balloon'],['beach','star'],['yard','flag']]); const pic=scenePic(SC[0],[]);
  const sky=SC[1]==='balloon'; const spots=shuffle(sky?[[22,40],[36,58],[50,44],[64,62],[78,46],[88,60],[42,28],[70,30]]:[[20,5],[34,12],[48,4],[60,13],[72,5],[86,11],[42,20],[66,21]]).slice(0,n);
  const art=()=>SC[1]==='balloon'?ART.balloon(pick(PAL)):SC[1]==='star'?ART.star(pick(PAL)):FLAG(pick(PAL));
  await countInPic(sk,{pic,n,items:spots.map(([x,b])=>[x,b,SC[1]==='star'?11:20,art()]),ask:SC[1]==='balloon'?['How many balloons? Tap each balloon and count!','Có mấy quả bóng bay? Con chạm từng quả và đếm nhé!']:SC[1]==='star'?['How many starfish? Tap each starfish and count!','Có mấy con sao biển? Con chạm từng con và đếm nhé!']:['How many flags? Tap each flag and count!','Có mấy lá cờ? Con chạm từng lá và đếm nhé!'],
    answer:SC[1]==='balloon'?[`${cap(W[n])} balloons!`,`${cap(VI_N[n])} quả bóng bay!`]:SC[1]==='star'?[`${cap(W[n])} starfish!`,`${cap(VI_N[n])} con sao biển!`]:[`${cap(W[n])} flags!`,`${cap(VI_N[n])} lá cờ!`]}) }
